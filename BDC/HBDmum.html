<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#13283b">

<title>Bon anniversaire Maman</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:Arial, Helvetica, sans-serif;

    background:
        #13283b
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif.jpg")
        repeat;

    background-size:300px;

    overflow-x:hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:100%;
    max-width:620px;

    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(70px + env(safe-area-inset-bottom));
}


/* =========================================================
   TITRE
   ========================================================= */

.header{
    width:100%;

    text-align:center;

    margin-bottom:24px;
}

.header img{
    display:block;

    width:100%;
    max-width:420px;
    height:auto;

    margin:0 auto;
}


/* =========================================================
   LISTE
   ========================================================= */

.video-list{
    display:flex;
    flex-direction:column;

    gap:36px;
}

.video-card{
    width:100%;
}


/* =========================================================
   VIDEO / CADEAU
   ========================================================= */

.video-wrapper{
    position:relative;

    width:82%;

    margin:0 auto;
}

.video-wrapper.vertical{
    aspect-ratio:9 / 16;
}

.video-wrapper.horizontal{
    width:88%;

    aspect-ratio:16 / 9;
}


/* =========================================================
   VIDEO
   ========================================================= */

.main-video{
    position:absolute;
    inset:0;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;

    border-radius:14px;
}


/* =========================================================
   CADEAU
   ========================================================= */

.gift-cover{
    position:absolute;
    inset:0;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    opacity:1;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.gift-package{
    position:relative;

    width:100%;
    height:100%;

    filter:
        drop-shadow(
            0 14px 18px rgba(0,0,0,.42)
        );

    transition:
        filter .45s ease;
}

.gift-image{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    border-radius:14px;
}


/* =========================================================
   TEXTE CADEAU
   ========================================================= */

.gift-hint{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    padding:9px 16px;

    white-space:nowrap;

    border-radius:30px;

    background:
        rgba(0,0,0,.58);

    color:#fff;

    font-size:13px;
    font-weight:bold;

    box-shadow:
        0 3px 10px rgba(0,0,0,.2);

    pointer-events:none;
}


/* =========================================================
   OUVERTURE
   ========================================================= */

.gift-cover.opening{
    opacity:0;

    transform:scale(1.035);

    pointer-events:none;
}

.gift-cover.opening .gift-package{
    filter:
        drop-shadow(
            0 0 0 rgba(0,0,0,0)
        );
}


/* =========================================================
   ACTIONS
   ========================================================= */

.action-zone{
    width:100%;

    padding-top:14px;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-wrap:wrap;

    gap:9px;
}

.action-btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:40px;

    padding:9px 17px;

    border:0;

    border-radius:22px;

    font-family:inherit;

    font-size:13px;
    font-weight:bold;

    text-decoration:none;

    cursor:pointer;

    color:#fff;

    background:#9f80a6;

    box-shadow:
        0 4px 10px rgba(0,0,0,.20);
}

.reply-btn{
    background:#e26183;
}

.hidden{
    display:none !important;
}


/* =========================================================
   MODULE REPONSE
   ========================================================= */

.reply-panel{
    display:none;

    width:90%;

    margin:20px auto 0;

    padding:14px;

    background:
        rgba(9,20,31,.96);

    border-radius:18px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.32);
}

.reply-panel.visible{
    display:block;
}

.reply-title{
    margin-bottom:6px;

    color:#fff;

    font-size:17px;
    font-weight:bold;

    text-align:center;
}

.reply-info{
    margin-bottom:13px;

    color:
        rgba(255,255,255,.78);

    font-size:12px;
    line-height:1.45;

    text-align:center;
}


/* =========================================================
   CHOIX COURONNES
   ========================================================= */

.crown-zone{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:6px;

    margin-bottom:12px;
}

.crown-btn{
    min-height:44px;

    padding:6px 4px;

    border:
        1px solid
        rgba(255,255,255,.22);

    border-radius:13px;

    background:
        rgba(255,255,255,.07);

    color:#fff;

    font-family:inherit;

    font-size:11px;
    font-weight:bold;

    cursor:pointer;
}

.crown-btn.active{
    background:#e26183;

    border-color:#e26183;
}

.crown-icon{
    display:block;

    margin-bottom:2px;

    font-size:18px;
}


/* =========================================================
   CAMERA
   ========================================================= */

.camera-frame{
    position:relative;

    width:100%;

    aspect-ratio:9 / 16;

    overflow:hidden;

    background:#000;

    border-radius:14px;
}

#cameraSource{
    display:none;
}

#partyCanvas{
    display:block;

    width:100%;
    height:100%;

    background:#000;
}

#recordedPreview{
    display:none;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}


/* =========================================================
   COMPTEUR
   ========================================================= */

.record-time{
    position:absolute;

    top:10px;
    left:50%;

    z-index:20;

    transform:translateX(-50%);

    display:none;

    padding:6px 11px;

    border-radius:20px;

    background:
        rgba(0,0,0,.72);

    color:#fff;

    font-size:13px;
    font-weight:bold;
}

.record-time.visible{
    display:block;
}


/* =========================================================
   COMMANDES
   ========================================================= */

.camera-actions{
    display:flex;

    justify-content:center;
    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}

.camera-btn{
    min-height:42px;

    padding:9px 15px;

    border:0;

    border-radius:22px;

    font-family:inherit;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;
}

.camera-btn.primary{
    background:#e26183;

    color:#fff;
}

.camera-btn.secondary{
    background:#fff;

    color:#253344;
}

.camera-btn.send{
    background:#6fa773;

    color:#fff;
}

.camera-btn:disabled{
    opacity:.45;

    cursor:default;
}


/* =========================================================
   ETAT
   ========================================================= */

.status-message{
    display:none;

    margin-top:12px;

    padding:11px;

    border-radius:12px;

    background:
        rgba(255,255,255,.10);

    color:#fff;

    font-size:12px;
    line-height:1.45;

    text-align:center;
}

.status-message.visible{
    display:block;
}


/* =========================================================
   RETOUR HAUT
   ========================================================= */

.back-to-top{
    position:fixed;

    right:16px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:100;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:
        rgba(80,52,84,.9);

    color:#fff;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.3);

    opacity:0;

    visibility:hidden;

    transform:translateY(10px);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;
}

.back-to-top.visible{
    opacity:1;

    visibility:visible;

    transform:translateY(0);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:380px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .video-wrapper{
        width:80%;
    }

    .video-wrapper.horizontal{
        width:88%;
    }

    .reply-panel{
        width:94%;
    }

    .crown-btn{
        font-size:10px;
    }

}

</style>

</head>


<body>


<main
    class="page"
    id="top"
>


<header class="header">

    <img
        src="https://avantpost-cpu.github.io/depot-quiz/BDC/titre.png"
        alt="Bon anniversaire Maman"
    >

</header>


<section
    class="video-list"
    id="videoList"
></section>



<!-- =====================================================
     REPONSE TEST VIDEO 8
     ===================================================== -->

<div
    class="reply-panel"
    id="replyPanel"
>

    <div class="reply-title">
        Ta réponse vidéo
    </div>


    <div class="reply-info">
        Choisis ta couronne, enregistre ton message puis partage directement ta vidéo.
    </div>


    <div class="crown-zone">

        <button
            class="crown-btn"
            data-crown="none"
            type="button"
        >

            <span class="crown-icon">
                🙂
            </span>

            Normal

        </button>


        <button
            class="crown-btn active"
            data-crown="roses"
            type="button"
        >

            <span class="crown-icon">
                🌹
            </span>

            Roses

        </button>


        <button
            class="crown-btn"
            data-crown="neon"
            type="button"
        >

            <span class="crown-icon">
                👑
            </span>

            Néon

        </button>


        <button
            class="crown-btn"
            data-crown="unicorn"
            type="button"
        >

            <span class="crown-icon">
                🦄
            </span>

            Licorne

        </button>

    </div>


    <video
        id="cameraSource"
        autoplay
        muted
        playsinline
    ></video>


    <div class="camera-frame">

        <canvas
            id="partyCanvas"
            width="720"
            height="1280"
        ></canvas>


        <video
            id="recordedPreview"
            controls
            playsinline
        ></video>


        <div
            class="record-time"
            id="recordTime"
        >
            00:00
        </div>

    </div>


    <div class="camera-actions">

        <button
            class="camera-btn primary"
            id="startRecord"
            type="button"
        >
            ● Enregistrer
        </button>


        <button
            class="camera-btn secondary"
            id="stopRecord"
            type="button"
            disabled
        >
            Terminer
        </button>


        <button
            class="camera-btn secondary"
            id="restartRecord"
            type="button"
            style="display:none;"
        >
            Recommencer
        </button>


        <button
            class="camera-btn send"
            id="shareRecord"
            type="button"
            style="display:none;"
        >
            Envoyer ma réponse
        </button>

    </div>


    <div
        class="status-message"
        id="statusMessage"
    ></div>

</div>


</main>



<button
    class="back-to-top"
    id="backToTop"
    aria-label="Retour en haut"
>
    ↑
</button>



<script type="module">

/* =========================================================
   MEDIAPIPE
   ========================================================= */

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";


/* =========================================================
   DONNEES
   ========================================================= */

const BASE =
    "https://avantpost-cpu.github.io/depot-quiz/BDC/";


const cards = [

    {
        video:"mamie.mp4",
        pack:"pack1.jpg",
        format:"vertical"
    },

    {
        video:"tata.mp4",
        pack:"pack2.jpg",
        format:"horizontal"
    },

    {
        video:"raoul.mp4",
        pack:"pack3.jpg",
        format:"vertical"
    },

    {
        video:"claire.mp4",
        pack:"pack4.jpg",
        format:"vertical"
    },

    {
        video:"osaka.mp4",
        pack:"pack5.jpg",
        format:"vertical"
    },

    {
        video:"marcel.mp4",
        pack:"pack6.jpg",
        format:"vertical"
    },

    {
        video:"couple.mp4",
        pack:"pack7.jpg",
        format:"vertical"
    },

    {
        video:"test.mp4",
        pack:"pack8.jpg",
        format:"vertical",
        reply:true
    }

];


/* =========================================================
   CONSTRUCTION CARTES
   ========================================================= */

const videoList =
    document.getElementById(
        "videoList"
    );


cards.forEach(
    (item,index) => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "video-card";


        card.dataset.index =
            index;


        card.innerHTML = `

            <div
                class="video-wrapper ${item.format}"
            >

                <video
                    class="main-video"
                    controls
                    playsinline
                    preload="none"
                    data-src="${BASE}${item.video}"
                ></video>


                <div class="gift-cover">

                    <div class="gift-package">

                        <img
                            class="gift-image"
                            src="${BASE}${item.pack}"
                            alt=""
                        >

                    </div>


                    <div class="gift-hint">
                        Ouvre ton cadeau
                    </div>

                </div>

            </div>


            <div class="action-zone">

                <a
                    class="action-btn"
                    href="${BASE}${item.video}"
                    download="${item.video}"
                >
                    ↓ Télécharger
                </a>


                ${
                    item.reply
                    ?
                    `
                    <button
                        class="action-btn reply-btn hidden"
                        type="button"
                    >
                        Répondre en vidéo
                    </button>
                    `
                    :
                    ""
                }

            </div>

        `;


        videoList.appendChild(
            card
        );

    }
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const mainVideos =
    document.querySelectorAll(
        ".main-video"
    );


const giftCovers =
    document.querySelectorAll(
        ".gift-cover"
    );


const testCard =
    document.querySelector(
        '.video-card[data-index="7"]'
    );


const replyButton =
    testCard.querySelector(
        ".reply-btn"
    );


const replyPanel =
    document.getElementById(
        "replyPanel"
    );


const cameraSource =
    document.getElementById(
        "cameraSource"
    );


const canvas =
    document.getElementById(
        "partyCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const recordedPreview =
    document.getElementById(
        "recordedPreview"
    );


const startRecord =
    document.getElementById(
        "startRecord"
    );


const stopRecord =
    document.getElementById(
        "stopRecord"
    );


const restartRecord =
    document.getElementById(
        "restartRecord"
    );


const shareRecord =
    document.getElementById(
        "shareRecord"
    );


const recordTime =
    document.getElementById(
        "recordTime"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const crownButtons =
    document.querySelectorAll(
        ".crown-btn"
    );


const backToTop =
    document.getElementById(
        "backToTop"
    );


/* =========================================================
   VARIABLES
   ========================================================= */

let cameraStream =
    null;


let faceLandmarker =
    null;


let trackingReady =
    false;


let trackingLoading =
    false;


let latestLandmarks =
    null;


let selectedCrown =
    "roses";


let recorder =
    null;


let outputStream =
    null;


let chunks =
    [];


let recordedFile =
    null;


let objectURL =
    null;


let animationFrame =
    null;


let timer =
    null;


let secondsRecorded =
    0;


let lastDetection =
    0;


/* =========================================================
   CONFETTIS
   ========================================================= */

const confetti =
    Array.from(
        {
            length:42
        },
        () => ({

            x:
                Math.random()
                *
                720,

            y:
                Math.random()
                *
                1280,

            speed:
                1
                +
                Math.random()
                *
                2,

            size:
                5
                +
                Math.random()
                *
                8,

            color:[
                "#ef79a6",
                "#ffd34e",
                "#ffffff",
                "#73d5dd"
            ][
                Math.floor(
                    Math.random()
                    *
                    4
                )
            ]

        })
    );


/* =========================================================
   CHARGEMENT VIDEO
   ========================================================= */

const observer =
    new IntersectionObserver(

        entries => {

            entries.forEach(
                entry => {

                    if(
                        !entry.isIntersecting
                    ){
                        return;
                    }


                    const video =
                        entry.target;


                    if(
                        !video.src
                        &&
                        video.dataset.src
                    ){

                        video.src =
                            video.dataset.src;

                        video.load();

                    }


                    observer.unobserve(
                        video
                    );

                }
            );

        },

        {
            rootMargin:"350px 0px"
        }

    );


mainVideos.forEach(
    video =>
        observer.observe(
            video
        )
);


/* =========================================================
   OUVERTURE CADEAUX
   ========================================================= */

giftCovers.forEach(
    gift => {

        gift.addEventListener(
            "click",
            async () => {

                const card =
                    gift.closest(
                        ".video-card"
                    );


                const video =
                    card.querySelector(
                        ".main-video"
                    );


                if(
                    !video.src
                ){

                    video.src =
                        video.dataset.src;

                    video.load();

                }


                gift.classList.add(
                    "opening"
                );


                if(
                    card.dataset.index
                    ===
                    "7"
                ){

                    replyButton
                        .classList
                        .remove(
                            "hidden"
                        );

                }


                try{

                    await video.play();

                }
                catch(error){}


                setTimeout(
                    () => {

                        gift.style.display =
                            "none";

                    },
                    450
                );

            }
        );

    }
);


/* =========================================================
   UNE SEULE VIDEO
   ========================================================= */

mainVideos.forEach(
    video => {

        video.addEventListener(
            "play",
            () => {

                mainVideos.forEach(
                    other => {

                        if(
                            other !== video
                            &&
                            !other.paused
                        ){

                            other.pause();

                        }

                    }
                );

            }
        );

    }
);


/* =========================================================
   SELECTION COURONNE
   ========================================================= */

crownButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                selectedCrown =
                    button.dataset.crown;


                crownButtons.forEach(
                    b =>
                        b.classList
                            .remove(
                                "active"
                            )
                );


                button
                    .classList
                    .add(
                        "active"
                    );


                if(
                    selectedCrown
                    !==
                    "none"
                ){

                    initTracking();

                }

            }
        );

    }
);


/* =========================================================
   OUVRIR CAMERA
   ========================================================= */

replyButton.addEventListener(
    "click",
    async () => {

        testCard
            .querySelector(
                ".main-video"
            )
            .pause();


        testCard.insertAdjacentElement(
            "afterend",
            replyPanel
        );


        replyPanel.classList.add(
            "visible"
        );


        try{

            cameraStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video:{
                            facingMode:"user",

                            width:{
                                ideal:720
                            },

                            height:{
                                ideal:1280
                            },

                            frameRate:{
                                ideal:30
                            }
                        },

                        audio:true

                    });


            cameraSource.srcObject =
                cameraStream;


            await cameraSource.play();


            canvas.style.display =
                "block";


            recordedPreview.style.display =
                "none";


            drawFrame();


            initTracking();


            replyPanel.scrollIntoView({

                behavior:"smooth",

                block:"center"

            });

        }
        catch(error){

            showStatus(
                "Impossible d'accéder à la caméra ou au micro."
            );

        }

    }
);


/* =========================================================
   MEDIAPIPE
   ========================================================= */

async function initTracking(){

    if(
        trackingReady
        ||
        trackingLoading
    ){
        return;
    }


    trackingLoading =
        true;


    showStatus(
        "Chargement du suivi du visage…"
    );


    try{

        const vision =
            await FilesetResolver
                .forVisionTasks(

                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

                );


        faceLandmarker =
            await FaceLandmarker
                .createFromOptions(

                    vision,

                    {

                        baseOptions:{

                            modelAssetPath:
                                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                            delegate:"GPU"

                        },

                        runningMode:"VIDEO",

                        numFaces:1

                    }

                );


        trackingReady =
            true;


        hideStatus();

    }
    catch(error){

        console.error(
            error
        );


        showStatus(
            "Le décor fonctionne mais le suivi du visage n'a pas pu être chargé."
        );

    }
    finally{

        trackingLoading =
            false;

    }

}


/* =========================================================
   DESSIN CAMERA
   ========================================================= */

function drawFrame(){

    const W =
        canvas.width;


    const H =
        canvas.height;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    if(
        cameraSource.readyState
        >=
        2
    ){

        drawCameraCover(
            W,
            H
        );

    }


    if(
        trackingReady
        &&
        selectedCrown
        !==
        "none"
    ){

        const now =
            performance.now();


        if(
            now
            -
            lastDetection
            >
            60
        ){

            lastDetection =
                now;


            try{

                const result =
                    faceLandmarker
                        .detectForVideo(

                            cameraSource,

                            now

                        );


                if(
                    result.faceLandmarks
                    &&
                    result.faceLandmarks[0]
                ){

                    latestLandmarks =
                        result.faceLandmarks[0];

                }

            }
            catch(error){}

        }

    }


    if(
        selectedCrown
        !==
        "none"
    ){

        drawPartyDecor();


        if(
            latestLandmarks
        ){

            drawSelectedCrown(
                latestLandmarks
            );

        }

    }


    animationFrame =
        requestAnimationFrame(
            drawFrame
        );

}


/* =========================================================
   CAMERA COVER MIROIR
   ========================================================= */

function drawCameraCover(
    W,
    H
){

    const vw =
        cameraSource.videoWidth;


    const vh =
        cameraSource.videoHeight;


    const vr =
        vw / vh;


    const cr =
        W / H;


    let dw;
    let dh;
    let dx;
    let dy;


    if(
        vr > cr
    ){

        dh =
            H;


        dw =
            H * vr;


        dx =
            (
                W - dw
            )
            /
            2;


        dy =
            0;

    }
    else{

        dw =
            W;


        dh =
            W / vr;


        dx =
            0;


        dy =
            (
                H - dh
            )
            /
            2;

    }


    ctx.save();


    ctx.translate(
        W,
        0
    );


    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(

        cameraSource,

        dx,
        dy,
        dw,
        dh

    );


    ctx.restore();

}


/* =========================================================
   DECOR

function drawPartyDecor(){

    const W =
        canvas.width;


    const H =

    confetti.forEach(

            );

    );


    gradient.addColorStop(
        1,
        "rgba(0,0,0,.42)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(

        0,
        H * .62,

        W,
        H * .38

    );


    ctx.textAlign =
        "center";


    ctx.fillStyle =
        "#ffffff";


    ctx.font =
        "bold 62px Arial";


    ctx.fillText(

        "MERCI ❤️",

        W / 2,

        H - 105

    );


    ctx.font =
        "28px Arial";


    ctx.fillText(

        "pour ton message",

        W / 2,

        H - 62

    );

}


/* =========================================================
   POSITION COURONNE
   ========================================================= */

function getCrownTransform(
    landmarks
){

    const W =
        canvas.width;


    const H =
        canvas.height;


    const eyeA =
        landmarks[33];


    const eyeB =
        landmarks[263];


    /*
       point supérieur du front
    */

    const forehead =
        landmarks[10];


    const ax =
        (
            1
            -
            eyeA.x
        )
        *
        W;


    const ay =
        eyeA.y
        *
        H;


    const bx =
        (
            1
            -
            eyeB.x
        )
        *
        W;


    const by =
        eyeB.y
        *
        H;


    const fx =
        (
            1
            -
            forehead.x
        )
        *
        W;


    const fy =
        forehead.y
        *
        H;


    const eyeDistance =
        Math.hypot(

            bx - ax,

            by - ay

        );


    const angle =
        Math.atan2(

            by - ay,

            bx - ax

        );


    /*
       IMPORTANT :
       la couronne est remontée
       par rapport au sommet du front
    */

    return {

        x:fx,

        y:
            fy
            -
            eyeDistance
            *
            .52,

        width:
            eyeDistance
            *
            2.55,

        angle:angle

    };

}


/* =========================================================
   DESSIN MODELE CHOISI
   ========================================================= */

function drawSelectedCrown(
    landmarks
){

    const p =
        getCrownTransform(
            landmarks
        );


    switch(
        selectedCrown
    ){

        case "roses":

            drawRoseCrown(
                p
            );

            break;


        case "neon":

            drawNeonCrown(
                p
            );

            break;


        case "unicorn":

            drawUnicornCrown(
                p
            );

            break;

    }

}


/* =========================================================
   COURONNE ROSES
   ========================================================= */

function drawRoseCrown(
    p
){

    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    ctx.rotate(
        p.angle
    );


    const w =
        p.width;


    const flowerCount =
        7;


    for(
        let i = 0;
        i < flowerCount;
        i++
    ){

        const t =
            i
            /
            (
                flowerCount
                -
                1
            );


        const x =
            -w * .42
            +
            t
            *
            w * .84;


        const curve =
            Math.pow(
                (
                    t - .5
                )
                *
                2,
                2
            );


        const y =
            curve
            *
            w
            *
            .09;


        const r =
            w
            *
            (
                i === 3
                ?
                .115
                :
                .09
            );


        drawFlower(
            x,
            y,
            r,
            i % 2
                ?
                "#f8b7c5"
                :
                "#f0678c"
        );

    }


    /*
       feuilles
    */

    ctx.fillStyle =
        "#3f783e";


    for(
        let i = 0;
        i < 8;
        i++
    ){

        const x =
            -w * .38
            +
            i
            *
            w * .11;


        ctx.save();


        ctx.translate(
            x,
            w * .07
        );


        ctx.rotate(
            i % 2
                ?
                .5
                :
                -.5
        );


        ctx.beginPath();


        ctx.ellipse(

            0,
            0,

            w * .035,
            w * .07,

            0,
            0,
            Math.PI * 2

        );


        ctx.fill();


        ctx.restore();

    }


    ctx.restore();

}


/* =========================================================
   FLEUR
   ========================================================= */

function drawFlower(
    x,
    y,
    radius,
    color
){

    ctx.save();


    ctx.translate(
        x,
        y
    );


    for(
        let i = 0;
        i < 8;
        i++
    ){

        const a =
            i
            /
            8
            *
            Math.PI
            *
            2;


        ctx.beginPath();


        ctx.ellipse(

            Math.cos(a)
            *
            radius
            *
            .4,

            Math.sin(a)
            *
            radius
            *
            .4,

            radius * .42,
            radius * .25,

            a,
            0,
            Math.PI * 2

        );


        ctx.fillStyle =
            color;


        ctx.fill();

    }


    ctx.beginPath();


    ctx.arc(

        0,
        0,

        radius * .32,

        0,
        Math.PI * 2

    );


    ctx.fillStyle =
        "#ffd6a0";


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   COURONNE NEON
   ========================================================= */

function drawNeonCrown(
    p
){

    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    ctx.rotate(
        p.angle
    );


    const w =
        p.width;


    const h =
        w * .48;


    ctx.strokeStyle =
        "#fff8a0";


    ctx.lineWidth =
        Math.max(
            5,
            w * .025
        );


    ctx.lineJoin =
        "round";


    ctx.shadowColor =
        "#ffc400";


    ctx.shadowBlur =
        w * .10;


    ctx.beginPath();


    ctx.moveTo(
        -w / 2,
        h * .38
    );


    ctx.lineTo(
        -w * .42,
        -h * .28
    );


    ctx.lineTo(
        -w * .20,
        h * .03
    );


    ctx.lineTo(
        0,
        -h * .53
    );


    ctx.lineTo(
        w * .20,
        h * .03
    );


    ctx.lineTo(
        w * .42,
        -h * .28
    );


    ctx.lineTo(
        w / 2,
        h * .38
    );


    ctx.quadraticCurveTo(

        0,
        h * .15,

        -w / 2,
        h * .38

    );


    ctx.stroke();


    const points = [

        [-w*.42,-h*.28],
        [-w*.20,h*.03],
        [0,-h*.53],
        [w*.20,h*.03],
        [w*.42,-h*.28]

    ];


    points.forEach(
        point => {

            ctx.beginPath();


            ctx.arc(

                point[0],
                point[1],

                w * .038,

                0,
                Math.PI * 2

            );


            ctx.stroke();

        }
    );


    ctx.shadowBlur =
        0;


    ctx.restore();

}


/* =========================================================
   COURONNE LICORNE
   ========================================================= */

function drawUnicornCrown(
    p
){

    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    ctx.rotate(
        p.angle
    );


    const w =
        p.width;


    /*
       oreilles
    */

    drawUnicornEar(
        -w * .31,
        0,
        -0.20,
        w
    );


    drawUnicornEar(
        w * .31,
        0,
        0.20,
        w
    );


    /*
       corne
    */

    ctx.beginPath();


    ctx.moveTo(
        -w * .075,
        0
    );


    ctx.lineTo(
        0,
        -w * .55
    );


    ctx.lineTo(
        w * .075,
        0
    );


    ctx.closePath();


    const horn =
        ctx.createLinearGradient(

            -w * .05,
            0,

            w * .05,
            -w * .5

        );


    horn.addColorStop(
        0,
        "#db9b19"
    );


    horn.addColorStop(
        .5,
        "#fff0a7"
    );


    horn.addColorStop(
        1,
        "#d28b0c"
    );


    ctx.fillStyle =
        horn;


    ctx.fill();


    /*
       spirales corne
    */

    ctx.strokeStyle =
        "rgba(130,70,0,.45)";


    ctx.lineWidth =
        w * .012;


    for(
        let i = 1;
        i <= 4;
        i++
    ){

        const y =
            -w
            *
            .10
            *
            i;


        ctx.beginPath();


        ctx.moveTo(
            -w * .045,
            y
        );


        ctx.lineTo(
            w * .045,
            y - w * .035
        );


        ctx.stroke();

    }


    /*
       fleurs
    */

    const flowerData = [

        [-.25,"#ef76a6"],
        [-.12,"#8c62ca"],
        [0,"#f0649a"],
        [.12,"#56bfcf"],
        [.25,"#ef76a6"]

    ];


    flowerData.forEach(
        f => {

            drawFlower(

                f[0]
                *
                w,

                w * .04,

                w * .075,

                f[1]

            );

        }
    );


    ctx.restore();

}


/* =========================================================
   OREILLE LICORNE
   ========================================================= */

function drawUnicornEar(
    x,
    y,
    rotation,
    w
){

    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.rotate(
        rotation
    );


    ctx.beginPath();


    ctx.moveTo(
        -w * .09,
        0
    );


    ctx.lineTo(
        0,
        -w * .30
    );


    ctx.lineTo(
        w * .09,
        0
    );


    ctx.closePath();


    ctx.fillStyle =
        "#fff5f7";


    ctx.fill();


    ctx.beginPath();


    ctx.moveTo(
        -w * .045,
        -w * .02
    );


    ctx.lineTo(
        0,
        -w * .22
    );


    ctx.lineTo(
        w * .045,
        -w * .02
    );


    ctx.closePath();


    ctx.fillStyle =
        "#f29abb";


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   MIME
   ========================================================= */

function getMime(){

    const types = [

        "video/mp4",

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    for(
        const type
        of
        types
    ){

        if(
            MediaRecorder
                .isTypeSupported(
                    type
                )
        ){

            return type;

        }

    }


    return "";

}


/* =========================================================
   ENREGISTRER
   ========================================================= */

startRecord.addEventListener(
    "click",
    () => {

        chunks =
            [];


        recordedFile =
            null;


        const canvasStream =
            canvas.captureStream(
                30
            );


        outputStream =
            new MediaStream();


        canvasStream
            .getVideoTracks()
            .forEach(
                track =>
                    outputStream
                        .addTrack(
                            track
                        )
            );


        cameraStream
            .getAudioTracks()
            .forEach(
                track =>
                    outputStream
                        .addTrack(
                            track
                        )
            );


        const mime =
            getMime();


        recorder =
            mime
            ?
            new MediaRecorder(

                outputStream,

                {

                    mimeType:mime,

                    videoBitsPerSecond:
                        2200000

                }

            )
            :
            new MediaRecorder(
                outputStream
            );


        recorder.addEventListener(
            "dataavailable",
            event => {

                if(
                    event.data.size
                    >
                    0
                ){

                    chunks.push(
                        event.data
                    );

                }

            }
        );


        recorder.addEventListener(
            "stop",
            () => {

                const type =
                    recorder.mimeType
                    ||
                    "video/mp4";


                const blob =
                    new Blob(

                        chunks,

                        {
                            type:type
                        }

                    );


                recordedFile =
                    new File(

                        [blob],

                        type.includes(
                            "webm"
                        )
                        ?
                        "ma-reponse.webm"
                        :
                        "ma-reponse.mp4",

                        {
                            type:type
                        }

                    );


                if(
                    objectURL
                ){

                    URL.revokeObjectURL(
                        objectURL
                    );

                }


                objectURL =
                    URL.createObjectURL(
                        blob
                    );


                recordedPreview.src =
                    objectURL;


                canvas.style.display =
                    "none";


                recordedPreview.style.display =
                    "block";


                startRecord.style.display =
                    "none";


                stopRecord.style.display =
                    "none";


                restartRecord.style.display =
                    "inline-block";


                shareRecord.style.display =
                    "inline-block";


                recordTime.classList.remove(
                    "visible"
                );

            }
        );


        recorder.start();


        secondsRecorded =
            0;


        recordTime.textContent =
            "00:00";


        recordTime.classList.add(
            "visible"
        );


        startRecord.disabled =
            true;


        stopRecord.disabled =
            false;


        timer =
            setInterval(
                () => {

                    secondsRecorded++;


                    const minutes =
                        Math.floor(
                            secondsRecorded / 60
                        );


                    const seconds =
                        secondsRecorded % 60;


                    recordTime.textContent =
                        String(minutes)
                            .padStart(
                                2,
                                "0"
                            )
                        +
                        ":"
                        +
                        String(seconds)
                            .padStart(
                                2,
                                "0"
                            );


                    if(
                        secondsRecorded
                        >=
                        60
                    ){

                        stopRecording();

                    }

                },
                1000
            );

    }
);


/* =========================================================
   STOP
   ========================================================= */

function stopRecording(){

    if(
        !recorder
        ||
        recorder.state
        ===
        "inactive"
    ){
        return;
    }


    recorder.stop();


    clearInterval(
        timer
    );


    startRecord.disabled =
        false;


    stopRecord.disabled =
        true;

}


stopRecord.addEventListener(
    "click",
    stopRecording
);


/* =========================================================
   RECOMMENCER
   ========================================================= */

restartRecord.addEventListener(
    "click",
    () => {

        recordedPreview.pause();


        recordedPreview.removeAttribute(
            "src"
        );


        recordedPreview.load();


        recordedPreview.style.display =
            "none";


        canvas.style.display =
            "block";


        restartRecord.style.display =
            "none";


        shareRecord.style.display =
            "none";


        startRecord.style.display =
            "inline-block";


        startRecord.disabled =
            false;


        stopRecord.style.display =
            "inline-block";


        stopRecord.disabled =
            true;

    }
);


/* =========================================================
   PARTAGER
   ========================================================= */

shareRecord.addEventListener(
    "click",
    async () => {

        if(
            !recordedFile
        ){
            return;
        }


        if(
            !navigator.share
        ){

            showStatus(
                "Le partage direct n'est pas disponible."
            );

            return;

        }


        try{

            await navigator.share({

                files:[
                    recordedFile
                ],

                title:
                    "Ma réponse vidéo"

            });

        }
        catch(error){

            if(
                error.name
                !==
                "AbortError"
            ){

                showStatus(
                    "Impossible de partager la vidéo."
                );

            }

        }

    }
);


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
    message
){

    statusMessage.textContent =
        message;


    statusMessage.classList.add(
        "visible"
    );

}


function hideStatus(){

    statusMessage.classList.remove(
        "visible"
    );

}


/* =========================================================
   RETOUR HAUT
   ========================================================= */

window.addEventListener(
    "scroll",
    () => {

        backToTop.classList.toggle(

            "visible",

            window.scrollY
            >
            700

        );

    },

    {
        passive:true
    }
);


backToTop.addEventListener(
    "click",
    () => {

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    }
);


/* =========================================================
   NETTOYAGE
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        cancelAnimationFrame(
            animationFrame
        );


        if(
            cameraStream
        ){

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if(
            objectURL
        ){

            URL.revokeObjectURL(
                objectURL
            );

        }


        if(
            faceLandmarker
        ){

            try{

                faceLandmarker.close();

            }
            catch(error){}

        }

    }
);
