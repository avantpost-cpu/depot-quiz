<style>

/* =========================
   BASE
   ========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;
    min-height:100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #9f80a6
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif_leopard.png")
        repeat;

    background-size:300px;

    overflow-x:hidden;
}


/* =========================
   PAGE
   ========================= */

.page{

    width:100%;
    max-width:620px;

    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(50px + env(safe-area-inset-bottom));

}


/* =========================
   TITRE
   ========================= */

.header{

    width:100%;
    text-align:center;

    margin-bottom:24px;

}

.header img{

    display:block;

    width:100%;
    max-width:420px;

    height:auto;

    margin:0 auto;

}


/* =========================
   LISTE VIDÉOS
   ========================= */

.video-list{

    display:flex;
    flex-direction:column;

    gap:22px;

}


/* =========================
   CARTE
   ========================= */

.video-card{

    position:relative;

    width:100%;

    overflow:hidden;

    background:#000000;

    border-radius:18px;

    box-shadow:
        0 6px 18px
        rgba(0,0,0,.25);

}


/* =========================
   VIDÉO
   ========================= */

.video-wrapper{

    position:relative;

    width:100%;

    background:#000000;

    overflow:hidden;

}


.video-wrapper.vertical{
    aspect-ratio:9 / 16;
}


.video-wrapper.horizontal{
    aspect-ratio:16 / 9;
}


.video-wrapper video{

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000000;

}


/* =========================
   CADEAU
   ========================= */

.gift-cover{

    position:absolute;

    inset:0;

    z-index:5;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    gap:18px;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #b99abe,
            #8d6f94
        );

    transition:
        opacity .5s ease,
        transform .5s ease;

}


/* ruban vertical */

.gift-cover::before{

    content:"";

    position:absolute;

    top:0;
    bottom:0;

    left:50%;

    width:58px;

    transform:translateX(-50%);

    background:
        rgba(255,255,255,.82);

}


/* ruban horizontal */

.gift-cover::after{

    content:"";

    position:absolute;

    left:0;
    right:0;

    top:50%;

    height:58px;

    transform:translateY(-50%);

    background:
        rgba(255,255,255,.82);

}


/* =========================
   NOEUD
   ========================= */

.gift-bow{

    position:relative;

    z-index:2;

    width:120px;
    height:75px;

}


.gift-bow::before,
.gift-bow::after{

    content:"";

    position:absolute;

    top:10px;

    width:65px;
    height:50px;

    background:#ffffff;

    border-radius:
        70% 40% 70% 40%;

}


.gift-bow::before{

    left:4px;

    transform:
        rotate(-28deg);

}


.gift-bow::after{

    right:4px;

    transform:
        scaleX(-1)
        rotate(-28deg);

}


.gift-knot{

    position:absolute;

    z-index:3;

    left:50%;
    top:24px;

    width:35px;
    height:35px;

    transform:
        translateX(-50%)
        rotate(45deg);

    background:#ffffff;

    border-radius:8px;

}


/* =========================
   TEXTE CADEAU
   ========================= */

.gift-text{

    position:relative;

    z-index:3;

    padding:
        10px 18px;

    border-radius:30px;

    background:
        rgba(0,0,0,.55);

    color:#ffffff;

    font-size:16px;

    font-weight:bold;

    text-align:center;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.18);

}


/* animation ouverture */

.gift-cover.open{

    opacity:0;

    transform:
        scale(1.08);

    pointer-events:none;

}


/* =========================
   TÉLÉCHARGEMENT
   ========================= */

.download-zone{

    width:100%;

    padding:
        10px
        10px
        12px;

    text-align:center;

    background:#000000;

}


.download-btn{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding:
        8px
        16px;

    font-size:13px;

    font-weight:bold;

    color:#ffffff;

    background:#9f80a6;

    border-radius:20px;

    text-decoration:none;

    transition:
        transform .15s ease,
        opacity .15s ease;

}


.download-btn:active{

    transform:scale(.96);

    opacity:.85;

}


/* =========================
   RETOUR EN HAUT
   ========================= */

.back-to-top{

    position:fixed;

    right:16px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:100;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:
        rgba(0,0,0,.78);

    color:#ffffff;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.3);

    opacity:0;

    visibility:hidden;

    transform:
        translateY(10px);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;

}


.back-to-top.visible{

    opacity:1;

    visibility:visible;

    transform:
        translateY(0);

}


/* =========================
   PETITS ÉCRANS
   ========================= */

@media(max-width:380px){

    .page{

        padding-left:10px;
        padding-right:10px;

    }

    .video-list{

        gap:16px;

    }

    .video-card{

        border-radius:14px;

    }

    .download-btn{

        font-size:12px;

        padding:
            8px
            14px;

    }

    .gift-text{

        font-size:14px;

    }

}

</style>

</head>

<script>

/* =================================================
   ÉLÉMENTS
   ================================================= */

const videos =
    document.querySelectorAll("video");

const gifts =
    document.querySelectorAll(".gift-cover");

const backToTop =
    document.getElementById("backToTop");


/* =================================================
   CHARGEMENT INTELLIGENT
   ================================================= */

const videoObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach((entry) => {

                if(!entry.isIntersecting){
                    return;
                }

                const video =
                    entry.target;

                if(
                    !video.src &&
                    video.dataset.src
                ){

                    video.src =
                        video.dataset.src;

                    video.load();

                }

                videoObserver.unobserve(video);

            });

        },

        {
            rootMargin:"400px 0px"
        }

    );


videos.forEach((video) => {

    videoObserver.observe(video);

});


/* =================================================
   OUVERTURE DU CADEAU
   ================================================= */

gifts.forEach((gift) => {

    gift.addEventListener(
        "click",
        async () => {

            const wrapper =
                gift.closest(
                    ".video-wrapper"
                );

            const video =
                wrapper.querySelector(
                    "video"
                );


            /*
            Charge immédiatement
            la vidéo si nécessaire
            */

            if(
                !video.src &&
                video.dataset.src
            ){

                video.src =
                    video.dataset.src;

                video.load();

            }


            /*
            Animation du cadeau
            */

            gift.classList.add(
                "open"
            );


            /*
            Retire réellement
            le cadeau après animation
            */

            setTimeout(
                () => {

                    gift.style.display =
                        "none";

                },
                500
            );


            /*
            Lance la vidéo.
            Le play() est appelé
            directement après le clic
            pour rester compatible
            avec Safari iPhone.
            */

            try{

                await video.play();

            }
            catch(error){

                /*
                Si iOS refuse
                momentanément la lecture,
                les contrôles restent
                accessibles.
                */

            }

        }
    );

});


/* =================================================
   UNE SEULE VIDÉO À LA FOIS
   ================================================= */

videos.forEach((video) => {

    video.addEventListener(
        "play",
        () => {

            videos.forEach(
                (otherVideo) => {

                    if(
                        otherVideo !== video &&
                        !otherVideo.paused
                    ){

                        otherVideo.pause();

                    }

                }
            );

        }
    );

});


/* =================================================
   PAUSE SI LA VIDÉO SORT DE L'ÉCRAN
   ================================================= */

const pauseObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach(
                (entry) => {

                    const video =
                        entry.target;

                    if(
                        !entry.isIntersecting &&
                        !video.paused
                    ){

                        video.pause();

                    }

                }
            );

        },

        {
            threshold:0.15
        }

    );


videos.forEach((video) => {

    pauseObserver.observe(video);

});


/* =================================================
   RETOUR EN HAUT
   ================================================= */

window.addEventListener(
    "scroll",
    () => {

        if(
            window.scrollY > 700
        ){

            backToTop.classList.add(
                "visible"
            );

        }
        else{

            backToTop.classList.remove(
                "visible"
            );

        }

    },
    {
        passive:true
    }
);


backToTop.addEventListener(
    "click",
    () => {

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);

</script>
