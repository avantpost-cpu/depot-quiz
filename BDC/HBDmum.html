<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#13283b">

<title>Bon anniversaire Maman</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:Arial, Helvetica, sans-serif;

    background:
        #13283b
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif.jpg")
        repeat;

    background-size:300px;

    overflow-x:hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:100%;
    max-width:620px;

    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(60px + env(safe-area-inset-bottom));
}


/* =========================================================
   TITRE
   ========================================================= */

.header{
    width:100%;
    text-align:center;
    margin-bottom:24px;
}

.header img{
    display:block;

    width:100%;
    max-width:420px;

    height:auto;

    margin:0 auto;
}


/* =========================================================
   LISTE
   ========================================================= */

.video-list{
    display:flex;
    flex-direction:column;

    gap:36px;
}


/* =========================================================
   CARTE
   ========================================================= */

.video-card{
    width:100%;
}


/* =========================================================
   WRAPPER
   Cadeau + vidéo ont exactement la même taille
   ========================================================= */

.video-wrapper{
    position:relative;

    width:82%;

    margin:0 auto;
}


/* vidéos verticales */

.video-wrapper.vertical{
    aspect-ratio:9 / 16;
}


/* vidéo Tata horizontale */

.video-wrapper.horizontal{
    width:88%;

    aspect-ratio:16 / 9;
}


/* =========================================================
   VIDÉO
   ========================================================= */

.video-wrapper video{
    position:absolute;

    inset:0;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000000;

    border-radius:14px;
}


/* =========================================================
   CACHE CADEAU
   ========================================================= */

.gift-cover{
    position:absolute;

    inset:0;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    perspective:1000px;
}


/* =========================================================
   PAQUET
   ========================================================= */

.gift-package{
    position:relative;

    width:100%;
    height:100%;

    filter:
        drop-shadow(
            0 14px 18px rgba(0,0,0,.42)
        );

    transition:
        filter .65s ease;
}


/* =========================================================
   IMAGE ORIGINALE
   ========================================================= */

.gift-image{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    border-radius:14px;

    transition:
        opacity .08s ease;
}


/* =========================================================
   DEUX PANS DE PAPIER
   ========================================================= */

.paper-half{
    position:absolute;

    top:0;
    bottom:0;

    width:51%;

    background-repeat:no-repeat;

    opacity:0;

    backface-visibility:hidden;

    will-change:
        transform,
        opacity;
}


/* =========================================================
   GAUCHE
   ========================================================= */

.paper-left{

    left:0;

    background-size:200% 100%;
    background-position:left center;

    transform-origin:left center;

    clip-path:polygon(
        0 0,
        100% 0,
        96% 5%,
        100% 10%,
        95% 16%,
        99% 22%,
        94% 29%,
        100% 36%,
        95% 43%,
        99% 50%,
        94% 57%,
        100% 64%,
        95% 71%,
        99% 78%,
        94% 85%,
        100% 92%,
        96% 100%,
        0 100%
    );

    border-radius:
        14px 0 0 14px;
}


/* =========================================================
   DROITE
   ========================================================= */

.paper-right{

    right:0;

    background-size:200% 100%;
    background-position:right center;

    transform-origin:right center;

    clip-path:polygon(
        4% 0,
        100% 0,
        100% 100%,
        4% 100%,
        0 92%,
        6% 85%,
        1% 78%,
        5% 71%,
        0 64%,
        6% 57%,
        1% 50%,
        5% 43%,
        0 36%,
        6% 29%,
        1% 22%,
        5% 16%,
        0 10%
    );

    border-radius:
        0 14px 14px 0;
}


/* =========================================================
   BORD CLAIR DE LA DÉCHIRURE
   ========================================================= */

.paper-left::after,
.paper-right::before{

    content:"";

    position:absolute;

    top:0;

    width:5px;
    height:100%;

    opacity:.65;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.80) 0px,
            rgba(255,255,255,.80) 3px,
            rgba(255,255,255,.12) 3px,
            rgba(255,255,255,.12) 7px
        );

}


.paper-left::after{
    right:0;
}


.paper-right::before{
    left:0;
}


/* =========================================================
   INDICATION
   ========================================================= */

.gift-hint{
    position:absolute;

    left:50%;
    bottom:18px;

    z-index:30;

    transform:translateX(-50%);

    padding:9px 16px;

    white-space:nowrap;

    border-radius:30px;

    background:
        rgba(0,0,0,.58);

    color:#ffffff;

    font-size:13px;
    font-weight:bold;

    box-shadow:
        0 3px 10px rgba(0,0,0,.20);

    pointer-events:none;

    transition:
        opacity .18s ease,
        transform .18s ease;
}


/* =========================================================
   DÉBUT DE L'OUVERTURE
   ========================================================= */

.gift-cover.opening{
    pointer-events:none;
}


.gift-cover.opening .gift-image{
    opacity:0;
}


.gift-cover.opening .paper-half{
    opacity:1;
}


.gift-cover.opening .gift-hint{
    opacity:0;

    transform:
        translateX(-50%)
        scale(.88);
}


/* =========================================================
   OMBRE DISPARAÎT
   ========================================================= */

.gift-cover.opening .gift-package{

    filter:
        drop-shadow(
            0 0 0 rgba(0,0,0,0)
        );

}


/* =========================================================
   ANIMATION GAUCHE
   ========================================================= */

.gift-cover.opening .paper-left{

    animation:
        peelLeft .9s
        cubic-bezier(.22,.72,.18,1)
        forwards;

}


/* =========================================================
   ANIMATION DROITE
   ========================================================= */

.gift-cover.opening .paper-right{

    animation:
        peelRight .9s
        cubic-bezier(.22,.72,.18,1)
        forwards;

}


/* =========================================================
   KEYFRAMES
   ========================================================= */

@keyframes peelLeft{

    0%{
        transform:
            translateX(0)
            rotateY(0deg);

        opacity:1;
    }

    18%{
        transform:
            translateX(-2%)
            rotateY(-8deg);

        opacity:1;
    }

    58%{
        transform:
            translateX(-28%)
            rotateY(-34deg)
            rotateZ(-2deg);

        opacity:1;
    }

    100%{
        transform:
            translateX(-110%)
            rotateY(-66deg)
            rotateZ(-6deg);

        opacity:0;
    }

}


@keyframes peelRight{

    0%{
        transform:
            translateX(0)
            rotateY(0deg);

        opacity:1;
    }

    18%{
        transform:
            translateX(2%)
            rotateY(8deg);

        opacity:1;
    }

    58%{
        transform:
            translateX(28%)
            rotateY(34deg)
            rotateZ(2deg);

        opacity:1;
    }

    100%{
        transform:
            translateX(110%)
            rotateY(66deg)
            rotateZ(6deg);

        opacity:0;
    }

}


/* =========================================================
   TÉLÉCHARGEMENT
   ========================================================= */

.download-zone{
    width:100%;

    padding-top:14px;

    text-align:center;
}


.download-btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding:9px 17px;

    font-size:13px;
    font-weight:bold;

    color:#ffffff;

    background:#9f80a6;

    text-decoration:none;

    border-radius:22px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.20);

    transition:
        transform .15s ease,
        opacity .15s ease;
}


.download-btn:active{

    transform:scale(.96);

    opacity:.85;

}


/* =========================================================
   RETOUR EN HAUT
   ========================================================= */

.back-to-top{
    position:fixed;

    right:16px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:100;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:
        rgba(80,52,84,.90);

    color:#ffffff;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.30);

    opacity:0;

    visibility:hidden;

    transform:translateY(10px);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;
}


.back-to-top.visible{

    opacity:1;

    visibility:visible;

    transform:translateY(0);

}


/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media(max-width:380px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .video-list{
        gap:30px;
    }

    .video-wrapper{
        width:80%;
    }

    .video-wrapper.horizontal{
        width:88%;
    }

    .video-wrapper video,
    .gift-image{
        border-radius:12px;
    }

    .download-btn{
        font-size:12px;

        padding:8px 14px;
    }

    .gift-hint{
        bottom:12px;

        font-size:12px;

        padding:8px 13px;
    }

}


/* =========================================================
   ACCESSIBILITÉ
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    html{
        scroll-behavior:auto;
    }

    .gift-cover.opening .paper-left,
    .gift-cover.opening .paper-right{
        animation-duration:.01s;
    }

}

</style>

<script>

/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const videos =
    document.querySelectorAll("video");

const gifts =
    document.querySelectorAll(".gift-cover");

const backToTop =
    document.getElementById("backToTop");


/* =========================================================
   PRÉPARATION DES DEUX PANS
   ========================================================= */

gifts.forEach((gift) => {

    const giftPackage =
        gift.querySelector(".gift-package");

    const image =
        giftPackage.dataset.image;

    const left =
        gift.querySelector(".paper-left");

    const right =
        gift.querySelector(".paper-right");


    left.style.backgroundImage =
        `url("${image}")`;

    right.style.backgroundImage =
        `url("${image}")`;

});


/* =========================================================
   CHARGEMENT INTELLIGENT
   ========================================================= */

const videoObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach((entry) => {

                if(!entry.isIntersecting){
                    return;
                }

                const video =
                    entry.target;


                if(
                    !video.src &&
                    video.dataset.src
                ){

                    video.src =
                        video.dataset.src;

                    video.load();

                }


                videoObserver.unobserve(
                    video
                );

            });

        },

        {
            rootMargin:"350px 0px"
        }

    );


videos.forEach((video) => {

    videoObserver.observe(video);

});


/* =========================================================
   OUVERTURE
   ========================================================= */

async function openGift(gift){

    if(
        gift.classList.contains(
            "opening"
        )
    ){
        return;
    }


    const wrapper =
        gift.closest(".video-wrapper");

    const video =
        wrapper.querySelector("video");


    /* charge immédiatement */

    if(
        !video.src &&
        video.dataset.src
    ){

        video.src =
            video.dataset.src;

        video.load();

    }


    /* ouverture */

    gift.classList.add(
        "opening"
    );


    /* démarre la vidéo */

    try{

        await video.play();

    }
    catch(error){

    }


    /* retire complètement le papier */

    setTimeout(
        () => {

            gift.style.display =
                "none";

        },
        900
    );

}


/* =========================================================
   CLIC / CLAVIER
   ========================================================= */

gifts.forEach((gift) => {

    gift.addEventListener(
        "click",
        () => {

            openGift(gift);

        }
    );


    gift.addEventListener(
        "keydown",
        (event) => {

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                openGift(gift);

            }

        }
    );

});


/* =========================================================
   UNE SEULE VIDÉO À LA FOIS
   ========================================================= */

videos.forEach((video) => {

    video.addEventListener(
        "play",
        () => {

            videos.forEach(
                (otherVideo) => {

                    if(
                        otherVideo !== video &&
                        !otherVideo.paused
                    ){

                        otherVideo.pause();

                    }

                }
            );

        }
    );

});


/* =========================================================
   PAUSE HORS ÉCRAN
   ========================================================= */

const pauseObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach(
                (entry) => {

                    const video =
                        entry.target;

                    if(
                        !entry.isIntersecting &&
                        !video.paused
                    ){

                        video.pause();

                    }

                }
            );

        },

        {
            threshold:.12
        }

    );


videos.forEach((video) => {

    pauseObserver.observe(video);

});


/* =========================================================
   RETOUR EN HAUT
   ========================================================= */

window.addEventListener(
    "scroll",
    () => {

        if(window.scrollY > 700){

            backToTop.classList.add(
                "visible"
            );

        }
        else{

            backToTop.classList.remove(
                "visible"
            );

        }

    },

    {
        passive:true
    }

);


backToTop.addEventListener(
    "click",
    () => {

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    }
);

</script>

</body>
</html>
