<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#13283b">

<title>Bon anniversaire Maman</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:Arial, Helvetica, sans-serif;

    background:
        #13283b
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif.jpg")
        repeat;

    background-size:300px;

    overflow-x:hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:100%;
    max-width:620px;

    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(70px + env(safe-area-inset-bottom));
}


/* =========================================================
   TITRE
   ========================================================= */

.header{
    width:100%;
    text-align:center;
    margin-bottom:24px;
}

.header img{
    display:block;

    width:100%;
    max-width:420px;
    height:auto;

    margin:0 auto;
}


/* =========================================================
   LISTE
   ========================================================= */

.video-list{
    display:flex;
    flex-direction:column;

    gap:36px;
}

.video-card{
    width:100%;
}


/* =========================================================
   VIDEO / CADEAU
   ========================================================= */

.video-wrapper{
    position:relative;

    width:82%;

    margin:0 auto;
}

.video-wrapper.vertical{
    aspect-ratio:9 / 16;
}

.video-wrapper.horizontal{
    width:88%;

    aspect-ratio:16 / 9;
}


/* =========================================================
   VIDEO
   ========================================================= */

.main-video{
    position:absolute;
    inset:0;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;

    border-radius:14px;
}


/* =========================================================
   CADEAU
   ========================================================= */

.gift-cover{
    position:absolute;
    inset:0;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    opacity:1;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.gift-package{
    position:relative;

    width:100%;
    height:100%;

    filter:
        drop-shadow(
            0 14px 18px rgba(0,0,0,.42)
        );

    transition:
        filter .45s ease;
}

.gift-image{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    border-radius:14px;
}


/* =========================================================
   TEXTE CADEAU
   ========================================================= */

.gift-hint{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    padding:9px 16px;

    white-space:nowrap;

    border-radius:30px;

    background:
        rgba(0,0,0,.58);

    color:#fff;

    font-size:13px;
    font-weight:bold;

    pointer-events:none;

    box-shadow:
        0 3px 10px rgba(0,0,0,.20);
}


/* =========================================================
   OUVERTURE
   ========================================================= */

.gift-cover.opening{
    opacity:0;

    transform:scale(1.035);

    pointer-events:none;
}

.gift-cover.opening .gift-package{
    filter:
        drop-shadow(
            0 0 0 rgba(0,0,0,0)
        );
}


/* =========================================================
   ACTIONS
   ========================================================= */

.action-zone{
    width:100%;

    padding-top:14px;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-wrap:wrap;

    gap:9px;
}

.action-btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:40px;

    padding:9px 17px;

    border:0;

    border-radius:22px;

    font-family:inherit;

    font-size:13px;
    font-weight:bold;

    text-decoration:none;

    cursor:pointer;

    color:#fff;

    background:#9f80a6;

    box-shadow:
        0 4px 10px rgba(0,0,0,.20);

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.action-btn:active{
    transform:scale(.96);
}

.reply-btn{
    background:#e26183;
}

.hidden{
    display:none !important;
}


/* =========================================================
   MODULE REPONSE
   ========================================================= */

.reply-panel{
    display:none;

    width:94%;

    margin:20px auto 0;

    padding:14px;

    background:
        rgba(9,20,31,.96);

    border-radius:18px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.32);
}

.reply-panel.visible{
    display:block;
}

.reply-title{
    margin-bottom:6px;

    color:#fff;

    font-size:17px;
    font-weight:bold;

    text-align:center;
}

.reply-info{
    margin-bottom:13px;

    color:
        rgba(255,255,255,.78);

    font-size:12px;

    line-height:1.45;

    text-align:center;
}


/* =========================================================
   COURONNES
   ========================================================= */

.crown-zone{
    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:7px;

    margin-bottom:13px;
}

.crown-btn{
    flex:
        1 1
        calc(33.333% - 7px);

    min-width:88px;
    max-width:135px;

    min-height:50px;

    padding:6px;

    border:
        1px solid
        rgba(255,255,255,.22);

    border-radius:13px;

    background:
        rgba(255,255,255,.07);

    color:#fff;

    font-family:inherit;

    font-size:11px;
    font-weight:bold;

    cursor:pointer;

    transition:
        background .2s ease,
        transform .15s ease;
}

.crown-btn:active{
    transform:scale(.96);
}

.crown-btn.active{
    background:#e26183;

    border-color:#e26183;
}

.crown-btn span{
    display:block;

    margin-bottom:2px;

    font-size:20px;
}


/* =========================================================
   CAMERA
   ========================================================= */

.camera-frame{
    position:relative;

    width:100%;

    aspect-ratio:9 / 16;

    overflow:hidden;

    background:#13283b;

    border-radius:14px;
}

#cameraSource{
    display:none;
}

#partyCanvas{
    display:block;

    width:100%;
    height:100%;

    background:#13283b;
}

#recordedPreview{
    display:none;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;
}


/* =========================================================
   COMPTEUR
   ========================================================= */

.record-time{
    position:absolute;

    top:10px;
    left:50%;

    z-index:20;

    transform:translateX(-50%);

    display:none;

    padding:6px 11px;

    border-radius:20px;

    background:
        rgba(0,0,0,.72);

    color:#fff;

    font-size:13px;
    font-weight:bold;
}

.record-time.visible{
    display:block;
}


/* =========================================================
   BOUTONS CAMERA
   ========================================================= */

.camera-actions{
    display:flex;

    justify-content:center;
    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}

.camera-btn{
    min-height:42px;

    padding:9px 15px;

    border:0;

    border-radius:22px;

    font-family:inherit;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.camera-btn:active{
    transform:scale(.96);
}

.camera-btn.primary{
    background:#e26183;

    color:#fff;
}

.camera-btn.secondary{
    background:#fff;

    color:#253344;
}

.camera-btn.send{
    background:#6fa773;

    color:#fff;
}

.camera-btn:disabled{
    opacity:.45;

    cursor:default;
}


/* =========================================================
   STATUS
   ========================================================= */

.status-message{
    display:none;

    margin-top:12px;

    padding:11px;

    border-radius:12px;

    background:
        rgba(255,255,255,.10);

    color:#fff;

    font-size:12px;

    line-height:1.45;

    text-align:center;
}

.status-message.visible{
    display:block;
}


/* =========================================================
   RETOUR HAUT
   ========================================================= */

.back-to-top{
    position:fixed;

    right:16px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:100;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:
        rgba(80,52,84,.90);

    color:#fff;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.30);

    opacity:0;

    visibility:hidden;

    transform:translateY(10px);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;
}

.back-to-top.visible{
    opacity:1;

    visibility:visible;

    transform:translateY(0);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:380px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .video-wrapper{
        width:80%;
    }

    .video-wrapper.horizontal{
        width:88%;
    }

    .reply-panel{
        width:96%;
    }

    .crown-btn{
        min-width:82px;

        font-size:10px;
    }

}

</style>

</head>


<body>


<main
    class="page"
    id="top"
>


<header class="header">

    <img
        src="https://avantpost-cpu.github.io/depot-quiz/BDC/titre.png"
        alt="Bon anniversaire Maman"
    >

</header>


<section
    class="video-list"
    id="videoList"
></section>



<!-- =====================================================
     TEST REPONSE VIDEO 8
     ===================================================== -->

<div
    class="reply-panel"
    id="replyPanel"
>

    <div class="reply-title">
        Ta réponse vidéo
    </div>


    <div class="reply-info">
        Choisis ta couronne, enregistre ton message puis partage directement ta vidéo.
    </div>


    <div class="crown-zone">


        <button
            class="crown-btn"
            data-crown="none"
            type="button"
        >
            <span>🙂</span>
            Normal
        </button>


        <button
            class="crown-btn active"
            data-crown="crown1"
            type="button"
        >
            <span>🌹</span>
            Roses
        </button>


        <button
            class="crown-btn"
            data-crown="crown2"
            type="button"
        >
            <span>🦄</span>
            Licorne
        </button>


        <button
            class="crown-btn"
            data-crown="crown3"
            type="button"
        >
            <span>💖</span>
            Tiare
        </button>


        <button
            class="crown-btn"
            data-crown="crown4"
            type="button"
        >
            <span>👑</span>
            Néon
        </button>


    </div>


    <video
        id="cameraSource"
        autoplay
        muted
        playsinline
    ></video>


    <div class="camera-frame">


        <canvas
            id="partyCanvas"
            width="720"
            height="1280"
        ></canvas>


        <video
            id="recordedPreview"
            controls
            playsinline
        ></video>


        <div
            class="record-time"
            id="recordTime"
        >
            00:00
        </div>


    </div>


    <div class="camera-actions">


        <button
            class="camera-btn primary"
            id="startRecord"
            type="button"
        >
            ● Enregistrer
        </button>


        <button
            class="camera-btn secondary"
            id="stopRecord"
            type="button"
            disabled
        >
            Terminer
        </button>


        <button
            class="camera-btn secondary"
            id="restartRecord"
            type="button"
            style="display:none;"
        >
            Recommencer
        </button>


        <button
            class="camera-btn send"
            id="shareRecord"
            type="button"
            style="display:none;"
        >
            Envoyer ma réponse
        </button>


    </div>


    <div
        class="status-message"
        id="statusMessage"
    ></div>


</div>


</main>



<button
    class="back-to-top"
    id="backToTop"
    aria-label="Retour en haut"
>
    ↑
</button>



<script type="module">

/* =========================================================
   MEDIAPIPE
   ========================================================= */

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";


/* =========================================================
   CONFIG
   ========================================================= */

const BASE =
    "https://avantpost-cpu.github.io/depot-quiz/BDC/";


const cards = [

    {
        video:"mamie.mp4",
        pack:"pack1.jpg",
        format:"vertical"
    },

    {
        video:"tata.mp4",
        pack:"pack2.jpg",
        format:"horizontal"
    },

    {
        video:"raoul.mp4",
        pack:"pack3.jpg",
        format:"vertical"
    },

    {
        video:"claire.mp4",
        pack:"pack4.jpg",
        format:"vertical"
    },

    {
        video:"osaka.mp4",
        pack:"pack5.jpg",
        format:"vertical"
    },

    {
        video:"marcel.mp4",
        pack:"pack6.jpg",
        format:"vertical"
    },

    {
        video:"couple.mp4",
        pack:"pack7.jpg",
        format:"vertical"
    },

    {
        video:"test.mp4",
        pack:"pack8.jpg",
        format:"vertical",
        reply:true
    }

];


/* =========================================================
   MOTIF
   ========================================================= */

const motifImage =
    new Image();


motifImage.crossOrigin =
    "anonymous";


motifImage.src =
    BASE +
    "motif.jpg";


/* =========================================================
   COURONNES PNG
   ========================================================= */

const crownImages = {};


function createCrownImage(
    name
){

    const image =
        new Image();


    image.crossOrigin =
        "anonymous";


    image.src =
        BASE +
        name +
        ".png";


    return image;

}


crownImages.crown1 =
    createCrownImage(
        "crown1"
    );


crownImages.crown2 =
    createCrownImage(
        "crown2"
    );


crownImages.crown3 =
    createCrownImage(
        "crown3"
    );


crownImages.crown4 =
    createCrownImage(
        "crown4"
    );


/* =========================================================
   CREATION CARTES
   ========================================================= */

const videoList =
    document.getElementById(
        "videoList"
    );


cards.forEach(
    (item,index) => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "video-card";


        card.dataset.index =
            index;


        card.innerHTML = `

            <div
                class="video-wrapper ${item.format}"
            >

                <video
                    class="main-video"
                    controls
                    playsinline
                    preload="none"
                    data-src="${BASE}${item.video}"
                ></video>


                <div class="gift-cover">

                    <div class="gift-package">

                        <img
                            class="gift-image"
                            src="${BASE}${item.pack}"
                            alt=""
                        >

                    </div>


                    <div class="gift-hint">
                        Ouvre ton cadeau
                    </div>

                </div>

            </div>


            <div class="action-zone">

                <a
                    class="action-btn"
                    href="${BASE}${item.video}"
                    download="${item.video}"
                >
                    ↓ Télécharger
                </a>


                ${
                    item.reply
                    ?
                    `
                    <button
                        class="action-btn reply-btn hidden"
                        type="button"
                    >
                        Répondre en vidéo
                    </button>
                    `
                    :
                    ""
                }

            </div>

        `;


        videoList.appendChild(
            card
        );

    }
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const videos =
    document.querySelectorAll(
        ".main-video"
    );


const gifts =
    document.querySelectorAll(
        ".gift-cover"
    );


const testCard =
    document.querySelector(
        '.video-card[data-index="7"]'
    );


const replyButton =
    testCard.querySelector(
        ".reply-btn"
    );


const replyPanel =
    document.getElementById(
        "replyPanel"
    );


const cameraSource =
    document.getElementById(
        "cameraSource"
    );


const canvas =
    document.getElementById(
        "partyCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const recordedPreview =
    document.getElementById(
        "recordedPreview"
    );


const startRecord =
    document.getElementById(
        "startRecord"
    );


const stopRecord =
    document.getElementById(
        "stopRecord"
    );


const restartRecord =
    document.getElementById(
        "restartRecord"
    );


const shareRecord =
    document.getElementById(
        "shareRecord"
    );


const recordTime =
    document.getElementById(
        "recordTime"
    );


const crownButtons =
    document.querySelectorAll(
        ".crown-btn"
    );


const statusMessage =
    document.getElementById(
        "statusMessage"
    );


const backToTop =
    document.getElementById(
        "backToTop"
    );


/* =========================================================
   VARIABLES
   ========================================================= */

let cameraStream =
    null;


let faceLandmarker =
    null;


let trackingReady =
    false;


let trackingLoading =
    false;


let latestLandmarks =
    null;


let selectedCrown =
    "crown1";


let recorder =
    null;


let recordedChunks =
    [];


let recordedFile =
    null;


let objectURL =
    null;


let timer =
    null;


let secondsRecorded =
    0;


let animationFrame =
    null;


let lastDetection =
    0;


let selfieFrame = {

    x:0,
    y:0,

    width:720,
    height:1280

};


/* =========================================================
   ETOILES FEERIQUES
   ========================================================= */

const fairyStars =
    Array.from(

        {
            length:36
        },

        () => ({

            x:
                Math.random()
                *
                canvas.width,

            y:
                Math.random()
                *
                canvas.height,

            radius:
                2
                +
                Math.random()
                *
                5,

            speed:
                .003
                +
                Math.random()
                *
                .009,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            drift:
                .05
                +
                Math.random()
                *
                .18,

            warm:
                Math.random()
                >
                .65

        })

    );


/* =========================================================
   VIDEOS LAZY
   ========================================================= */

const videoObserver =
    new IntersectionObserver(

        entries => {

            entries.forEach(
                entry => {

                    if(
                        !entry.isIntersecting
                    ){
                        return;
                    }


                    const video =
                        entry.target;


                    if(
                        !video.src
                        &&
                        video.dataset.src
                    ){

                        video.src =
                            video.dataset.src;


                        video.load();

                    }


                    videoObserver.unobserve(
                        video
                    );

                }
            );

        },

        {
            rootMargin:
                "350px 0px"
        }

    );


videos.forEach(
    video =>
        videoObserver.observe(
            video
        )
);


/* =========================================================
   OUVERTURE CADEAUX
   ========================================================= */

gifts.forEach(
    gift => {

        gift.addEventListener(
            "click",
            async () => {

                if(
                    gift.classList.contains(
                        "opening"
                    )
                ){
                    return;
                }


                const card =
                    gift.closest(
                        ".video-card"
                    );


                const video =
                    card.querySelector(
                        ".main-video"
                    );


                if(
                    !video.src
                ){

                    video.src =
                        video.dataset.src;


                    video.load();

                }


                gift.classList.add(
                    "opening"
                );


                if(
                    card.dataset.index
                    ===
                    "7"
                ){

                    replyButton.classList.remove(
                        "hidden"
                    );

                }


                try{

                    await video.play();

                }
                catch(error){}


                setTimeout(
                    () => {

                        gift.style.display =
                            "none";

                    },
                    450
                );

            }
        );

    }
);


/* =========================================================
   UNE VIDEO A LA FOIS
   ========================================================= */

videos.forEach(
    video => {

        video.addEventListener(
            "play",
            () => {

                videos.forEach(
                    other => {

                        if(
                            other !== video
                            &&
                            !other.paused
                        ){

                            other.pause();

                        }

                    }
                );

            }
        );

    }
);


/* =========================================================
   COURONNE
   ========================================================= */

crownButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                selectedCrown =
                    button.dataset.crown;


                crownButtons.forEach(
                    btn =>
                        btn.classList.remove(
                            "active"
                        )
                );


                button.classList.add(
                    "active"
                );


                if(
                    selectedCrown
                    !==
                    "none"
                ){

                    initFaceTracking();

                }

            }
        );

    }
);


/* =========================================================
   CAMERA
   ========================================================= */

replyButton.addEventListener(
    "click",
    async () => {

        testCard
            .querySelector(
                ".main-video"
            )
            .pause();


        testCard.insertAdjacentElement(
            "afterend",
            replyPanel
        );


        replyPanel.classList.add(
            "visible"
        );


        hideStatus();


        try{

            cameraStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video:{

                            facingMode:"user",

                            width:{
                                ideal:1280
                            },

                            height:{
                                ideal:720
                            },

                            frameRate:{
                                ideal:30
                            }

                        },

                        audio:true

                    });


            cameraSource.srcObject =
                cameraStream;


            await cameraSource.play();


            canvas.style.display =
                "block";


            recordedPreview.style.display =
                "none";


            drawFrame();


            initFaceTracking();


            replyPanel.scrollIntoView({

                behavior:"smooth",

                block:"center"

            });

        }
        catch(error){

            console.error(
                error
            );


            showStatus(
                "Impossible d'accéder à la caméra ou au micro."
            );

        }

    }
);


/* =========================================================
   MEDIAPIPE
   ========================================================= */

async function initFaceTracking(){

    if(
        trackingReady
        ||
        trackingLoading
    ){
        return;
    }


    trackingLoading =
        true;


    showStatus(
        "Chargement du suivi du visage…"
    );


    try{

        const vision =
            await FilesetResolver
                .forVisionTasks(

                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

                );


        faceLandmarker =
            await FaceLandmarker
                .createFromOptions(

                    vision,

                    {

                        baseOptions:{

                            modelAssetPath:
                                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                            delegate:
                                "GPU"

                        },

                        runningMode:
                            "VIDEO",

                        numFaces:
                            1,

                        minFaceDetectionConfidence:
                            .5,

                        minFacePresenceConfidence:
                            .5,

                        minTrackingConfidence:
                            .5

                    }

                );


        trackingReady =
            true;


        hideStatus();

    }
    catch(error){

        console.error(
            error
        );


        showStatus(
            "Impossible de charger le suivi du visage."
        );

    }
    finally{

        trackingLoading =
            false;

    }

}


/* =========================================================
   DESSIN PRINCIPAL
   ========================================================= */

function drawFrame(){

    const W =
        canvas.width;


    const H =
        canvas.height;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
       FOND MOTIF
    */

    drawMotifBackground(
        W,
        H
    );


    /*
       SELFIE
    */

    if(
        cameraSource.readyState
        >=
        2
    ){

        drawSelfieScene(
            W,
            H
        );

    }


    /*
       TRACKING
    */

    if(
        trackingReady
        &&
        selectedCrown
        !==
        "none"
        &&
        cameraSource.readyState
        >=
        2
    ){

        const now =
            performance.now();


        if(
            now
            -
            lastDetection
            >
            65
        ){

            lastDetection =
                now;


            try{

                const result =
                    faceLandmarker
                        .detectForVideo(

                            cameraSource,

                            now

                        );


                if(
                    result.faceLandmarks
                    &&
                    result.faceLandmarks[0]
                ){

                    latestLandmarks =
                        result.faceLandmarks[0];

                }

            }
            catch(error){}

        }

    }


    /*
       FILTRE FESTIF
    */

    if(
        selectedCrown
        !==
        "none"
    ){

        drawFairyStars();


        drawBottomTitle();


        if(
            latestLandmarks
        ){

            drawCrown(
                latestLandmarks
            );

        }

    }


    animationFrame =
        requestAnimationFrame(
            drawFrame
        );

}


/* =========================================================
   FOND MOTIF
   ========================================================= */

function drawMotifBackground(
    W,
    H
){

    ctx.fillStyle =
        "#13283b";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    if(
        !motifImage.complete
        ||
        !motifImage.naturalWidth
    ){
        return;
    }


    const pattern =
        ctx.createPattern(
            motifImage,
            "repeat"
        );


    if(!pattern){
        return;
    }


    ctx.save();


    if(
        typeof DOMMatrix
        !==
        "undefined"
    ){

        const matrix =
            new DOMMatrix();


        matrix.a =
            .62;


        matrix.d =
            .62;


        try{

            pattern.setTransform(
                matrix
            );

        }
        catch(error){}

    }


    ctx.fillStyle =
        pattern;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.restore();

}


/* =========================================================
   SELFIE
   ========================================================= */

function drawSelfieScene(
    W,
    H
){

    const vw =
        cameraSource.videoWidth;


    const vh =
        cameraSource.videoHeight;


    if(
        !vw
        ||
        !vh
    ){
        return;
    }


    /*
       88 % largeur :
       juste ce qu'il faut pour
       conserver un bord motif.
    */

    const maxW =
        W
        *
        .88;


    const maxH =
        H
        *
        .94;


    const videoRatio =
        vw
        /
        vh;


    const targetRatio =
        maxW
        /
        maxH;


    let drawW;
    let drawH;


    if(
        videoRatio
        >
        targetRatio
    ){

        drawW =
            maxW;


        drawH =
            drawW
            /
            videoRatio;

    }
    else{

        drawH =
            maxH;


        drawW =
            drawH
            *
            videoRatio;

    }


    const x =
        (
            W
            -
            drawW
        )
        /
        2;


    const y =
        (
            H
            -
            drawH
        )
        /
        2;


    selfieFrame = {

        x:x,
        y:y,

        width:drawW,
        height:drawH

    };


    /*
       petit filet sombre
    */

    ctx.fillStyle =
        "rgba(0,0,0,.25)";


    ctx.fillRect(

        x - 4,
        y - 4,

        drawW + 8,
        drawH + 8

    );


    /*
       SELFIE MIROIR
    */

    ctx.save();


    ctx.translate(
        W,
        0
    );


    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(

        cameraSource,

        W
        -
        x
        -
        drawW,

        y,

        drawW,

        drawH

    );


    ctx.restore();

}


/* =========================================================
   LANDMARK -> CANVAS
   ========================================================= */

function landmarkToCanvas(
    landmark
){

    return {

        x:
            selfieFrame.x
            +
            (
                1
                -
                landmark.x
            )
            *
            selfieFrame.width,

        y:
            selfieFrame.y
            +
            landmark.y
            *
            selfieFrame.height

    };

}


/* =========================================================
   POSITION COURONNE
   ========================================================= */

function getCrownTransform(
    points
){

    const leftFace =
        landmarkToCanvas(
            points[234]
        );


    const rightFace =
        landmarkToCanvas(
            points[454]
        );


    const forehead =
        landmarkToCanvas(
            points[10]
        );


    const leftEye =
        landmarkToCanvas(
            points[33]
        );


    const rightEye =
        landmarkToCanvas(
            points[263]
        );


    const faceWidth =
        Math.hypot(

            rightFace.x
            -
            leftFace.x,

            rightFace.y
            -
            leftFace.y

        );


    let angle =
        Math.atan2(

            rightEye.y
            -
            leftEye.y,

            rightEye.x
            -
            leftEye.x

        );


    /*
       empêche retournement 180°
    */

    if(
        angle >
        Math.PI / 2
    ){

        angle -=
            Math.PI;

    }


    if(
        angle <
        -Math.PI / 2
    ){

        angle +=
            Math.PI;

    }


    const width =
        faceWidth
        *
        1.65;


    /*
       CORRECTION :
       la couronne est maintenant
       plus BASSE.

       Avant : environ forehead.y

       Maintenant :
       + 18 % largeur visage.
    */

    const y =
        forehead.y
        +
        faceWidth
        *
        .18;


    return {

        x:
            forehead.x,

        y:y,

        width:width,

        angle:angle

    };

}


/* =========================================================
   COURONNE
   ========================================================= */

function drawCrown(
    points
){

    if(
        selectedCrown
        ===
        "none"
    ){
        return;
    }


    const image =
        crownImages[
            selectedCrown
        ];


    if(
        !image
        ||
        !image.complete
        ||
        !image.naturalWidth
    ){
        return;
    }


    const p =
        getCrownTransform(
            points
        );


    const ratio =
        image.naturalHeight
        /
        image.naturalWidth;


    const width =
        p.width;


    const height =
        width
        *
        ratio;


    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    ctx.rotate(
        p.angle
    );


    ctx.shadowColor =
        "rgba(0,0,0,.22)";


    ctx.shadowBlur =
        10;


    /*
       BAS de la couronne
       posé sur le front.
    */

    ctx.drawImage(

        image,

        -width / 2,

        -height,

        width,

        height

    );


    ctx.restore();

}


/* =========================================================
   PETITES ETOILES FEERIQUES
   ========================================================= */

function drawFairyStars(){

    const time =
        performance.now();


    fairyStars.forEach(
        star => {

            /*
               très léger déplacement
               vertical
            */

            star.y -=
                star.drift;


            if(
                star.y
                <
                -20
            ){

                star.y =
                    canvas.height
                    +
                    20;


                star.x =
                    Math.random()
                    *
                    canvas.width;

            }


            const pulse =
                (
                    Math.sin(
                        time
                        *
                        star.speed
                        +
                        star.phase
                    )
                    +
                    1
                )
                /
                2;


            const alpha =
                .15
                +
                pulse
                *
                .75;


            const radius =
                star.radius
                *
                (
                    .7
                    +
                    pulse
                    *
                    .65
                );


            drawFairyStar(

                star.x,
                star.y,

                radius,
                alpha,

                star.warm

            );

        }
    );

}


/* =========================================================
   DESSIN UNE ETOILE
   ========================================================= */

function drawFairyStar(
    x,
    y,
    r,
    alpha,
    warm
){

    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.globalAlpha =
        alpha;


    ctx.fillStyle =
        warm
        ?
        "#fff1b8"
        :
        "#ffffff";


    ctx.shadowColor =
        warm
        ?
        "#ffd777"
        :
        "#ffffff";


    ctx.shadowBlur =
        r
        *
        2.7;


    /*
       étoile à 4 branches
       fine et élégante
    */

    ctx.beginPath();


    ctx.moveTo(
        0,
        -r * 2.3
    );


    ctx.quadraticCurveTo(
        r * .13,
        -r * .18,
        r * 2.3,
        0
    );


    ctx.quadraticCurveTo(
        r * .13,
        r * .18,
        0,
        r * 2.3
    );


    ctx.quadraticCurveTo(
        -r * .13,
        r * .18,
        -r * 2.3,
        0
    );


    ctx.quadraticCurveTo(
        -r * .13,
        -r * .18,
        0,
        -r * 2.3
    );


    ctx.closePath();


    ctx.fill();


    /*
       petit cœur lumineux
    */

    ctx.beginPath();


    ctx.arc(
        0,
        0,
        r * .25,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   MERCI
   ========================================================= */

function drawBottomTitle(){

    const W =
        canvas.width;


    const H =
        canvas.height;


    /*
       léger fondu seulement
       derrière le MERCI
    */

    const gradient =
        ctx.createLinearGradient(

            0,
            H * .78,

            0,
            H

        );


    gradient.addColorStop(
        0,
        "rgba(0,0,0,0)"
    );


    gradient.addColorStop(
        1,
        "rgba(5,10,25,.42)"
    );


    ctx.fillStyle =
        gradient;


    ctx.fillRect(

        0,
        H * .75,

        W,
        H * .25

    );


    ctx.save();


    ctx.textAlign =
        "center";


    ctx.fillStyle =
        "#ffffff";


    ctx.shadowColor =
        "rgba(0,0,0,.55)";


    ctx.shadowBlur =
        12;


    ctx.font =
        "bold 64px Arial";


    ctx.fillText(

        "MERCI ❤️",

        W / 2,

        H - 65

    );


    ctx.restore();

}


/* =========================================================
   MIME
   ========================================================= */

function getSupportedMimeType(){

    const types = [

        "video/mp4",

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    for(
        const type
        of
        types
    ){

        if(
            MediaRecorder
                .isTypeSupported(
                    type
                )
        ){

            return type;

        }

    }


    return "";

}


/* =========================================================
   ENREGISTRER
   ========================================================= */

startRecord.addEventListener(
    "click",
    () => {

        if(
            !cameraStream
        ){
            return;
        }


        recordedChunks =
            [];


        recordedFile =
            null;


        hideStatus();


        const canvasStream =
            canvas.captureStream(
                30
            );


        const outputStream =
            new MediaStream();


        canvasStream
            .getVideoTracks()
            .forEach(
                track => {

                    outputStream.addTrack(
                        track
                    );

                }
            );


        cameraStream
            .getAudioTracks()
            .forEach(
                track => {

                    outputStream.addTrack(
                        track
                    );

                }
            );


        const mimeType =
            getSupportedMimeType();


        try{

            recorder =
                mimeType
                ?
                new MediaRecorder(

                    outputStream,

                    {

                        mimeType:
                            mimeType,

                        videoBitsPerSecond:
                            2300000

                    }

                )
                :
                new MediaRecorder(
                    outputStream
                );

        }
        catch(error){

            showStatus(
                "Impossible d'enregistrer cette vidéo."
            );

            return;

        }


        recorder.addEventListener(
            "dataavailable",
            event => {

                if(
                    event.data
                    &&
                    event.data.size
                    >
                    0
                ){

                    recordedChunks.push(
                        event.data
                    );

                }

            }
        );


        recorder.addEventListener(
            "stop",
            () => {

                const type =
                    recorder.mimeType
                    ||
                    "video/mp4";


                const blob =
                    new Blob(

                        recordedChunks,

                        {
                            type:type
                        }

                    );


                const extension =
                    type.includes(
                        "webm"
                    )
                    ?
                    "webm"
                    :
                    "mp4";


                recordedFile =
                    new File(

                        [blob],

                        `ma-reponse.${extension}`,

                        {
                            type:type
                        }

                    );


                if(
                    objectURL
                ){

                    URL.revokeObjectURL(
                        objectURL
                    );

                }


                objectURL =
                    URL.createObjectURL(
                        blob
                    );


                recordedPreview.src =
                    objectURL;


                canvas.style.display =
                    "none";


                recordedPreview.style.display =
                    "block";


                startRecord.style.display =
                    "none";


                stopRecord.style.display =
                    "none";


                restartRecord.style.display =
                    "inline-block";


                shareRecord.style.display =
                    "inline-block";


                recordTime.classList.remove(
                    "visible"
                );

            }
        );


        recorder.start();


        secondsRecorded =
            0;


        recordTime.textContent =
            "00:00";


        recordTime.classList.add(
            "visible"
        );


        startRecord.disabled =
            true;


        stopRecord.disabled =
            false;


        timer =
            setInterval(
                () => {

                    secondsRecorded++;


                    const minutes =
                        Math.floor(
                            secondsRecorded
                            /
                            60
                        );


                    const seconds =
                        secondsRecorded
                        %
                        60;


                    recordTime.textContent =
                        String(minutes)
                            .padStart(
                                2,
                                "0"
                            )
                        +
                        ":"
                        +
                        String(seconds)
                            .padStart(
                                2,
                                "0"
                            );


                    if(
                        secondsRecorded
                        >=
                        60
                    ){

                        stopRecording();

                    }

                },
                1000
            );

    }
);


/* =========================================================
   STOP
   ========================================================= */

function stopRecording(){

    if(
        !recorder
        ||
        recorder.state
        ===
        "inactive"
    ){
        return;
    }


    recorder.stop();


    clearInterval(
        timer
    );


    startRecord.disabled =
        false;


    stopRecord.disabled =
        true;

}


stopRecord.addEventListener(
    "click",
    stopRecording
);


/* =========================================================
   RECOMMENCER
   ========================================================= */

restartRecord.addEventListener(
    "click",
    () => {

        recordedFile =
            null;


        recordedPreview.pause();


        recordedPreview.removeAttribute(
            "src"
        );


        recordedPreview.load();


        recordedPreview.style.display =
            "none";


        canvas.style.display =
            "block";


        restartRecord.style.display =
            "none";


        shareRecord.style.display =
            "none";


        startRecord.style.display =
            "inline-block";


        startRecord.disabled =
            false;


        stopRecord.style.display =
            "inline-block";


        stopRecord.disabled =
            true;


        hideStatus();

    }
);


/* =========================================================
   PARTAGE
   ========================================================= */

shareRecord.addEventListener(
    "click",
    async () => {

        if(
            !recordedFile
        ){
            return;
        }


        if(
            !navigator.share
        ){

            showStatus(
                "Le partage direct n'est pas disponible sur ce navigateur."
            );

            return;

        }


        if(
            navigator.canShare
            &&
            !navigator.canShare({

                files:[
                    recordedFile
                ]

            })
        ){

            showStatus(
                "Cette vidéo ne peut pas être partagée directement."
            );

            return;

        }


        try{

            await navigator.share({

                files:[
                    recordedFile
                ],

                title:
                    "Ma réponse vidéo"

            });

        }
        catch(error){

            if(
                error.name
                !==
                "AbortError"
            ){

                showStatus(
                    "Impossible de partager la vidéo."
                );

            }

        }

    }
);


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
    message
){

    statusMessage.textContent =
        message;


    statusMessage.classList.add(
        "visible"
    );

}


function hideStatus(){

    statusMessage.classList.remove(
        "visible"
    );

}


/* =========================================================
   PAUSE HORS ECRAN
   ========================================================= */

const pauseObserver =
    new IntersectionObserver(

        entries => {

            entries.forEach(
                entry => {

                    const video =
                        entry.target;


                    if(
                        !entry.isIntersecting
                        &&
                        !video.paused
                    ){

                        video.pause();

                    }

                }
            );

        },

        {
            threshold:.12
        }

    );


videos.forEach(
    video =>
        pauseObserver.observe(
            video
        )
);


/* =========================================================
   RETOUR HAUT
   ========================================================= */

window.addEventListener(
    "scroll",
    () => {

        backToTop.classList.toggle(

            "visible",

            window.scrollY > 700

        );

    },

    {
        passive:true
    }
);


backToTop.addEventListener(
    "click",
    () => {

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    }
);


/* =========================================================
   NETTOYAGE
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        cancelAnimationFrame(
            animationFrame
        );


        if(
            cameraStream
        ){

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if(
            objectURL
        ){

            URL.revokeObjectURL(
                objectURL
            );

        }


        if(
            faceLandmarker
        ){

            try{

                faceLandmarker.close();

            }
            catch(error){}

        }

    }
);

</script>
