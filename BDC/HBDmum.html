<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#13283b">

<title>Bon anniversaire Maman</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    min-height:100dvh;
    font-family:Arial, Helvetica, sans-serif;

    background:
        #13283b
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif.jpg")
        repeat;

    background-size:300px;
    overflow-x:hidden;
}

.page{
    width:100%;
    max-width:620px;
    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(70px + env(safe-area-inset-bottom));
}

.header{
    width:100%;
    text-align:center;
    margin-bottom:24px;
}

.header img{
    display:block;
    width:100%;
    max-width:420px;
    height:auto;
    margin:0 auto;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:36px;
}

.video-card{
    width:100%;
}

.video-wrapper{
    position:relative;
    width:82%;
    margin:0 auto;
}

.video-wrapper.vertical{
    aspect-ratio:9 / 16;
}

.video-wrapper.horizontal{
    width:88%;
    aspect-ratio:16 / 9;
}

.main-video{
    position:absolute;
    inset:0;
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
    border-radius:14px;
}

.gift-cover{
    position:absolute;
    inset:0;
    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    opacity:1;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.gift-package{
    position:relative;
    width:100%;
    height:100%;

    filter:
        drop-shadow(
            0 14px 18px rgba(0,0,0,.42)
        );

    transition:
        filter .45s ease;
}

.gift-image{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    border-radius:14px;
}

.gift-hint{
    position:absolute;
    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    padding:9px 16px;

    white-space:nowrap;

    border-radius:30px;

    background:rgba(0,0,0,.58);

    color:#fff;

    font-size:13px;
    font-weight:bold;

    pointer-events:none;

    box-shadow:0 3px 10px rgba(0,0,0,.20);
}

.gift-cover.opening{
    opacity:0;
    transform:scale(1.035);
    pointer-events:none;
}

.gift-cover.opening .gift-package{
    filter:drop-shadow(0 0 0 rgba(0,0,0,0));
}

.action-zone{
    width:100%;
    padding-top:14px;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;

    gap:9px;
}

.action-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    min-height:40px;

    padding:9px 17px;

    border:0;
    border-radius:22px;

    font-family:inherit;
    font-size:13px;
    font-weight:bold;

    text-decoration:none;
    cursor:pointer;

    color:#fff;
    background:#9f80a6;

    box-shadow:0 4px 10px rgba(0,0,0,.20);
}

.reply-btn{
    background:#e26183;
}

.hidden{
    display:none !important;
}

.reply-panel{
    display:none;

    width:94%;

    margin:20px auto 0;
    padding:14px;

    background:rgba(9,20,31,.96);

    border-radius:18px;

    box-shadow:0 8px 22px rgba(0,0,0,.32);
}

.reply-panel.visible{
    display:block;
}

.reply-title{
    margin-bottom:8px;

    color:#fff;

    font-size:23px;
    line-height:1;

    text-align:center;
    letter-spacing:4px;
}

.reply-info{
    margin-bottom:13px;

    color:rgba(255,255,255,.78);

    font-size:12px;
    line-height:1.45;

    text-align:center;
}

.crown-zone{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;

    gap:7px;
    margin-bottom:13px;
}

.crown-btn{
    flex:1 1 calc(20% - 7px);

    min-width:62px;
    max-width:88px;
    height:54px;

    padding:0;

    border:1px solid rgba(255,255,255,.22);

    border-radius:13px;

    background:rgba(255,255,255,.07);

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.crown-btn.active{
    background:#e26183;
    border-color:#e26183;
}

.crown-btn span{
    display:block;
    margin:0;
    font-size:24px;
    line-height:1;
}

.normal-cross{
    color:#fff;
    font-size:27px !important;
    font-weight:300;
}

.camera-frame{
    position:relative;
    width:100%;
    aspect-ratio:9 / 16;

    overflow:hidden;

    background:#13283b;
    border-radius:14px;
}

#cameraSource{
    display:none;
}

#partyCanvas{
    display:block;
    width:100%;
    height:100%;
    background:#13283b;
}

#recordedPreview{
    display:none;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.record-time{
    position:absolute;
    top:10px;
    left:50%;

    z-index:20;

    transform:translateX(-50%);

    display:none;

    padding:6px 11px;

    border-radius:20px;

    background:rgba(0,0,0,.72);

    color:#fff;

    font-size:13px;
    font-weight:bold;
}

.record-time.visible{
    display:block;
}

.camera-actions{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;

    gap:8px;
    margin-top:12px;
}

.camera-btn{
    min-height:42px;

    padding:9px 15px;

    border:0;
    border-radius:22px;

    font-family:inherit;
    font-size:13px;
    font-weight:bold;

    cursor:pointer;
}

.camera-btn.primary{
    background:#e26183;
    color:#fff;
}

.camera-btn.secondary{
    background:#fff;
    color:#253344;
}

.camera-btn.send{
    background:#6fa773;
    color:#fff;
}

.camera-btn:disabled{
    opacity:.45;
    cursor:default;
}

.status-message{
    display:none;

    margin-top:12px;
    padding:11px;

    border-radius:12px;

    background:rgba(255,255,255,.10);

    color:#fff;

    font-size:12px;
    line-height:1.45;

    text-align:center;
}

.status-message.visible{
    display:block;
}

.back-to-top{
    position:fixed;
    right:16px;

    bottom:calc(18px + env(safe-area-inset-bottom));

    z-index:100;

    width:48px;
    height:48px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:0;
    border-radius:50%;

    background:rgba(80,52,84,.90);

    color:#fff;
    font-size:24px;

    cursor:pointer;

    box-shadow:0 5px 15px rgba(0,0,0,.30);

    opacity:0;
    visibility:hidden;

    transform:translateY(10px);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;
}

.back-to-top.visible{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

@media(max-width:380px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .video-wrapper{
        width:80%;
    }

    .video-wrapper.horizontal{
        width:88%;
    }

    .reply-panel{
        width:96%;
    }

</style>

<script type="module">

import {
    FaceLandmarker,
    FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/+esm";


/* =========================================================
   CONFIGURATION
   ========================================================= */

const BASE =
    "https://avantpost-cpu.github.io/depot-quiz/BDC/";


/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
    "https://tdsrqmpfdvntybdlvejy.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_MIYryZDKmU4cGMIGdXojnA_GQ5qmpOO";


/* =========================================================
   IDENTIFICATION
   ========================================================= */

const VISITOR_TYPE =
    localStorage.getItem("birthday_owner") === "cyrille"
        ? "cyrille"
        : "visitor";


/* =========================================================
   CLE DE CETTE VISITE
   ========================================================= */

const VISIT_KEY =
    crypto.randomUUID();


/* =========================================================
   CADEAUX OUVERTS PENDANT CETTE VISITE
   ========================================================= */

const openedGiftIndexes =
    new Set();


/* =========================================================
   CREATION DE LA VISITE

   IMPORTANT :
   opened_list N'EST PAS envoyé ici.
   Il sera renseigné au premier cadeau ouvert.
   ========================================================= */

const visitCreationPromise =
    createVisit();


async function createVisit(){

    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/birthday_visits",

                {

                    method:"POST",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },

                    body:
                        JSON.stringify({

                            visit_key:
                                VISIT_KEY,

                            opened_gifts:
                                0,

                            visitor_type:
                                VISITOR_TYPE

                        })

                }

            );


        if(
            !response.ok
        ){

            const message =
                await response.text();


            console.error(
                "Création visite impossible :",
                response.status,
                message
            );


            return false;

        }


        console.log(
            "Visite créée :",
            VISIT_KEY,
            VISITOR_TYPE
        );


        return true;

    }
    catch(error){

        console.error(
            "Suivi visite indisponible :",
            error
        );


        return false;

    }

}


/* =========================================================
   MISE A JOUR DES CADEAUX
   ========================================================= */

async function updateOpenedGifts(){

    const visitCreated =
        await visitCreationPromise;


    if(
        !visitCreated
    ){
        return;
    }


    const total =
        openedGiftIndexes.size;


    /*
       Les index internes sont :
       0 1 2 3 4 5 6

       Dans Supabase on enregistre :
       1 2 3 4 5 6 7
    */

    const openedList =
        Array.from(
            openedGiftIndexes
        )
        .map(
            index =>
                index + 1
        )
        .sort(
            (a,b) =>
                a - b
        );


    console.log(
        "Cadeaux ouverts :",
        total,
        openedList
    );


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/birthday_visits?visit_key=eq." +
                encodeURIComponent(
                    VISIT_KEY
                ),

                {

                    method:"PATCH",

                    headers:{

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },

                    body:
                        JSON.stringify({

                            opened_gifts:
                                total,

                            opened_list:
                                openedList

                        })

                }

            );


        if(
            !response.ok
        ){

            const message =
                await response.text();


            console.error(
                "Mise à jour cadeaux impossible :",
                response.status,
                message
            );


            return;

        }


        console.log(
            "Supabase mis à jour :",
            openedList
        );

    }
    catch(error){

        console.error(
            "Suivi cadeaux indisponible :",
            error
        );

    }

}


/* =========================================================
   ENREGISTRER UNE OUVERTURE
   ========================================================= */

function registerGiftOpening(
    index
){

    /*
       Si déjà ouvert pendant cette visite,
       on ne recompte pas.
    */

    if(
        openedGiftIndexes.has(
            index
        )
    ){
        return;
    }


    openedGiftIndexes.add(
        index
    );


    updateOpenedGifts();

}


/* =========================================================
   VIDEOS
   ========================================================= */

const cards = [

    {
        name:"Mamie",
        video:"mamie.mp4",
        pack:"pack1.jpg",
        format:"vertical",
        reply:true
    },

    {
        name:"Tata",

    },

    {
        name:"Raoul",

    },

    {

    },

    {

    },

    {

    },

    {

/* =========================================================
   IMAGE FRAME
   ========================================================= */

const frameImage =
    new Image();


frameImage.crossOrigin =
    "anonymous";


frameImage.src =
    BASE +

/* =========================================================
   COURONNES
   ========================================================= */

const crownImages = {};


function createCrownImage(
    name
){

    const image =
        new Image();


    image.crossOrigin =
        "anonymous";


    image.src =

        name +

}


crownImages.crown1 =
    createCrownImage("crown1");

crownImages.crown2 =

crownImages.crown3 =

crownImages.crown4 =

/* =========================================================
   CREATION DES CARTES
   ========================================================= */

const videoList =
    document.getElementById(
        "videoList"
    );


cards.forEach(
    (item,index) => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "video-card";


        card.dataset.index =
            index;


        card.dataset.name =
            item.name;


        card.dataset.reply =
            item.reply
            ?
            "true"
            :
            "false";


        card.innerHTML = `

            <div
                class="video-wrapper ${item.format}"
            >

                <video
                    class="main-video"
                    controls
                    playsinline
                    preload="none"
                    data-src="${BASE}${item.video}"
                ></video>

                <div
                    class="gift-cover"
                    role="button"
                    tabindex="0"
                    aria-label="Ouvrir le cadeau"
                >

                    <div class="gift-package">

                        <img
                            class="gift-image"
                            src="${BASE}${item.pack}"
                            alt=""
                        >

                    </div>

                    <div class="gift-hint">
                        Ouvre ton cadeau
                    </div>

                </div>

            </div>

            <div class="action-zone">

                <a
                    class="action-btn"
                    href="${BASE}${item.video}"
                    download="${item.video}"
                >
                    ↓ Télécharger
                </a>

                ${
                    item.reply
                    ?
                    `
                    <button
                        class="action-btn reply-btn hidden"
                        type="button"
                    >
                        Répondre en vidéo
                    </button>
                    `
                    :
                    ""
                }

            </div>

        `;


        videoList.appendChild(
            card
        );

    }
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const videos =
    document.querySelectorAll(
        ".main-video"
    );


const gifts =
    document.querySelectorAll(
        ".gift-cover"
    );


const replyButtons =
    document.querySelectorAll(
        ".reply-btn"
    );


const replyPanel =
    document.getElementById(
        "replyPanel"
    );


const cameraSource =
    document.getElementById(
        "cameraSource"
    );


const canvas =
    document.getElementById(
        "partyCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const recordedPreview =

    );

    );


const stopRecord =

    );

    );


const shareRecord =

    );

    );


const crownButtons =
    document.querySelectorAll(

        "statusMessage"
    );


const backToTop =
    document.getElementById(
        "backToTop"

/* =========================================================
   VARIABLES CAMERA
   ========================================================= */

let currentCard =
    null;

let cameraStream =
    null;

let faceLandmarker =
    null;

let trackingReady =
    false;

let trackingLoading =
    false;

let latestLandmarks =
    null;

let selectedCrown =
    "crown1";

let recorder =
    null;

let recordedChunks =
    [];

let recordedFile =
    null;

let objectURL =
    null;

let timer =
    null;

let secondsRecorded =
    0;

let animationFrame =
    null;

let lastDetection =
    0;

let selfieFrame = {

    x:0,
    y:0,
    width:720,
    height:1280

};


/* =========================================================
   ETOILES
   ========================================================= */

const fairyStars =
    Array.from(

        {
            length:38
        },

        () => ({

            x:
                Math.random()
                *
                canvas.width,

            y:
                Math.random()
                *
                canvas.height,

            radius:
                1.5
                +
                Math.random()
                *
                4.2,

            pulseSpeed:
                .003
                +
                Math.random()
                *
                .008,

            phase:
                Math.random()
                *
                Math.PI
                *
                2,

            drift:
                .025
                +
                Math.random()
                *
                .10,

            warm:
                Math.random()
                >
                .66

        })

    );


/* =========================================================
   LAZY LOAD
   ========================================================= */

const videoObserver =
    new IntersectionObserver(

        entries => {

            entries.forEach(
                entry => {

                    if(
                        !entry.isIntersecting
                    ){
                        return;
                    }


                    const video =
                        entry.target;


                    if(
                        !video.src
                        &&
                        video.dataset.src
                    ){

                        video.src =
                            video.dataset.src;


                        video.load();

                    }


                    videoObserver.unobserve(
                        video
                    );

                }
            );

        },

        {
            rootMargin:
                "350px 0px"
        }

    );


videos.forEach(
    video => {

        videoObserver.observe(
            video
        );

    }
);


/* =========================================================
   OUVERTURE CADEAU
   ========================================================= */

async function openGift(
    gift
){

    if(
        gift.classList.contains(
            "opening"
        )
    ){
        return;
    }


    const card =
        gift.closest(
            ".video-card"
        );


    const video =
        card.querySelector(
            ".main-video"
        );


    const cardIndex =
        Number(
            card.dataset.index
        );


    /*
       ICI le cadeau est enregistré.
    */

    registerGiftOpening(
        cardIndex
    );


    if(
        !video.src
        &&
        video.dataset.src
    ){

        video.src =
            video.dataset.src;


        video.load();

    }


    gift.classList.add(
        "opening"
    );


    if(
        card.dataset.reply
        ===
        "true"
    ){

        const replyButton =
            card.querySelector(
                ".reply-btn"
            );


        if(
            replyButton
        ){

            replyButton.classList.remove(
                "hidden"
            );

        }

    }


    try{

        await video.play();

    }
    catch(error){}


    setTimeout(
        () => {

            gift.style.display =
                "none";

        },
        450
    );

}


/* =========================================================
   CLIC CADEAUX
   ========================================================= */

gifts.forEach(
    gift => {

        gift.addEventListener(
            "click",
            () => {

                openGift(
                    gift
                );

            }
        );


        gift.addEventListener(
            "keydown",
            event => {

                if(
                    event.key === "Enter"
                    ||
                    event.key === " "
                ){

                        gift
                    );

                }

        );

);


/* =========================================================
   UNE VIDEO A LA FOIS
   ========================================================= */

videos.forEach(
    video => {

        video.addEventListener(
            "play",
            () => {

                videos.forEach(
                    other => {

                        if(
                            other !== video

                            !other.paused
                        ){

                            other.pause();

                        }

                    }
                );

            }
        );

    }
);


/* =========================================================
   REPONDRE
   ========================================================= */

replyButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            async () => {

                currentCard =
                    button.closest(
                        ".video-card"
                    );


                const video =
                    currentCard.querySelector(
                        ".main-video"
                    );


                video.pause();


                currentCard.insertAdjacentElement(
                    "afterend",
                    replyPanel
                );


                replyPanel.classList.add(
                    "visible"
                );


                resetReplyInterface();


                hideStatus();


                stopCameraStream();


                try{

                    cameraStream =
                        await navigator
                            .mediaDevices
                            .getUserMedia({

                                video:{

                                    facingMode:
                                        "user",

                                    width:{
                                        ideal:1280
                                    },

                                    height:{
                                        ideal:720
                                    },

                                    frameRate:{
                                        ideal:30
                                    }

                                },

                                audio:true

                            });


                    cameraSource.srcObject =
                        cameraStream;


                    await cameraSource.play();


                    canvas.style.display =
                        "block";


                    recordedPreview.style.display =
                        "none";


                    latestLandmarks =
                        null;


                    cancelAnimationFrame(
                        animationFrame
                    );


                    drawFrame();


                    if(
                        selectedCrown !== "none"
                    ){

                        initFaceTracking();

                    }


                    replyPanel.scrollIntoView({

                        behavior:"smooth",
                        block:"center"

                    });

                }
                catch(error){

                    console.error(

                    );


                    showStatus(
                        "Impossible d'accéder à la caméra ou au micro."
                    );

);


/* =========================================================
   COURONNES
   ========================================================= */

crownButtons.forEach(
    button => {

        button.addEventListener(
            "click",
            () => {

                selectedCrown =
                    button.dataset.crown;


                crownButtons.forEach(
                    btn => {

                        btn.classList.remove(
                            "active"
                        );

                    }
                );


                button.classList.add(

                );

                    selectedCrown !== "none"
                ){

                    initFaceTracking();

                }

            }
        );

    }
);


/* =========================================================
   MEDIAPIPE
   ========================================================= */

async function initFaceTracking(){

    if(
        trackingReady
        ||
        trackingLoading
    ){
        return;
    }


    trackingLoading =
        true;


    showStatus(
        "Chargement du filtre…"
    );


    try{

        const vision =
            await FilesetResolver
                .forVisionTasks(

                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"

                );


        try{

            faceLandmarker =
                await FaceLandmarker
                    .createFromOptions(

                        vision,

                        {

                            baseOptions:{

                                modelAssetPath:
                                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                                delegate:
                                    "GPU"

                            },

                            runningMode:
                                "VIDEO",

                            numFaces:
                                1,

                            minFaceDetectionConfidence:
                                .5,

                            minFacePresenceConfidence:
                                .5,

                            minTrackingConfidence:
                                .5

                        }

                    );

        }
        catch(error){

            faceLandmarker =
                await FaceLandmarker
                    .createFromOptions(

                        vision,

                        {

                            baseOptions:{

                                modelAssetPath:
                                    "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                                delegate:
                                    "CPU"

                            },

                            runningMode:
                                "VIDEO",

                            numFaces:
                                1

                        }

                    );

        }


        trackingReady =
            true;


        hideStatus();

    }
    catch(error){

        console.error(
            error
        );


        showStatus(
            "Le suivi du visage n'a pas pu être chargé."
        );

    }
    finally{

        trackingLoading =
            false;

    }

}


/* =========================================================
   DRAW
   ========================================================= */

function drawFrame(){

    const W =
        canvas.width;


    const H =
        canvas.height;


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawFrameBackground(
        W,
        H
    );


    if(
        cameraSource.readyState >= 2
    ){

        drawSelfieScene(
            W,
            H
        );

    }


    if(
        trackingReady
        &&
        selectedCrown !== "none"
        &&
        cameraSource.readyState >= 2
    ){

        const now =
            performance.now();


        if(
            now - lastDetection > 65
        ){

            lastDetection =
                now;


            try{

                const result =
                    faceLandmarker
                        .detectForVideo(

                            cameraSource,
                            now

                        );


                if(
                    result.faceLandmarks
                    &&
                    result.faceLandmarks[0]
                ){

                    latestLandmarks =
                        result.faceLandmarks[0];

                }

            }
            catch(error){}

        }

    }


    if(
        selectedCrown !== "none"
    ){

        drawFairyStars();


        if(
            latestLandmarks
        ){

            drawCrown(
                latestLandmarks
            );

        }

    }


    animationFrame =
        requestAnimationFrame(
            drawFrame
        );

}


/* =========================================================
   FRAME
   ========================================================= */

function drawFrameBackground(
    W,
    H
){

    ctx.fillStyle =
        "#13283b";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    if(
        !frameImage.complete
        ||
        !frameImage.naturalWidth
    ){
        return;
    }


    ctx.drawImage(
        frameImage,
        0,
        0,
        W,
        H
    );

}


/* =========================================================
   SELFIE
   ========================================================= */

function drawSelfieScene(
    W,
    H
){

    const vw =
        cameraSource.videoWidth;


    const vh =
        cameraSource.videoHeight;


    if(
        !vw
        ||
        !vh
    ){
        return;
    }


    const maxW =
        W * .88;


    const maxH =
        H * .92;


    const videoRatio =
        vw / vh;


    const targetRatio =
        maxW / maxH;


    let drawW;
    let drawH;


    if(
        videoRatio > targetRatio
    ){

        drawW =
            maxW;


        drawH =
            drawW / videoRatio;

    }
    else{

        drawH =
            maxH;


        drawW =
            drawH * videoRatio;

    }


    const x =
        (W - drawW) / 2;


    const y =
        (H - drawH) / 2;


    selfieFrame = {

        x:x,
        y:y,
        width:drawW,
        height:drawH

    };


    ctx.save();


    ctx.shadowColor =
        "rgba(0,0,0,.26)";


    ctx.shadowBlur =
        8;


    ctx.fillStyle =
        "#000";


    ctx.fillRect(
        x - 2,
        y - 2,
        drawW + 4,
        drawH + 4
    );


    ctx.restore();


    ctx.save();


    ctx.translate(
        W,
        0
    );


    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(
        cameraSource,
        W - x - drawW,
        y,
        drawW,
        drawH
    );


    ctx.restore();

}


/* =========================================================
   LANDMARK
   ========================================================= */

function landmarkToCanvas(
    landmark
){

    return {

        x:
            selfieFrame.x
            +
            (1 - landmark.x)
            *
            selfieFrame.width,

        y:
            selfieFrame.y
            +
            landmark.y
            *
            selfieFrame.height

    };

}


/* =========================================================
   POSITION COURONNE
   ========================================================= */

function getCrownTransform(
    points
){

    const leftFace =
        landmarkToCanvas(
            points[234]
        );


    const rightFace =
        landmarkToCanvas(
            points[454]
        );


    const forehead =
        landmarkToCanvas(
            points[10]
        );


    const leftEye =
        landmarkToCanvas(
            points[33]
        );


    const rightEye =
        landmarkToCanvas(
            points[263]
        );


    const faceWidth =
        Math.hypot(

            rightFace.x - leftFace.x,
            rightFace.y - leftFace.y

        );


    let angle =
        Math.atan2(

            rightEye.y - leftEye.y,
            rightEye.x - leftEye.x

        );


    if(
        angle > Math.PI / 2
    ){

        angle -=
            Math.PI;

    }


    if(
        angle < -Math.PI / 2
    ){

        angle +=
            Math.PI;

    }


    return {

        x:
            forehead.x,

        y:
            forehead.y
            +
            faceWidth * .42,

        width:
            faceWidth * 1.65,

        angle:
            angle

    };

}


/* =========================================================
   COURONNE
   ========================================================= */

function drawCrown(
    points
){

    if(
        selectedCrown === "none"
    ){
        return;
    }


    const image =
        crownImages[
            selectedCrown
        ];


    if(
        !image
        ||
        !image.complete
        ||
        !image.naturalWidth
    ){
        return;
    }


    const p =
        getCrownTransform(
            points
        );


    const ratio =
        image.naturalHeight
        /
        image.naturalWidth;


    let width =
        p.width;


    if(
        selectedCrown === "crown3"
    ){

        width *=
            .80;

    }


    const height =
        width * ratio;


    ctx.save();


    ctx.translate(
        p.x,
        p.y
    );


    ctx.rotate(
        p.angle
    );


    ctx.shadowColor =
        "rgba(0,0,0,.20)";


    ctx.shadowBlur =
        9;


    ctx.drawImage(
        image,
        -width / 2,
        -height,
        width,
        height
    );


    ctx.restore();

}


/* =========================================================
   ETOILES
   ========================================================= */

function drawFairyStars(){

    const now =
        performance.now();


    fairyStars.forEach(
        star => {

            star.y -=
                star.drift;


            if(
                star.y < -15
            ){

                star.y =
                    canvas.height + 15;


                star.x =
                    Math.random()
                    *
                    canvas.width;

            }


            const pulse =
                (
                    Math.sin(
                        now
                        *
                        star.pulseSpeed
                        +
                        star.phase
                    )
                    +
                    1
                )
                /
                2;


            const alpha =
                .12
                +
                pulse * .72;


            const size =
                star.radius
                *
                (
                    .65
                    +
                    pulse * .75
                );


            drawSingleFairyStar(
                star.x,
                star.y,
                size,
                alpha,
                star.warm
            );

        }
    );

}


function drawSingleFairyStar(
    x,
    y,
    r,
    alpha,
    warm
){

    ctx.save();


    ctx.translate(
        x,
        y
    );


    ctx.globalAlpha =
        alpha;


    ctx.fillStyle =
        warm
        ?
        "#fff1b4"
        :
        "#ffffff";


    ctx.shadowColor =
        warm
        ?
        "#ffd56d"
        :
        "#ffffff";


    ctx.shadowBlur =
        r * 3;


    ctx.beginPath();


    ctx.moveTo(
        0,
        -r * 2.4
    );


    ctx.quadraticCurveTo(
        r * .12,
        -r * .16,
        r * 2.4,
        0
    );


    ctx.quadraticCurveTo(
        r * .12,
        r * .16,
        0,
        r * 2.4
    );


    ctx.quadraticCurveTo(
        -r * .12,
        r * .16,
        -r * 2.4,
        0
    );


    ctx.quadraticCurveTo(
        -r * .12,
        -r * .16,
        0,
        -r * 2.4
    );


    ctx.closePath();


    ctx.fill();


    ctx.beginPath();


    ctx.arc(
        0,
        0,
        r * .28,
        0,
        Math.PI * 2
    );


    ctx.fill();


    ctx.restore();

}


/* =========================================================
   MIME
   ========================================================= */

function getSupportedMimeType(){

    const types = [

        "video/mp4",
        "video/webm;codecs=vp9,opus",
        "video/webm;codecs=vp8,opus",
        "video/webm"

    ];


    for(
        const type
        of
        types
    ){

        if(
            MediaRecorder
                .isTypeSupported(
                    type
                )
        ){

            return type;

        }

    }


    return "";

}


/* =========================================================
   ENREGISTREMENT
   ========================================================= */

startRecord.addEventListener(
    "click",
    () => {

        if(
            !cameraStream
        ){
            return;
        }


        recordedChunks =
            [];


        recordedFile =
            null;


        hideStatus();


        const canvasStream =
            canvas.captureStream(
                30
            );


        const outputStream =
            new MediaStream();


        canvasStream
            .getVideoTracks()
            .forEach(
                track => {

                    outputStream.addTrack(
                        track
                    );

                }
            );


        cameraStream
            .getAudioTracks()
            .forEach(
                track => {

                    outputStream.addTrack(
                        track
                    );

                }
            );


        const mimeType =
            getSupportedMimeType();


        try{

            recorder =
                mimeType
                ?
                new MediaRecorder(

                    outputStream,

                    {

                        mimeType:
                            mimeType,

                        videoBitsPerSecond:
                            2300000

                    }

                )
                :
                new MediaRecorder(
                    outputStream
                );

        }
        catch(error){

            showStatus(
                "Impossible d'enregistrer cette vidéo."
            );


            return;

        }


        recorder.addEventListener(
            "dataavailable",
            event => {

                if(
                    event.data
                    &&
                    event.data.size > 0
                ){

                    recordedChunks.push(
                        event.data
                    );

                }

            }
        );


        recorder.addEventListener(
            "stop",
            () => {

                const type =
                    recorder.mimeType
                    ||
                    "video/mp4";


                const blob =
                    new Blob(

                        recordedChunks,

                        {
                            type:type
                        }

                    );


                const extension =
                    type.includes("webm")
                    ?
                    "webm"
                    :
                    "mp4";


                recordedFile =
                    new File(

                        [blob],

                        `reponse-video.${extension}`,

                        {
                            type:type
                        }

                    );


                if(
                    objectURL
                ){

                    URL.revokeObjectURL(
                        objectURL
                    );

                }


                objectURL =
                    URL.createObjectURL(
                        blob
                    );


                recordedPreview.src =
                    objectURL;


                canvas.style.display =
                    "none";


                recordedPreview.style.display =
                    "block";


                startRecord.style.display =
                    "none";


                stopRecord.style.display =
                    "none";


                restartRecord.style.display =
                    "inline-block";


                shareRecord.style.display =
                    "inline-block";


                recordTime.classList.remove(
                    "visible"
                );

            }
        );


        recorder.start();


        secondsRecorded =
            0;


        recordTime.textContent =
            "00:00";


        recordTime.classList.add(
            "visible"
        );


        startRecord.disabled =
            true;


        stopRecord.disabled =
            false;


        timer =
            setInterval(
                () => {

                    secondsRecorded++;


                    const minutes =
                        Math.floor(
                            secondsRecorded / 60
                        );


                    const seconds =
                        secondsRecorded % 60;


                    recordTime.textContent =
                        String(minutes)
                            .padStart(2,"0")
                        +
                        ":"
                        +
                        String(seconds)
                            .padStart(2,"0");


                    if(
                        secondsRecorded >= 60
                    ){

                        stopRecording();

                    }

                },
                1000
            );

    }
);


function stopRecording(){

    if(
        !recorder
        ||
        recorder.state === "inactive"
    ){
        return;
    }


    recorder.stop();


    clearInterval(
        timer
    );


    startRecord.disabled =
        false;


    stopRecord.disabled =
        true;

}


stopRecord.addEventListener(
    "click",
    stopRecording
);


/* =========================================================
   RECOMMENCER
   ========================================================= */

restartRecord.addEventListener(
    "click",
    () => {

        recordedFile =
            null;


        if(
            objectURL
        ){

            URL.revokeObjectURL(
                objectURL
            );


            objectURL =
                null;

        }


        recordedPreview.pause();


        recordedPreview.removeAttribute(
            "src"
        );


        recordedPreview.load();


        recordedPreview.style.display =
            "none";


        canvas.style.display =
            "block";


        restartRecord.style.display =
            "none";


        shareRecord.style.display =
            "none";


        startRecord.style.display =
            "inline-block";


        startRecord.disabled =
            false;


        stopRecord.style.display =
            "inline-block";


        stopRecord.disabled =
            true;


        recordTime.classList.remove(
            "visible"
        );


        hideStatus();

    }
);


/* =========================================================
   PARTAGE
   ========================================================= */

shareRecord.addEventListener(
    "click",
    async () => {

        if(
            !recordedFile
        ){
            return;
        }


        if(
            !navigator.share
        ){

            showStatus(
                "Le partage direct n'est pas disponible sur ce navigateur."
            );


            return;

        }


        if(
            navigator.canShare
            &&
            !navigator.canShare({

                files:[
                    recordedFile
                ]

            })
        ){

            showStatus(
                "Cette vidéo ne peut pas être partagée directement."
            );


            return;

        }


        try{

            await navigator.share({

                files:[
                    recordedFile
                ],

                title:
                    "🩷 🩷 🩷"

            });


            stopCameraStream();

        }
        catch(error){

            if(
                error.name !== "AbortError"
            ){

                showStatus(
                    "Impossible de partager la vidéo."
                );

            }

        }

    }
);


/* =========================================================
   RESET
   ========================================================= */

function resetReplyInterface(){

    if(
        recorder
        &&
        recorder.state !== "inactive"
    ){

        try{

            recorder.stop();

        }
        catch(error){}

    }


    clearInterval(
        timer
    );


    secondsRecorded =
        0;


    recordedFile =
        null;


    recordedChunks =
        [];


    if(
        objectURL
    ){

        URL.revokeObjectURL(
            objectURL
        );


        objectURL =
            null;

    }


    recordedPreview.pause();


    recordedPreview.removeAttribute(
        "src"
    );


    recordedPreview.load();


    recordedPreview.style.display =
        "none";


    canvas.style.display =
        "block";


    startRecord.style.display =
        "inline-block";


    startRecord.disabled =
        false;


    stopRecord.style.display =
        "inline-block";


    stopRecord.disabled =
        true;


    restartRecord.style.display =
        "none";


    shareRecord.style.display =
        "none";


    recordTime.textContent =
        "00:00";


    recordTime.classList.remove(
        "visible"
    );


    latestLandmarks =
        null;

}


/* =========================================================
   CAMERA OFF
   ========================================================= */

function stopCameraStream(){

    if(
        cameraStream
    ){

        cameraStream
            .getTracks()
            .forEach(
                track => {

                    track.stop();

                }
            );


        cameraStream =
            null;


        cameraSource.srcObject =
            null;

    }

}


/* =========================================================
   STATUS
   ========================================================= */

function showStatus(
    message
){

    statusMessage.textContent =
        message;


    statusMessage.classList.add(
        "visible"
    );

}


function hideStatus(){

    statusMessage.classList.remove(
        "visible"
    );

}


/* =========================================================
   PAUSE HORS ECRAN
   ========================================================= */

const pauseObserver =
    new IntersectionObserver(

        entries => {

            entries.forEach(
                entry => {

                    const video =
                        entry.target;


                    if(
                        !entry.isIntersecting
                        &&
                        !video.paused
                    ){

                        video.pause();

                    }

                }
            );

        },

        {
            threshold:.12
        }

    );


videos.forEach(
    video => {

        pauseObserver.observe(
            video
        );

    }
);


/* =========================================================
   RETOUR EN HAUT
   ========================================================= */

window.addEventListener(
    "scroll",
    () => {

        backToTop.classList.toggle(

            "visible",

            window.scrollY > 700

        );

    },

    {
        passive:true
    }
);


backToTop.addEventListener(
    "click",
    () => {

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    }
);


/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        cancelAnimationFrame(
            animationFrame
        );


        clearInterval(
            timer
        );


        stopCameraStream();


        if(
            objectURL
        ){

            URL.revokeObjectURL(
                objectURL
            );

        }


        if(
            faceLandmarker
        ){

            try{

                faceLandmarker.close();

            }
            catch(error){}

        }

    }
);

</script>
