<title>Bon anniversaire Maman</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;
    min-height:100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #9f80a6
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif_leopard.png")
        repeat;

    background-size:300px;

    overflow-x:hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{

    width:100%;
    max-width:620px;

    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(60px + env(safe-area-inset-bottom));

}


/* =========================================================
   TITRE
   ========================================================= */

.header{

    width:100%;

    text-align:center;

    margin-bottom:24px;

}

.header img{

    display:block;

    width:100%;
    max-width:420px;

    height:auto;

    margin:0 auto;

}


/* =========================================================
   LISTE
   ========================================================= */

.video-list{

    display:flex;

    flex-direction:column;

    gap:26px;

}


/* =========================================================
   CARTE
   ========================================================= */

.video-card{

    width:100%;

}


/* =========================================================
   ZONE VIDÉO
   ========================================================= */

.video-wrapper{

    position:relative;

    width:100%;

}


/* vidéos verticales */

.video-wrapper.vertical{

    aspect-ratio:9 / 16;

}


/* vidéo 2 horizontale */

.video-wrapper.horizontal{

    aspect-ratio:16 / 9;

}


/* =========================================================
   VIDÉO
   ========================================================= */

.video-wrapper video{

    position:absolute;

    inset:0;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000000;

    border-radius:18px;

}


/* =========================================================
   IMAGE DU PAQUET
   ========================================================= */

.gift-cover{

    position:absolute;

    inset:0;

    z-index:10;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
        opacity .45s ease,
        transform .45s ease;

}


/* image du paquet */

.gift-image{

    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:18px;

    /*
       OMBRE PORTÉE
    */

    filter:
        drop-shadow(
            0 12px 14px rgba(0,0,0,.38)
        );

    transition:
        filter .4s ease,
        opacity .45s ease,
        transform .45s ease;

}


/* =========================================================
   PAQUET HORIZONTAL
   VIDÉO 2
   ========================================================= */

.video-wrapper.horizontal .gift-image{

    width:100%;
    height:100%;

    object-fit:cover;

    object-position:center;

}


/* =========================================================
   OUVERTURE DU CADEAU
   ========================================================= */

.gift-cover.open{

    opacity:0;

    transform:scale(1.025);

    pointer-events:none;

}


/* disparition de l'ombre */

.gift-cover.open .gift-image{

    filter:
        drop-shadow(
            0 0 0 rgba(0,0,0,0)
        );

}


/* =========================================================
   INDICATION
   ========================================================= */

.gift-hint{

    position:absolute;

    left:50%;

    bottom:18px;

    z-index:20;

    transform:translateX(-50%);

    padding:
        9px
        16px;

    border-radius:30px;

    white-space:nowrap;

    background:
        rgba(0,0,0,.58);

    color:#ffffff;

    font-size:13px;

    font-weight:bold;

    letter-spacing:.2px;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.18);

    pointer-events:none;

}


/* =========================================================
   TÉLÉCHARGEMENT
   ========================================================= */

.download-zone{

    width:100%;

    padding-top:12px;

    text-align:center;

}


.download-btn{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding:
        9px
        17px;

    font-size:13px;

    font-weight:bold;

    color:#ffffff;

    background:#9f80a6;

    text-decoration:none;

    border-radius:22px;

    box-shadow:
        0 4px 10px
        rgba(0,0,0,.18);

    transition:
        transform .15s ease,
        opacity .15s ease;

}


.download-btn:active{

    transform:scale(.96);

    opacity:.85;

}


/* =========================================================
   RETOUR EN HAUT
   ========================================================= */

.back-to-top{

    position:fixed;

    right:16px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:100;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:
        rgba(80,52,84,.88);

    color:#ffffff;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.3);

    opacity:0;

    visibility:hidden;

    transform:
        translateY(10px);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;

}


.back-to-top.visible{

    opacity:1;

    visibility:visible;

    transform:
        translateY(0);

}


/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media(max-width:380px){

    .page{

        padding-left:10px;
        padding-right:10px;

    }

    .video-list{

        gap:22px;

    }

    .video-wrapper video,
    .gift-image{

        border-radius:14px;

    }

    .download-btn{

        font-size:12px;

        padding:
            8px
            14px;

    }

    .gift-hint{

        bottom:12px;

        font-size:12px;

        padding:
            8px
            13px;

    }

}


/* =========================================================
   ACCESSIBILITÉ
   ========================================================= */

@media(
    prefers-reduced-motion:reduce
){

    html{

        scroll-behavior:auto;

    }

    .gift-cover,
    .gift-image,
    .back-to-top{

        transition:none;

    }

}

</style>

</head>

<script>


/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const videos =
    document.querySelectorAll("video");

const gifts =
    document.querySelectorAll(".gift-cover");

const backToTop =
    document.getElementById("backToTop");


/* =========================================================
   CHARGEMENT INTELLIGENT
   ========================================================= */

const videoObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach((entry) => {

                if(
                    !entry.isIntersecting
                ){
                    return;
                }

                const video =
                    entry.target;


                if(
                    !video.src &&
                    video.dataset.src
                ){

                    video.src =
                        video.dataset.src;

                    video.load();

                }


                videoObserver.unobserve(
                    video
                );

            });

        },

        {

            rootMargin:
                "350px 0px"

        }

    );


videos.forEach((video) => {

    videoObserver.observe(
        video
    );

});


/* =========================================================
   OUVERTURE DU CADEAU
   ========================================================= */

async function openGift(gift){

    if(
        gift.classList.contains(
            "open"
        )
    ){
        return;
    }


    const wrapper =
        gift.closest(
            ".video-wrapper"
        );


    const video =
        wrapper.querySelector(
            "video"
        );


    /* charge la vidéo immédiatement */

    if(
        !video.src &&
        video.dataset.src
    ){

        video.src =
            video.dataset.src;

        video.load();

    }


    /* disparition paquet + ombre */

    gift.classList.add(
        "open"
    );


    /* suppression réelle après animation */

    setTimeout(
        () => {

            gift.style.display =
                "none";

        },
        450
    );


    /* lancement vidéo */

    try{

        await video.play();

    }
    catch(error){

        /*
           Safari peut parfois
           demander un second toucher.
        */

    }

}


/* =========================================================
   CLIC / TOUCH
   ========================================================= */

gifts.forEach((gift) => {

    gift.addEventListener(
        "click",
        () => {

            openGift(
                gift
            );

        }
    );


    gift.addEventListener(
        "keydown",
        (event) => {

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                openGift(
                    gift
                );

            }

        }
    );

});


/* =========================================================
   UNE SEULE VIDÉO À LA FOIS
   ========================================================= */

videos.forEach((video) => {

    video.addEventListener(
        "play",
        () => {

            videos.forEach(
                (otherVideo) => {

                    if(
                        otherVideo !== video &&
                        !otherVideo.paused
                    ){

                        otherVideo.pause();

                    }

                }
            );

        }
    );

});


/* =========================================================
   PAUSE HORS ÉCRAN
   ========================================================= */

const pauseObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach(
                (entry) => {

                    const video =
                        entry.target;


                    if(
                        !entry.isIntersecting &&
                        !video.paused
                    ){

                        video.pause();

                    }

                }
            );

        },

        {

            threshold:.12

        }

    );


videos.forEach((video) => {

    pauseObserver.observe(
        video
    );

});


/* =========================================================
   RETOUR EN HAUT
   ========================================================= */

window.addEventListener(
    "scroll",
    () => {

        if(
            window.scrollY > 700
        ){

            backToTop.classList.add(
                "visible"
            );

        }
        else{

            backToTop.classList.remove(
                "visible"
            );

        }

    },

    {

        passive:true

    }

);


backToTop.addEventListener(
    "click",
    () => {

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    }
);


</script>
