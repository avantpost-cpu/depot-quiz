<!-- =====================================================
     8 — TEST AVEC HABILLAGE GRAPHIQUE
     ===================================================== -->

<div class="video-card" id="graphicTestCard">

    <div class="video-wrapper vertical">

        <video
            class="main-video"
            controls
            playsinline
            preload="none"
            data-src="https://avantpost-cpu.github.io/depot-quiz/BDC/test.mp4"
        ></video>

        <div class="gift-cover">

            <div class="gift-package">

                <img
                    class="gift-image"
                    src="https://avantpost-cpu.github.io/depot-quiz/BDC/pack8.jpg"
                    alt=""
                >

            </div>

            <div class="gift-hint">
                Ouvre ton cadeau
            </div>

        </div>

    </div>

    <div class="action-zone">

        <button
            class="action-btn reply-btn hidden"
            id="graphicReplyButton"
            type="button"
        >
            Répondre en vidéo
        </button>

    </div>


    <div
        class="reply-panel"
        id="graphicReplyPanel"
    >

        <div class="reply-title">
            Ta réponse vidéo
        </div>

        <div class="reply-info">
            Le décor sera directement intégré dans ta vidéo.
        </div>


        <!-- CAMÉRA SOURCE CACHÉE -->

        <video
            id="graphicCameraSource"
            autoplay
            muted
            playsinline
            style="display:none;"
        ></video>


        <!-- CANVAS FINAL -->

        <div class="camera-frame">

            <canvas
                id="graphicCanvas"
                width="720"
                height="1280"
            ></canvas>

            <video
                id="graphicRecordedPreview"
                controls
                playsinline
                style="display:none;"
            ></video>

            <div
                class="record-time"
                id="graphicRecordTime"
            >
                00:00
            </div>

        </div>


        <div class="camera-actions">

            <button
                class="camera-btn primary"
                id="graphicStartRecord"
                type="button"
            >
                ● Enregistrer
            </button>

            <button
                class="camera-btn secondary"
                id="graphicStopRecord"
                type="button"
                disabled
            >
                Terminer
            </button>

            <button
                class="camera-btn secondary"
                id="graphicRestartRecord"
                type="button"
                style="display:none;"
            >
                Recommencer
            </button>

            <button
                class="camera-btn send"
                id="graphicShareRecord"
                type="button"
                style="display:none;"
            >
                Envoyer ma réponse
            </button>

        </div>

        <div
            class="status-message"
            id="graphicStatus"
        ></div>

    </div>

</div>
