<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9f80a6">

<title>Bon anniversaire Maman</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;
    min-height:100dvh;

    font-family:Arial, Helvetica, sans-serif;

    background:#9f80a6 url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif_leopard.png") repeat;
    background-size:300px;

    overflow-x:hidden;

}

.page{

    width:100%;
    max-width:900px;
    margin:auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));

}

.header{

    text-align:center;
    margin-bottom:25px;

}

.header img{

    width:100%;
    max-width:420px;
    display:block;
    margin:auto;

}

.video-list{

    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;

}

.video-card{

    background:#000;
    border-radius:18px;
    overflow:hidden;

    box-shadow:0 6px 18px rgba(0,0,0,.25);

}

.video-wrapper{

    width:100%;
    aspect-ratio:9/16;
    background:#000;

}

.video-wrapper video{

    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    background:#000;

}

/* Sur tablette et ordinateur */

@media (min-width:900px){

.video-list{

    grid-template-columns:repeat(3,1fr);
    gap:18px;

}

}

</style>

</head>

<body>

<main class="page">

<header class="header">

<img
src="https://avantpost-cpu.github.io/depot-quiz/BDC/titre.png"
alt="Bon anniversaire Maman">

</header>

<section class="video-list">

<!-- VIDEO 1 -->

<div class="video-card">

<div class="video-wrapper">

<video controls playsinline preload="metadata">

<source
src="https://avantpost-cpu.github.io/depot-quiz/BDC/mamie.mp4"
type="video/mp4">

</video>

</div>

</div>

<!-- VIDEO 2 -->

<div class="video-card">

<div class="video-wrapper">

<video controls playsinline preload="metadata">

<source
src="https://avantpost-cpu.github.io/depot-quiz/BDC/video2.mp4"
type="video/mp4">

</video>

</div>

</div>

<!-- VIDEO 3 -->

<div class="video-card">

<div class="video-wrapper">

<video controls playsinline preload="metadata">

<source
src="https://avantpost-cpu.github.io/depot-quiz/BDC/mamie.mp4"
type="video/mp4">

</video>

</div>

</div>

<!-- VIDEO 4 -->

<div class="video-card">

<div class="video-wrapper">

<video controls playsinline preload="metadata">

<source
src="https://avantpost-cpu.github.io/depot-quiz/BDC/video4.mp4"
type="video/mp4">

</video>

</div>

</div>

<!-- VIDEO 5 -->

<div class="video-card">

<div class="video-wrapper">

<video controls playsinline preload="metadata">

<source
src="https://avantpost-cpu.github.io/depot-quiz/BDC/video5.mp4"
type="video/mp4">

</video>

</div>

</div>

<!-- VIDEO 6 -->

<div class="video-card">

<div class="video-wrapper">

<video controls playsinline preload="metadata">

<source
src="https://avantpost-cpu.github.io/depot-quiz/BDC/video6.mp4"
type="video/mp4">

</video>

</div>

</div>

</section>

</main>

<script>

const videos=document.querySelectorAll("video");

videos.forEach(video=>{

    video.addEventListener("play",()=>{

        videos.forEach(other=>{

            if(other!==video && !other.paused){

                other.pause();

            }

        });

    });

});

</script>

</body>
</html>
