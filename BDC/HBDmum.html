<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#13283b">

<title>Test réponse vidéo</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:Arial, Helvetica, sans-serif;

    background:
        #13283b
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif.jpg")
        repeat;

    background-size:300px;

    overflow-x:hidden;
}

.page{
    width:100%;
    max-width:620px;

    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(60px + env(safe-area-inset-bottom));
}

.header{
    width:100%;
    text-align:center;
    margin-bottom:24px;
}

.header img{
    display:block;

    width:100%;
    max-width:420px;

    height:auto;

    margin:0 auto;
}


/* =========================================================
   VIDÉO / CADEAU
   ========================================================= */

.video-card{
    width:100%;
}

.video-wrapper{
    position:relative;

    width:82%;

    margin:0 auto;

    aspect-ratio:9 / 16;
}

.main-video{
    position:absolute;
    inset:0;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;

    border-radius:14px;
}


/* =========================================================
   CADEAU
   ========================================================= */

.gift-cover{
    position:absolute;
    inset:0;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    opacity:1;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.gift-package{
    width:100%;
    height:100%;

    filter:
        drop-shadow(
            0 14px 18px rgba(0,0,0,.42)
        );

    transition:
        filter .45s ease;
}

.gift-image{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:14px;
}

.gift-hint{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    padding:9px 16px;

    white-space:nowrap;

    border-radius:30px;

    background:
        rgba(0,0,0,.58);

    color:#fff;

    font-size:13px;
    font-weight:bold;

    pointer-events:none;
}

.gift-cover.opening{
    opacity:0;

    transform:scale(1.035);

    pointer-events:none;
}

.gift-cover.opening .gift-package{
    filter:
        drop-shadow(
            0 0 0 rgba(0,0,0,0)
        );
}


/* =========================================================
   ACTIONS
   ========================================================= */

.action-zone{
    width:100%;

    padding-top:14px;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:9px;

    flex-wrap:wrap;
}

.action-btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    padding:10px 18px;

    border:0;

    border-radius:24px;

    font-family:inherit;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;

    color:#fff;

    background:#9f80a6;

    box-shadow:
        0 4px 10px rgba(0,0,0,.20);
}

.reply-btn{
    background:#e26183;
}

.hidden{
    display:none !important;
}


/* =========================================================
   MODULE RÉPONSE
   ========================================================= */

.reply-panel{
    display:none;

    width:88%;

    margin:
        16px auto
        0;

    padding:14px;

    background:
        rgba(9,20,31,.94);

    border-radius:18px;

    box-shadow:
        0 8px 22px rgba(0,0,0,.30);
}

.reply-panel.visible{
    display:block;
}

.reply-title{
    margin-bottom:8px;

    color:#fff;

    font-size:16px;
    font-weight:bold;

    text-align:center;
}

.reply-info{
    margin-bottom:12px;

    color:
        rgba(255,255,255,.78);

    font-size:12px;

    line-height:1.45;

    text-align:center;
}


/* =========================================================
   CAMÉRA
   ========================================================= */

.camera-frame{
    position:relative;

    width:100%;

    aspect-ratio:9 / 16;

    overflow:hidden;

    background:#000;

    border-radius:14px;
}

.camera-frame video{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;

    background:#000;
}

#cameraPreview{
    transform:scaleX(-1);
}

#recordedPreview{
    transform:none;
}


/* =========================================================
   COMPTEUR
   ========================================================= */

.record-time{
    position:absolute;

    top:10px;
    left:50%;

    z-index:5;

    transform:translateX(-50%);

    display:none;

    padding:6px 11px;

    border-radius:20px;

    background:
        rgba(0,0,0,.70);

    color:#fff;

    font-size:13px;
    font-weight:bold;
}

.record-time.visible{
    display:block;
}


/* =========================================================
   BOUTONS CAMÉRA
   ========================================================= */

.camera-actions{
    display:flex;

    justify-content:center;
    align-items:center;

    flex-wrap:wrap;

    gap:8px;

    margin-top:12px;
}

.camera-btn{
    min-height:42px;

    padding:9px 15px;

    border:0;

    border-radius:22px;

    font-family:inherit;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;
}

.camera-btn.primary{
    background:#e26183;
    color:#fff;
}

.camera-btn.secondary{
    background:#fff;
    color:#253344;
}

.camera-btn.send{
    background:#6fa773;
    color:#fff;
}

.camera-btn:disabled{
    opacity:.45;
    cursor:default;
}


/* =========================================================
   MESSAGE
   ========================================================= */

.status-message{
    display:none;

    margin-top:12px;

    padding:11px;

    border-radius:12px;

    background:
        rgba(255,255,255,.10);

    color:#fff;

    font-size:13px;

    line-height:1.4;

    text-align:center;
}

.status-message.visible{
    display:block;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:380px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .video-wrapper{
        width:80%;
    }

    .reply-panel{
        width:90%;
    }

}

</style>

</head>


<body>


<main class="page">


<header class="header">

    <img
        src="https://avantpost-cpu.github.io/depot-quiz/BDC/titre.png"
        alt="Bon anniversaire Maman"
    >

</header>


<div
    class="video-card"
    id="testCard"
>

    <div class="video-wrapper">

        <video
            class="main-video"
            controls
            playsinline
            preload="none"
            data-src="https://avantpost-cpu.github.io/depot-quiz/BDC/test.mp4"
        ></video>


        <div
            class="gift-cover"
            id="giftCover"
        >

            <div class="gift-package">

                <img
                    class="gift-image"
                    src="https://avantpost-cpu.github.io/depot-quiz/BDC/pack8.jpg"
                    alt=""
                >

            </div>

            <div class="gift-hint">
                Ouvre ton cadeau
            </div>

        </div>

    </div>


    <div class="action-zone">

        <button
            class="action-btn reply-btn hidden"
            id="replyButton"
            type="button"
        >
            Répondre en vidéo
        </button>

    </div>


    <div
        class="reply-panel"
        id="replyPanel"
    >

        <div class="reply-title">
            Ta réponse vidéo
        </div>


        <div class="reply-info">
            Enregistre ton message, vérifie-le puis envoie-le directement par Messages.
        </div>


        <div class="camera-frame">

            <video
                id="cameraPreview"
                autoplay
                muted
                playsinline
            ></video>


            <video
                id="recordedPreview"
                controls
                playsinline
                style="display:none;"
            ></video>


            <div
                class="record-time"
                id="recordTime"
            >
                00:00
            </div>

        </div>


        <div class="camera-actions">

            <button
                class="camera-btn primary"
                id="startRecord"
                type="button"
            >
                ● Enregistrer
            </button>


            <button
                class="camera-btn secondary"
                id="stopRecord"
                type="button"
                disabled
            >
                Terminer
            </button>


            <button
                class="camera-btn secondary"
                id="restartRecord"
                type="button"
                style="display:none;"
            >
                Recommencer
            </button>


            <button
                class="camera-btn send"
                id="shareRecord"
                type="button"
                style="display:none;"
            >
                Envoyer ma réponse
            </button>

        </div>


        <div
            class="status-message"
            id="statusMessage"
        ></div>

    </div>

</div>


</main>


<script>

/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const giftCover =
    document.getElementById(
        "giftCover"
    );

const mainVideo =
    document.querySelector(
        ".main-video"
    );

const replyButton =
    document.getElementById(
        "replyButton"
    );

const replyPanel =
    document.getElementById(
        "replyPanel"
    );

const cameraPreview =
    document.getElementById(
        "cameraPreview"
    );

const recordedPreview =
    document.getElementById(
        "recordedPreview"
    );

const startRecord =
    document.getElementById(
        "startRecord"
    );

const stopRecord =
    document.getElementById(
        "stopRecord"
    );

const restartRecord =
    document.getElementById(
        "restartRecord"
    );

const shareRecord =
    document.getElementById(
        "shareRecord"
    );

const recordTime =
    document.getElementById(
        "recordTime"
    );

const statusMessage =
    document.getElementById(
        "statusMessage"
    );


let cameraStream = null;

let mediaRecorder = null;

let recordedChunks = [];

let recordedBlob = null;

let recordedFile = null;

let recordedObjectURL = null;

let recordTimer = null;

let secondsRecorded = 0;


/* =========================================================
   CHARGEMENT VIDÉO TEST
   ========================================================= */

if(
    !mainVideo.src &&
    mainVideo.dataset.src
){

    mainVideo.src =
        mainVideo.dataset.src;

    mainVideo.load();

}


/* =========================================================
   OUVERTURE CADEAU
   ========================================================= */

giftCover.addEventListener(
    "click",
    async () => {

        giftCover.classList.add(
            "opening"
        );


        replyButton.classList.remove(
            "hidden"
        );


        try{

            await mainVideo.play();

        }
        catch(error){}


        setTimeout(
            () => {

                giftCover.style.display =
                    "none";

            },
            450
        );

    }
);


/* =========================================================
   OUVRIR CAMÉRA
   ========================================================= */

replyButton.addEventListener(
    "click",
    async () => {

        mainVideo.pause();


        replyPanel.classList.add(
            "visible"
        );


        statusMessage.classList.remove(
            "visible"
        );


        try{

            cameraStream =
                await navigator.mediaDevices
                    .getUserMedia({

                        video:{
                            facingMode:"user",

                            width:{
                                ideal:720
                            },

                            height:{
                                ideal:1280
                            }
                        },

                        audio:true

                    });


            cameraPreview.srcObject =
                cameraStream;


            cameraPreview.style.display =
                "block";


            recordedPreview.style.display =
                "none";


            replyPanel.scrollIntoView({

                behavior:"smooth",

                block:"center"

            });

        }
        catch(error){

            statusMessage.textContent =
                "Impossible d'accéder à la caméra ou au micro.";

            statusMessage.classList.add(
                "visible"
            );

        }

    }
);


/* =========================================================
   FORMAT D'ENREGISTREMENT
   ========================================================= */

function getSupportedMimeType(){

    const types = [

        "video/mp4",

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    for(const type of types){

        if(
            MediaRecorder
                .isTypeSupported(type)
        ){

            return type;

        }

    }


    return "";

}


/* =========================================================
   DÉMARRER
   ========================================================= */

startRecord.addEventListener(
    "click",
    () => {

        if(!cameraStream){
            return;
        }


        recordedChunks = [];

        recordedBlob = null;

        recordedFile = null;


        statusMessage.classList.remove(
            "visible"
        );


        const mimeType =
            getSupportedMimeType();


        try{

            if(mimeType){

                mediaRecorder =
                    new MediaRecorder(
                        cameraStream,
                        {
                            mimeType:mimeType,

                            videoBitsPerSecond:
                                1800000
                        }
                    );

            }
            else{

                mediaRecorder =
                    new MediaRecorder(
                        cameraStream
                    );

            }

        }
        catch(error){

            statusMessage.textContent =
                "L'enregistrement vidéo n'est pas disponible sur ce navigateur.";

            statusMessage.classList.add(
                "visible"
            );

            return;

        }


        mediaRecorder.addEventListener(
            "dataavailable",
            event => {

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    recordedChunks.push(
                        event.data
                    );

                }

            }
        );


        mediaRecorder.addEventListener(
            "stop",
            () => {

                const type =
                    mediaRecorder.mimeType
                    ||
                    "video/mp4";


                recordedBlob =
                    new Blob(
                        recordedChunks,
                        {
                            type:type
                        }
                    );


                const extension =
                    type.includes("webm")
                    ?
                    "webm"
                    :
                    "mp4";


                recordedFile =
                    new File(
                        [recordedBlob],
                        `ma-reponse.${extension}`,
                        {
                            type:type
                        }
                    );


                if(recordedObjectURL){

                    URL.revokeObjectURL(
                        recordedObjectURL
                    );

                }


                recordedObjectURL =
                    URL.createObjectURL(
                        recordedBlob
                    );


                cameraPreview.style.display =
                    "none";


                recordedPreview.style.display =
                    "block";


                recordedPreview.src =
                    recordedObjectURL;


                startRecord.style.display =
                    "none";


                stopRecord.style.display =
                    "none";


                restartRecord.style.display =
                    "inline-block";


                shareRecord.style.display =
                    "inline-block";


                recordTime.classList.remove(
                    "visible"
                );

            }
        );


        mediaRecorder.start();


        secondsRecorded = 0;


        recordTime.textContent =
            "00:00";


        recordTime.classList.add(
            "visible"
        );


        startRecord.disabled =
            true;


        stopRecord.disabled =
            false;


        recordTimer =
            setInterval(
                () => {

                    secondsRecorded++;


                    const minutes =
                        Math.floor(
                            secondsRecorded / 60
                        );


                    const seconds =
                        secondsRecorded % 60;


                    recordTime.textContent =
                        String(minutes)
                            .padStart(2,"0")
                        +
                        ":"
                        +
                        String(seconds)
                            .padStart(2,"0");


                    if(
                        secondsRecorded >= 60
                    ){

                        stopRecording();

                    }

                },
                1000
            );

    }
);


/* =========================================================
   ARRÊTER
   ========================================================= */

function stopRecording(){

    if(
        !mediaRecorder
        ||
        mediaRecorder.state ===
            "inactive"
    ){
        return;
    }


    mediaRecorder.stop();


    clearInterval(
        recordTimer
    );


    startRecord.disabled =
        false;


    stopRecord.disabled =
        true;

}


stopRecord.addEventListener(
    "click",
    stopRecording
);


/* =========================================================
   RECOMMENCER
   ========================================================= */

restartRecord.addEventListener(
    "click",
    () => {

        recordedBlob = null;

        recordedFile = null;

        recordedChunks = [];


        recordedPreview.pause();


        recordedPreview.removeAttribute(
            "src"
        );


        recordedPreview.load();


        recordedPreview.style.display =
            "none";


        cameraPreview.style.display =
            "block";


        restartRecord.style.display =
            "none";


        shareRecord.style.display =
            "none";


        startRecord.style.display =
            "inline-block";


        startRecord.disabled =
            false;


        stopRecord.style.display =
            "inline-block";


        stopRecord.disabled =
            true;


        statusMessage.classList.remove(
            "visible"
        );

    }
);


/* =========================================================
   PARTAGE NATIF IPHONE
   ========================================================= */

shareRecord.addEventListener(
    "click",
    async () => {

        if(!recordedFile){
            return;
        }


        /*
           Vérifie que le navigateur
           accepte le partage de fichiers.
        */

        if(
            !navigator.share
        ){

            statusMessage.textContent =
                "Le partage direct n'est pas disponible sur ce navigateur.";

            statusMessage.classList.add(
                "visible"
            );

            return;

        }


        if(
            navigator.canShare
            &&
            !navigator.canShare({
                files:[recordedFile]
            })
        ){

            statusMessage.textContent =
                "Ce navigateur ne permet pas de partager directement cette vidéo.";

            statusMessage.classList.add(
                "visible"
            );

            return;

        }


        try{

            await navigator.share({

                files:[
                    recordedFile
                ],

                title:
                    "Ma réponse vidéo",

                text:
                    "Merci pour ton message ❤️"

            });


            statusMessage.textContent =
                "La réponse a été partagée.";

            statusMessage.classList.add(
                "visible"
            );


            /*
               On peut couper la caméra
               après partage.
            */

            if(cameraStream){

                cameraStream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                cameraStream =
                    null;

            }

        }
        catch(error){

            /*
               Si la personne ferme simplement
               le menu de partage,
               on ne considère pas cela
               comme une erreur grave.
            */

            if(
                error.name !==
                "AbortError"
            ){

                statusMessage.textContent =
                    "Impossible de partager la vidéo.";

                statusMessage.classList.add(
                    "visible"
                );

            }

        }

    }
);


/* =========================================================
   NETTOYAGE
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(cameraStream){

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if(recordedObjectURL){

            URL.revokeObjectURL(
                recordedObjectURL
            );

        }

    }
);

</script>

</body>
</html>
