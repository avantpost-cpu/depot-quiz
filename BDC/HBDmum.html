<!DOCTYPE html>

<head>

<meta charset="UTF-8">

<title>Bon anniversaire Maman</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:Arial, Helvetica, sans-serif;

    background:
        #13283b
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif.jpg")
        repeat;

    background-size:300px;

    overflow-x:hidden;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:100%;
    max-width:620px;

    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(60px + env(safe-area-inset-bottom));
}


/* =========================================================
   TITRE
   ========================================================= */

.header{
    width:100%;
    text-align:center;
    margin-bottom:24px;
}

.header img{
    display:block;

    width:100%;
    max-width:420px;

    height:auto;

    margin:0 auto;
}


/* =========================================================
   LISTE
   ========================================================= */

.video-list{
    display:flex;
    flex-direction:column;
    gap:34px;
}


/* =========================================================
   CARTE
   ========================================================= */

.video-card{
    width:100%;
}


/* =========================================================
   ZONE VIDÉO
   ========================================================= */

.video-wrapper{
    position:relative;
    width:100%;
}


/* vertical */

.video-wrapper.vertical{
    aspect-ratio:9 / 16;
}


/* horizontal */

.video-wrapper.horizontal{
    aspect-ratio:16 / 9;
}


/* =========================================================
   VIDÉO
   ========================================================= */

.video-wrapper video{
    position:absolute;
    inset:0;

    display:block;

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;

    border-radius:18px;
}


/* =========================================================
   CACHE CADEAU
   ========================================================= */

.gift-cover{
    position:absolute;
    inset:0;

    z-index:10;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    pointer-events:auto;
}


/* =========================================================
   CONTENEUR DU CADEAU
   ========================================================= */

.gift-package{
    position:relative;

    width:82%;
    height:82%;

    filter:
        drop-shadow(
            0 14px 18px rgba(0,0,0,.42)
        );

    transition:
        filter .25s ease;
}


/* horizontal */

.video-wrapper.horizontal .gift-package{
    width:88%;
    height:88%;
}


/* =========================================================
   IMAGE ORIGINALE
   ========================================================= */

.gift-image{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    border-radius:14px;

    transition:
        opacity .1s ease;
}


/* =========================================================
   MORCEAUX DE PAPIER
   ========================================================= */

.tear-piece{
    position:absolute;
    inset:0;

    background-size:100% 100%;
    background-position:center;
    background-repeat:no-repeat;

    border-radius:14px;

    pointer-events:none;

    opacity:0;

    will-change:
        transform,
        opacity;
}


/* =========================================================
   DÉCHIRURE GAUCHE
   ========================================================= */

.tear-left{

    clip-path:polygon(
        0 0,
        51% 0,
        48% 6%,
        53% 12%,
        47% 19%,
        52% 26%,
        48% 33%,
        54% 41%,
        47% 49%,
        53% 57%,
        48% 65%,
        54% 73%,
        47% 81%,
        52% 89%,
        48% 95%,
        51% 100%,
        0 100%
    );

}


/* =========================================================
   DÉCHIRURE DROITE
   ========================================================= */

.tear-right{

    clip-path:polygon(
        51% 0,
        100% 0,
        100% 100%,
        51% 100%,
        48% 95%,
        52% 89%,
        47% 81%,
        54% 73%,
        48% 65%,
        53% 57%,
        47% 49%,
        54% 41%,
        48% 33%,
        52% 26%,
        47% 19%,
        53% 12%,
        48% 6%
    );

}


/* =========================================================
   OUVERTURE
   ========================================================= */

.gift-cover.tearing{
    pointer-events:none;
}


.gift-cover.tearing .gift-image{
    opacity:0;
}


.gift-cover.tearing .tear-piece{
    opacity:1;
}


/* =========================================================
   ANIMATION GAUCHE
   ========================================================= */

.gift-cover.tearing .tear-left{

    animation:
        tearLeft .82s
        cubic-bezier(.18,.72,.20,1)
        forwards;

}


/* =========================================================
   ANIMATION DROITE
   ========================================================= */

.gift-cover.tearing .tear-right{

    animation:
        tearRight .82s
        cubic-bezier(.18,.72,.20,1)
        forwards;

}


/* =========================================================
   ANIMATION DU PAQUET
   ========================================================= */

@keyframes tearLeft{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);

        opacity:1;
    }

    22%{
        transform:
            translate(-4px,0)
            rotate(-.5deg);

        opacity:1;
    }

    48%{
        transform:
            translate(-18px,5px)
            rotate(-2deg);

        opacity:1;
    }

    100%{
        transform:
            translate(-92px,38px)
            rotate(-11deg);

        opacity:0;
    }

}


@keyframes tearRight{

    0%{
        transform:
            translate(0,0)
            rotate(0deg);

        opacity:1;
    }

    22%{
        transform:
            translate(4px,0)
            rotate(.5deg);

        opacity:1;
    }

    48%{
        transform:
            translate(18px,5px)
            rotate(2deg);

        opacity:1;
    }

    100%{
        transform:
            translate(92px,38px)
            rotate(11deg);

        opacity:0;
    }

}


/* =========================================================
   OMBRE DISPARAÎT
   ========================================================= */

.gift-cover.tearing .gift-package{

    filter:
        drop-shadow(
            0 0 0 rgba(0,0,0,0)
        );

}


/* =========================================================
   TEXTE
   ========================================================= */

.gift-hint{

    position:absolute;

    left:50%;
    bottom:9%;

    z-index:30;

    transform:translateX(-50%);

    padding:9px 16px;

    white-space:nowrap;

    border-radius:30px;

    background:
        rgba(0,0,0,.58);

    color:#fff;

    font-size:13px;
    font-weight:bold;

    box-shadow:
        0 3px 10px rgba(0,0,0,.2);

    pointer-events:none;

    transition:
        opacity .18s ease,
        transform .18s ease;
}


.gift-cover.tearing .gift-hint{

    opacity:0;

    transform:
        translateX(-50%)
        scale(.88);

}


/* =========================================================
   TÉLÉCHARGEMENT
   ========================================================= */

.download-zone{
    width:100%;
    padding-top:14px;
    text-align:center;
}


.download-btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:7px;

    padding:9px 17px;

    font-size:13px;
    font-weight:bold;

    color:#fff;

    background:#9f80a6;

    text-decoration:none;

    border-radius:22px;

    box-shadow:
        0 4px 10px rgba(0,0,0,.20);

    transition:
        transform .15s ease,
        opacity .15s ease;
}


.download-btn:active{

    transform:scale(.96);

    opacity:.85;

}


/* =========================================================
   RETOUR EN HAUT
   ========================================================= */

.back-to-top{

    position:fixed;

    right:16px;

    bottom:
        calc(
            18px +
            env(safe-area-inset-bottom)
        );

    z-index:100;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border:0;

    border-radius:50%;

    background:
        rgba(80,52,84,.9);

    color:#fff;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.3);

    opacity:0;

    visibility:hidden;

    transform:
        translateY(10px);

    transition:
        opacity .25s ease,
        transform .25s ease,
        visibility .25s;

}


.back-to-top.visible{

    opacity:1;

    visibility:visible;

    transform:
        translateY(0);

}


/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media(max-width:380px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .video-list{
        gap:28px;
    }

    .gift-package{
        width:80%;
        height:80%;
    }

    .video-wrapper.horizontal .gift-package{

        height:86%;
    }

    .video-wrapper video,

    .tear-piece{

    }

        font-size:12px;
        padding:8px 14px;
    }

    .gift-hint{
        font-size:12px;
        padding:8px 13px;
    }

}


/* =========================================================
   ACCESSIBILITÉ
   ========================================================= */

@media(prefers-reduced-motion:reduce){

    html{
        scroll-behavior:auto;
    }

    .gift-cover.tearing .tear-left,
    .gift-cover.tearing .tear-right{
        animation-duration:.01s;
    }

}

</style>

<script>


/* =========================================================
   ÉLÉMENTS
   ========================================================= */

const videos =
    document.querySelectorAll("video");

const gifts =
    document.querySelectorAll(".gift-cover");

const backToTop =
    document.getElementById("backToTop");


/* =========================================================
   PRÉPARATION DES MORCEAUX
   ========================================================= */

gifts.forEach((gift) => {

    const giftPackage =
        gift.querySelector(".gift-package");

    const image =
        giftPackage.dataset.image;

    const pieces =
        gift.querySelectorAll(".tear-piece");

    pieces.forEach((piece) => {

        piece.style.backgroundImage =
            `url("${image}")`;

    });

});


/* =========================================================
   CHARGEMENT INTELLIGENT
   ========================================================= */

const videoObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach((entry) => {

                if(!entry.isIntersecting){
                    return;
                }

                const video =
                    entry.target;

                if(
                    !video.src &&
                    video.dataset.src
                ){

                    video.src =
                        video.dataset.src;

                    video.load();

                }

                videoObserver.unobserve(
                    video
                );

            });

        },

        {
            rootMargin:"350px 0px"
        }

    );


videos.forEach((video) => {

    videoObserver.observe(
        video
    );

});


/* =========================================================
   OUVERTURE
   ========================================================= */

async function openGift(gift){

    if(
        gift.classList.contains(
            "tearing"
        )
    ){
        return;
    }


    const wrapper =
        gift.closest(".video-wrapper");

    const video =
        wrapper.querySelector("video");


    /* charge la vidéo */

    if(
        !video.src &&
        video.dataset.src
    ){

        video.src =
            video.dataset.src;

        video.load();

    }


    /* démarre l'effet */

    gift.classList.add(
        "tearing"
    );


    /* lancement vidéo */

    try{

        await video.play();

    }
    catch(error){

    }


    /* suppression du paquet */

    setTimeout(
        () => {

            gift.style.display =
                "none";

        },
        820
    );

}


/* =========================================================
   CLIC
   ========================================================= */

gifts.forEach((gift) => {

    gift.addEventListener(
        "click",
        () => {

            openGift(gift);

        }
    );


    gift.addEventListener(
        "keydown",
        (event) => {

            if(
                event.key === "Enter" ||
                event.key === " "
            ){

                event.preventDefault();

                openGift(gift);

            }

        }
    );

});


/* =========================================================
   UNE SEULE VIDÉO
   ========================================================= */

videos.forEach((video) => {

    video.addEventListener(
        "play",
        () => {

            videos.forEach(
                (otherVideo) => {

                    if(
                        otherVideo !== video &&
                        !otherVideo.paused
                    ){

                        otherVideo.pause();

                    }

                }
            );

        }
    );

});


/* =========================================================
   PAUSE HORS ÉCRAN
   ========================================================= */

const pauseObserver =
    new IntersectionObserver(

        (entries) => {

            entries.forEach(
                (entry) => {

                    const video =
                        entry.target;

                    if(
                        !entry.isIntersecting &&
                        !video.paused
                    ){

                        video.pause();

                    }

                }
            );

        },

        {
            threshold:.12
        }

    );


videos.forEach((video) => {

    pauseObserver.observe(video);

});


/* =========================================================
   RETOUR EN HAUT
   ========================================================= */

window.addEventListener(
    "scroll",
    () => {

        if(
            window.scrollY > 700
        ){

            backToTop.classList.add(
                "visible"
            );

        }
        else{

            backToTop.classList.remove(
                "visible"
            );

        }

    },

    {
        passive:true
    }

);


backToTop.addEventListener(
    "click",
    () => {

        window.scrollTo({

            top:0,

            behavior:"smooth"

        });

    }
);


</script>
