<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Bon anniversaire Maman</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background-color:#9f80a6;
    background-image:url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif_leopard.png");
    background-repeat:repeat;
    background-size:300px;
    color:black;
    font-family:Arial, Helvetica, sans-serif;
}

.page{
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:
        calc(24px + env(safe-area-inset-top))
        18px
        calc(40px + env(safe-area-inset-bottom));
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header img{
    display:block;
    width:100%;
    max-width:420px;
    margin:0 auto 25px;
}

.header p{
    max-width:420px;
    margin:0 auto;
    font-size:16px;
    line-height:1.6;
    opacity:.95;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:32px;
}

.video-card{
    overflow:hidden;
    background:#ffffff;
    color:#044e61;
    border-radius:22px;
    box-shadow:0 12px 30px rgba(0,0,0,.22);
}

.video-wrapper{
    position:relative;
    width:100%;
    aspect-ratio:9/16;
    background:#000;
}

.video-wrapper video{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
}

.video-content{
    padding:18px 20px 22px;
}

.video-content h2{
    margin-bottom:8px;
    font-size:21px;
    line-height:1.2;
}

.video-content p{
    font-size:15px;
    line-height:1.5;
    color:#3d5960;
}

.footer{
    margin-top:38px;
    text-align:center;
    font-size:13px;
    line-height:1.5;
    opacity:.8;
}

@media (min-width:700px){

.page{
    max-width:1100px;
    padding-left:30px;
    padding-right:30px;
}

.video-list{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:32px;
    align-items:start;
}

}

</style>
</head>

<body>

<main class="page">

<header class="header">

    <img src="https://avantpost-cpu.github.io/depot-quiz/BDC/titre.png" alt="Bon anniversaire Maman">

</header>

<section class="video-list">

    <!-- VIDEO 1 -->
    <article class="video-card">

        <div class="video-wrapper">

            <video
                controls
                playsinline
                preload="metadata"
                poster="videos/video1.jpg">

                <source
                    src="videos/video1.mp4"
                    type="video/mp4">

                Votre navigateur ne permet pas de lire cette vidéo.

            </video>

        </div>

        <div class="video-content">

            <h2>Première vidéo</h2>

            <p>
                Une courte description de la première vidéo.
            </p>

        </div>

    </article>


    <!-- VIDEO 2 -->
    <article class="video-card">

        <div class="video-wrapper">

            <video
                controls
                playsinline
                preload="metadata"
                poster="videos/video2.jpg">

                <source
                    src="videos/video2.mp4"
                    type="video/mp4">

                Votre navigateur ne permet pas de lire cette vidéo.

            </video>

        </div>

        <div class="video-content">

            <h2>Deuxième vidéo</h2>

            <p>
                Une courte description de la deuxième vidéo.
            </p>

        </div>

    </article>


    <!-- VIDEO 3 -->
    <article class="video-card">

        <div class="video-wrapper">

            <video
                controls
                playsinline
                preload="metadata"
                poster="videos/video3.jpg">

                <source
                    src="videos/video3.mp4"
                    type="video/mp4">

                Votre navigateur ne permet pas de lire cette vidéo.

            </video>

        </div>

        <div class="video-content">

            <h2>Troisième vidéo</h2>

            <p>
                Une courte description de la troisième vidéo.
            </p>

        </div>

    </article>

</section>

<footer class="footer">
    Les vidéos restent hébergées directement sur cette page GitHub.
</footer>

</main>

<script>

const videos=document.querySelectorAll("video");

videos.forEach(video=>{

    video.addEventListener("play",()=>{

        videos.forEach(otherVideo=>{

            if(otherVideo!==video && !otherVideo.paused){

                otherVideo.pause();

            }

        });

    });

});

</script>

</body>
</html>
