<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9f80a6">

<title>Bon anniversaire Maman</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:Arial, Helvetica, sans-serif;

    background:
        #9f80a6
        url("https://avantpost-cpu.github.io/depot-quiz/BDC/motif_leopard.png")
        repeat;

    background-size:300px;

    overflow-x:hidden;
}

.page{
    width:100%;
    max-width:620px;
    margin:0 auto;

    padding:
        calc(20px + env(safe-area-inset-top))
        14px
        calc(30px + env(safe-area-inset-bottom));
}

.header{
    width:100%;
    text-align:center;
    margin-bottom:24px;
}

.header img{
    display:block;
    width:100%;
    max-width:420px;
    height:auto;
    margin:0 auto;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:22px;
}

.video-card{
    width:100%;
    overflow:hidden;

    background:#000000;
    border-radius:18px;

    box-shadow:0 6px 18px rgba(0,0,0,.25);
}

.video-wrapper{
    width:100%;
    background:#000000;
}

/* Vidéos verticales */

.video-wrapper.vertical{
    aspect-ratio:9 / 16;
}

/* Vidéos horizontales */

.video-wrapper.horizontal{
    aspect-ratio:16 / 9;
}

.video-wrapper video{
    display:block;

    width:100%;
    height:100%;

    object-fit:contain;
    background:#000000;
}

@media (max-width:380px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .video-list{
        gap:16px;
    }

    .video-card{
        border-radius:14px;
    }

}

</style>

</head>

<body>

<main class="page">

<header class="header">

    <img
        src="https://avantpost-cpu.github.io/depot-quiz/BDC/titre.png"

</section>

</main>

<script>

const videos = document.querySelectorAll("video");

videos.forEach((video) => {

    video.addEventListener("play", () => {

        videos.forEach((otherVideo) => {

            if(otherVideo !== video && !otherVideo.paused){

                otherVideo.pause();

            }

        });

    });

});

</script>
