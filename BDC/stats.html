<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#9f80a6">

<title>Statistiques anniversaire</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #9f80a6
        url("motif.jpg")
        repeat;

    background-size:300px;

    color:#ffffff;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:100%;
    max-width:720px;

    margin:0 auto;

    padding:
        calc(35px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
}


/* =========================================================
   ENTETE
   ========================================================= */

.header{
    text-align:center;

    margin-bottom:28px;
}

.header h1{
    font-size:30px;

    margin-bottom:7px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.25);
}

.header p{
    font-size:14px;

    opacity:.82;
}


/* =========================================================
   RESUME
   ========================================================= */

.summary{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-bottom:18px;
}

.summary-card{
    padding:20px 8px;

    text-align:center;

    background:
        rgba(20,20,30,.82);

    border-radius:17px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.18);
}

.summary-number{
    display:block;

    margin-bottom:5px;

    font-size:31px;
    font-weight:bold;
}

.summary-label{
    display:block;

    font-size:11px;

    opacity:.75;
}


/* =========================================================
   ACTUALISER
   ========================================================= */

.stats-actions{
    display:flex;

    justify-content:center;

    margin-bottom:18px;
}

.refresh-btn{
    border:0;

    padding:10px 18px;

    border-radius:22px;

    cursor:pointer;

    font-size:13px;
    font-weight:bold;

    background:
        rgba(255,255,255,.94);

    color:#4b3a50;

    box-shadow:
        0 4px 10px rgba(0,0,0,.16);

    transition:
        transform .15s ease;
}

.refresh-btn:active{
    transform:scale(.96);
}


/* =========================================================
   HISTORIQUE
   ========================================================= */

.history{
    overflow:hidden;

    background:
        rgba(20,20,30,.86);

    border-radius:18px;

    box-shadow:
        0 10px 28px rgba(0,0,0,.22);
}

.history-title{
    padding:18px;

    font-size:17px;
    font-weight:bold;

    border-bottom:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   ENTETE TABLEAU
   ========================================================= */

.visit-header{
    display:grid;

    grid-template-columns:
        1.4fr
        .8fr
        .7fr;

    gap:8px;

    padding:
        10px
        16px;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:.5px;

    opacity:.55;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.visit-header div:last-child{
    text-align:right;
}


/* =========================================================
   VISITE
   ========================================================= */

.visit{
    display:grid;

    grid-template-columns:
        1.4fr
        .8fr
        .7fr;

    align-items:center;

    gap:8px;

    padding:
        14px
        16px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.visit:last-child{
    border-bottom:0;
}

.visit-date{
    font-size:13px;
    font-weight:bold;
}

.visit-time{
    font-size:13px;

    opacity:.72;
}

.visit-gifts{
    text-align:right;

    font-size:15px;
    font-weight:bold;
}


/* =========================================================
   LES 7 CADEAUX ONT ETE OUVERTS
   ========================================================= */

.visit-gifts.complete{
    color:#f4bdd0;
}


/* =========================================================
   AUCUN CADEAU
   ========================================================= */

.visit-gifts.zero{
    opacity:.45;
}


/* =========================================================
   CHARGEMENT
   ========================================================= */

.loading{
    padding:35px;

    text-align:center;

    font-size:14px;

    opacity:.75;
}


/* =========================================================
   ERREUR
   ========================================================= */

.error{
    display:none;

    padding:25px;

    text-align:center;

    background:
        rgba(20,20,30,.86);

    border-radius:18px;

    line-height:1.5;
}

.error.visible{
    display:block;
}


/* =========================================================
   AUCUNE VISITE
   ========================================================= */

.empty{
    padding:35px;

    text-align:center;

    font-size:13px;

    opacity:.65;
}


/* =========================================================
   DERNIERE ACTUALISATION
   ========================================================= */

.last-update{
    margin-top:14px;

    text-align:center;

    font-size:10px;

    opacity:.55;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:520px){

    .page{
        padding-left:11px;
        padding-right:11px;
    }

    .header h1{
        font-size:25px;
    }

    .summary{
        gap:7px;
    }

    .summary-card{
        padding:
            16px
            4px;
    }

    .summary-number{
        font-size:25px;
    }

    .summary-label{
        font-size:9px;
    }

    .visit,
    .visit-header{

        grid-template-columns:
            1.25fr
            .65fr
            .65fr;

        padding-left:12px;
        padding-right:12px;

    }

    .visit-date,
    .visit-time{
        font-size:12px;
    }

    .visit-gifts{
        font-size:13px;
    }

}


/* =========================================================
   PETITS ECRANS
   ========================================================= */

@media(max-width:360px){

    .summary-number{
        font-size:22px;
    }

    .summary-label{
        font-size:8px;
    }

}

</style>

</head>


<body>


<main class="page">


    <!-- ===================================================
         ENTETE
         =================================================== -->

    <header class="header">

        <h1>
            Statistiques anniversaire
        </h1>

        <p>
            Utilisation du site
        </p>

    </header>



    <!-- ===================================================
         RESUME
         =================================================== -->

    <section class="summary">


        <div class="summary-card">

            <span
                class="summary-number"
                id="totalVisits"
            >
                —
            </span>

            <span class="summary-label">
                VISITES
            </span>

        </div>


        <div class="summary-card">

            <span
                class="summary-number"
                id="totalGifts"
            >
                —
            </span>

            <span class="summary-label">
                CADEAUX OUVERTS
            </span>

        </div>


        <div class="summary-card">

            <span
                class="summary-number"
                id="averageGifts"
            >
                —
            </span>

            <span class="summary-label">
                MOYENNE / 7
            </span>

        </div>


    </section>



    <!-- ===================================================
         ACTUALISER
         =================================================== -->

    <div class="stats-actions">

        <button
            class="refresh-btn"
            id="refreshBtn"
            type="button"
        >
            ↻ Actualiser
        </button>

    </div>



    <!-- ===================================================
         ERREUR
         =================================================== -->

    <div
        class="error"
        id="errorBox"
    >

        Impossible de récupérer les statistiques.

    </div>



    <!-- ===================================================
         HISTORIQUE
         =================================================== -->

    <section
        class="history"
        id="history"
    >

        <div class="history-title">

            Historique des visites

        </div>


        <div class="visit-header">

            <div>
                Date
            </div>

            <div>
                Heure
            </div>

            <div>
                Cadeaux
            </div>

        </div>


        <div id="visitsList">

            <div class="loading">
                Chargement…
            </div>

        </div>

    </section>



    <div
        class="last-update"
        id="lastUpdate"
    ></div>


</main>



<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const STATS_URL =
    "https://tdsrqmpfdvntybdlvejy.supabase.co/functions/v1/birthday-stats";


/*
   Le token est volontairement intégré
   directement dans cette page.

   Il correspond au STATS_TOKEN créé
   dans Supabase.
*/

const STATS_TOKEN =
    "MamanStats-2026-Cadeaux-7-PrivE-84xQ";



/* =========================================================
   ELEMENTS
   ========================================================= */

const totalVisitsElement =
    document.getElementById(
        "totalVisits"
    );


const totalGiftsElement =
    document.getElementById(
        "totalGifts"
    );


const averageGiftsElement =
    document.getElementById(
        "averageGifts"
    );


const visitsList =
    document.getElementById(
        "visitsList"
    );


const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const history =
    document.getElementById(
        "history"
    );


const lastUpdate =
    document.getElementById(
        "lastUpdate"
    );



/* =========================================================
   CHARGEMENT DES STATISTIQUES
   ========================================================= */

async function loadStats(){

    /*
       Etat chargement
    */

    refreshBtn.disabled =
        true;


    refreshBtn.textContent =
        "Actualisation…";


    errorBox.classList.remove(
        "visible"
    );


    try{

        const response =
            await fetch(

                STATS_URL,

                {

                    method:"GET",

                    headers:{

                        "x-stats-token":
                            STATS_TOKEN

                    },

                    cache:"no-store"

                }

            );


        /*
           Erreur serveur
        */

        if(
            !response.ok
        ){

            throw new Error(
                "Erreur HTTP " +
                response.status
            );

        }


        /*
           Données JSON
        */

        const data =
            await response.json();


        /*
           Affichage
        */

        renderStats(
            data
        );


        /*
           Heure de dernière actualisation
        */

        const now =
            new Date();


        lastUpdate.textContent =
            "Dernière actualisation : "
            +
            formatTime(
                now
            );


        history.style.display =
            "block";

    }
    catch(error){

        console.error(
            "Erreur statistiques :",
            error
        );


        errorBox.classList.add(
            "visible"
        );


        history.style.display =
            "none";


        lastUpdate.textContent =
            "";

    }
    finally{

        refreshBtn.disabled =
            false;


        refreshBtn.textContent =
            "↻ Actualiser";

    }

}



/* =========================================================
   AFFICHER LES STATISTIQUES
   ========================================================= */

function renderStats(
    data
){

    /*
       Valeurs générales
    */

    const totalVisits =
        Number(
            data.totalVisits
            ??
            0
        );


    const totalGifts =
        Number(
            data.totalGifts
            ??
            0
        );


    const averageGifts =
        Number(
            data.averageGifts
            ??
            0
        );


    /*
       Affichage résumé
    */

    totalVisitsElement.textContent =
        totalVisits;


    totalGiftsElement.textContent =
        totalGifts;


    averageGiftsElement.textContent =
        formatAverage(
            averageGifts
        );


    /*
       Liste
    */

    visitsList.innerHTML =
        "";


    const visits =
        Array.isArray(
            data.visits
        )
        ?
        data.visits
        :
        [];


    /*
       Pas encore de visite
    */

    if(
        visits.length
        ===
        0
    ){

        visitsList.innerHTML = `

            <div class="empty">

                Aucune visite enregistrée.

            </div>

        `;


        return;

    }


    /*
       Chaque visite
    */

    visits.forEach(
        visit => {

            createVisitRow(
                visit
            );

        }
    );

}



/* =========================================================
   CREER UNE LIGNE
   ========================================================= */

function createVisitRow(
    visit
){

    const date =
        new Date(
            visit.created_at
        );


    /*
       Date française
    */

    const dateText =
        new Intl.DateTimeFormat(

            "fr-FR",

            {

                timeZone:
                    "Europe/Paris",

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "numeric"

            }

        )
        .format(
            date
        );


    /*
       Heure française
    */

    const timeText =
        new Intl.DateTimeFormat(

            "fr-FR",

            {

                timeZone:
                    "Europe/Paris",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"

            }

        )
        .format(
            date
        );


    /*
       Cadeaux ouverts
    */

    const gifts =
        Number(
            visit.opened_gifts
            ??
            0
        );


    /*
       Ligne
    */

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "visit";


    /*
       Classe spéciale :
       7 cadeaux ouverts.
    */

    let giftClass =
        "";


    if(
        gifts >= 7
    ){

        giftClass =
            "complete";

    }
    else if(
        gifts === 0
    ){

        giftClass =
            "zero";

    }


    row.innerHTML = `

        <div class="visit-date">

            ${escapeHTML(
                dateText
            )}

        </div>


        <div class="visit-time">

            ${escapeHTML(
                timeText
            )}

        </div>


        <div
            class="
                visit-gifts
                ${giftClass}
            "
        >

            ${gifts} / 7

        </div>

    `;


    visitsList.appendChild(
        row
    );

}



/* =========================================================
   MOYENNE
   ========================================================= */

function formatAverage(
    value
){

    /*
       Exemple :

       3      -> 3
       3.5    -> 3,5
       3.142  -> 3,1
    */

    return value
        .toLocaleString(

            "fr-FR",

            {

                maximumFractionDigits:1

            }

        );

}



/* =========================================================
   HEURE
   ========================================================= */

function formatTime(
    date
){

    return new Intl.DateTimeFormat(

        "fr-FR",

        {

            timeZone:
                "Europe/Paris",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit"

        }

    )
    .format(
        date
    );

}



/* =========================================================
   SECURITE TEXTE
   ========================================================= */

function escapeHTML(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =========================================================
   ACTUALISATION MANUELLE
   ========================================================= */

refreshBtn.addEventListener(
    "click",
    loadStats
);



/* =========================================================
   CHARGEMENT AUTOMATIQUE
   ========================================================= */

loadStats();

</script>


</body>

</html>
