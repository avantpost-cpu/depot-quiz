<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#9f80a6">

<title>Statistiques anniversaire</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #9f80a6
        url("motif.jpg")
        repeat;

    background-size:300px;

    color:#ffffff;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:100%;
    max-width:980px;

    margin:0 auto;

    padding:
        calc(28px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
}


/* =========================================================
   ENTETE
   ========================================================= */

.header{
    text-align:center;

    margin-bottom:28px;
}

.header h1{
    font-size:30px;

    margin-bottom:7px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.25);
}

.header p{
    font-size:14px;

    opacity:.82;
}


/* =========================================================
   RESUME
   ========================================================= */

.summary{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-bottom:12px;
}

.summary-card{
    padding:20px 8px;

    text-align:center;

    background:
        rgba(20,20,30,.82);

    border-radius:17px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.18);
}

.summary-number{
    display:block;

    margin-bottom:5px;

    font-size:31px;
    font-weight:bold;
}

.summary-label{
    display:block;

    font-size:11px;

    opacity:.75;
}


/* =========================================================
   TES TESTS
   ========================================================= */

.owner-summary{
    margin-bottom:18px;

    padding:11px 15px;

    text-align:center;

    background:
        rgba(255,255,255,.14);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:14px;

    font-size:12px;
}

.owner-summary strong{
    font-size:14px;
}


/* =========================================================
   ACTIONS
   ========================================================= */

.stats-actions{
    display:flex;

    justify-content:center;

    margin-bottom:18px;
}

.refresh-btn{
    border:0;

    padding:10px 18px;

    border-radius:22px;

    cursor:pointer;

    font-size:13px;
    font-weight:bold;

    background:
        rgba(255,255,255,.94);

    color:#4b3a50;

    box-shadow:
        0 4px 10px rgba(0,0,0,.16);

    transition:
        transform .15s ease;
}

.refresh-btn:active{
    transform:scale(.96);
}


/* =========================================================
   ERREUR
   ========================================================= */

.error{
    display:none;

    padding:22px;

    margin-bottom:18px;

    text-align:center;

    background:
        rgba(20,20,30,.86);

    border-radius:18px;

    line-height:1.5;
}

.error.visible{
    display:block;
}


/* =========================================================
   HISTORIQUE
   ========================================================= */

.history{
    overflow:hidden;

    background:
        rgba(20,20,30,.86);

    border-radius:18px;

    box-shadow:
        0 10px 28px rgba(0,0,0,.22);
}

.history-title{
    padding:18px;

    font-size:17px;
    font-weight:bold;

    border-bottom:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   TABLEAU
   ========================================================= */

.visit-header,
.visit{
    display:grid;

    grid-template-columns:
        1.1fr
        .65fr
        .55fr
        1.5fr
        .7fr;

    align-items:center;

    gap:8px;
}

.visit-header{
    padding:
        10px
        16px;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:.5px;

    opacity:.55;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.visit{
    padding:
        14px
        16px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.visit:last-child{
    border-bottom:0;
}

.visit-date{
    font-size:13px;
    font-weight:bold;
}

.visit-time{
    font-size:13px;

    opacity:.72;
}

.visit-total{
    text-align:right;

    font-size:14px;
    font-weight:bold;
}

.visit-type{
    text-align:right;

    font-size:11px;

    opacity:.78;
}


/* =========================================================
   CYRILLE
   ========================================================= */

.visit.owner{
    background:
        rgba(255,255,255,.045);
}

.visit.owner .visit-type{
    color:#ffd5e1;

    opacity:1;
}


/* =========================================================
   CADEAUX 1 A 7
   ========================================================= */

.gifts-grid{
    display:grid;

    grid-template-columns:
        repeat(7,1fr);

    gap:5px;

    align-items:center;
}

.gift-state{
    width:24px;
    height:24px;

    margin:auto;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:11px;
    font-weight:bold;

    background:
        rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.25);

    border:
        1px solid
        rgba(255,255,255,.08);
}

.gift-state.opened{
    background:#e26183;

    color:#fff;

    border-color:#e26183;

    box-shadow:
        0 2px 7px rgba(0,0,0,.20);
}


/* =========================================================
   TOTAL
   ========================================================= */

.visit-total.complete{
    color:#f4bdd0;
}

.visit-total.zero{
    opacity:.42;
}


/* =========================================================
   CHARGEMENT
   ========================================================= */

.loading{
    padding:35px;

    text-align:center;

    font-size:14px;

    opacity:.75;
}

.empty{
    padding:35px;

    text-align:center;

    font-size:13px;

    opacity:.65;
}


/* =========================================================
   DERNIERE ACTUALISATION
   ========================================================= */

.last-update{
    margin-top:14px;

    text-align:center;

    font-size:10px;

    opacity:.55;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:760px){

    .page{
        padding-left:10px;
        padding-right:10px;
    }

    .header h1{
        font-size:25px;
    }

    .summary{
        gap:7px;
    }

    .summary-card{
        padding:
            16px
            4px;
    }

    .summary-number{
        font-size:25px;
    }

    .summary-label{
        font-size:9px;
    }

    .history{
        overflow-x:auto;
    }

    .visit-header,
    .visit{
        min-width:780px;
    }

}

</style>

</head>


<body>


<main class="page">


<header class="header">

    <h1>
        Statistiques anniversaire
    </h1>

    <p>
        Utilisation du site
    </p>

</header>



<section class="summary">


    <div class="summary-card">

        <span
            class="summary-number"
            id="realVisits"
        >
            —
        </span>

        <span class="summary-label">
            VISITEURS
        </span>

    </div>


    <div class="summary-card">

        <span
            class="summary-number"
            id="realGifts"
        >
            —
        </span>

        <span class="summary-label">
            CADEAUX OUVERTS
        </span>

    </div>


    <div class="summary-card">

        <span
            class="summary-number"
            id="realAverage"
        >
            —
        </span>

        <span class="summary-label">
            MOYENNE / 7
        </span>

    </div>


</section>



<div class="owner-summary">

    Tes visites / tests :
    <strong id="ownerVisits">—</strong>

</div>



<div class="stats-actions">

    <button
        class="refresh-btn"
        id="refreshBtn"
        type="button"
    >
        ↻ Actualiser
    </button>

</div>



<div
    class="error"
    id="errorBox"
>
    Impossible de récupérer les statistiques.
</div>



<section
    class="history"
    id="history"
>

    <div class="history-title">
        Historique des visites
    </div>


    <div class="visit-header">

        <div>
            Date
        </div>

        <div>
            Heure
        </div>

        <div style="text-align:right;">
            Total
        </div>

        <div>
            Cadeaux 1 → 7
        </div>

        <div style="text-align:right;">
            Qui
        </div>

    </div>


    <div id="visitsList">

        <div class="loading">
            Chargement…
        </div>

    </div>

</section>



<div
    class="last-update"
    id="lastUpdate"
></div>


</main>



<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const STATS_URL =
    "https://tdsrqmpfdvntybdlvejy.supabase.co/functions/v1/birthday-stats";


const STATS_TOKEN =
    "MamanStats-2026-Cadeaux-7-PrivE-84xQ";


/* =========================================================
   ELEMENTS
   ========================================================= */

const realVisitsElement =
    document.getElementById(
        "realVisits"
    );


const realGiftsElement =
    document.getElementById(
        "realGifts"
    );


const realAverageElement =
    document.getElementById(
        "realAverage"
    );


const ownerVisitsElement =
    document.getElementById(
        "ownerVisits"
    );


const visitsList =
    document.getElementById(
        "visitsList"
    );


const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const history =
    document.getElementById(
        "history"
    );


const lastUpdate =
    document.getElementById(
        "lastUpdate"
    );


/* =========================================================
   CHARGEMENT
   ========================================================= */

async function loadStats(){

    refreshBtn.disabled =
        true;


    refreshBtn.textContent =
        "Actualisation…";


    errorBox.classList.remove(
        "visible"
    );


    try{

        const response =
            await fetch(

                STATS_URL,

                {

                    method:"GET",

                    headers:{

                        "x-stats-token":
                            STATS_TOKEN

                    },

                    cache:"no-store"

                }

            );


        if(
            !response.ok
        ){

            throw new Error(
                "Erreur HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        renderStats(
            data
        );


        lastUpdate.textContent =
            "Dernière actualisation : "
            +
            formatTime(
                new Date()
            );


        history.style.display =
            "block";

    }
    catch(error){

        console.error(
            "Erreur statistiques :",
            error
        );


        errorBox.classList.add(
            "visible"
        );


        history.style.display =
            "none";


        lastUpdate.textContent =
            "";

    }
    finally{

        refreshBtn.disabled =
            false;


        refreshBtn.textContent =
            "↻ Actualiser";

    }

}


/* =========================================================
   AFFICHAGE GENERAL
   ========================================================= */

function renderStats(
    data
){

    const visits =
        Array.isArray(
            data.visits
        )
        ?
        data.visits
        :
        [];


    /*
       On recalcule ici les statistiques
       à partir des visites reçues.

       Comme ça stats.html reste fiable
       même si la fonction Edge renvoie
       seulement la liste brute.
    */

    const visitorVisits =
        visits.filter(
            visit =>
                visit.visitor_type !== "cyrille"
        );


    const ownerVisits =
        visits.filter(
            visit =>
                visit.visitor_type === "cyrille"
        );


    const realVisits =
        visitorVisits.length;


    const realGifts =
        visitorVisits.reduce(
            (total,visit) =>
                total
                +
                Number(
                    visit.opened_gifts
                    ??
                    0
                ),
            0
        );


    const realAverage =
        realVisits > 0
        ?
        realGifts / realVisits
        :
        0;


    realVisitsElement.textContent =
        realVisits;


    realGiftsElement.textContent =
        realGifts;


    realAverageElement.textContent =
        formatAverage(
            realAverage
        );


    ownerVisitsElement.textContent =
        ownerVisits.length;


    visitsList.innerHTML =
        "";


    if(
        visits.length === 0
    ){

        visitsList.innerHTML = `

            <div class="empty">
                Aucune visite enregistrée.
            </div>

        `;


        return;

    }


    visits.forEach(
        visit => {

            createVisitRow(
                visit
            );

        }
    );

}


/* =========================================================
   LIGNE
   ========================================================= */

function createVisitRow(
    visit
){

    const date =
        new Date(
            visit.created_at
        );


    const dateText =
        new Intl.DateTimeFormat(

            "fr-FR",

            {

                timeZone:
                    "Europe/Paris",

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "numeric"

            }

        )
        .format(
            date
        );


    const timeText =
        new Intl.DateTimeFormat(

            "fr-FR",

            {

                timeZone:
                    "Europe/Paris",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"

            }

        )
        .format(
            date
        );


    const total =
        Number(
            visit.opened_gifts
            ??
            0
        );


    const isOwner =
        visit.visitor_type
        ===
        "cyrille";


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "visit "
        +
        (
            isOwner
            ?
            "owner"
            :
            "visitor"
        );


    let giftHTML =
        "";


    for(
        let i = 1;
        i <= 7;
        i++
    ){

        const opened =
            visit[
                "gift_" + i
            ]
            ===
            true;


        giftHTML += `

            <div
                class="
                    gift-state
                    ${
                        opened
                        ?
                        "opened"
                        :
                        ""
                    }
                "
                title="Cadeau ${i}"
            >

                ${
                    opened
                    ?
                    "●"
                    :
                    "○"
                }

            </div>

        `;

    }


    let totalClass =
        "";


    if(
        total >= 7
    ){

        totalClass =
            "complete";

    }
    else if(
        total === 0
    ){

        totalClass =
            "zero";

    }


    row.innerHTML = `

        <div class="visit-date">

            ${escapeHTML(
                dateText
            )}

        </div>


        <div class="visit-time">

            ${escapeHTML(
                timeText
            )}

        </div>


        <div
            class="
                visit-total
                ${totalClass}
            "
        >

            ${total} / 7

        </div>


        <div class="gifts-grid">

            ${giftHTML}

        </div>


        <div class="visit-type">

            ${
                isOwner
                ?
                "Cyrille"
                :
                "Visiteur"
            }

        </div>

    `;


    visitsList.appendChild(
        row
    );

}


/* =========================================================
   FORMAT MOYENNE
   ========================================================= */

function formatAverage(
    value
){

    return Number(
        value
    )
    .toLocaleString(

        "fr-FR",

        {
            maximumFractionDigits:1
        }

    );

}


/* =========================================================
   HEURE
   ========================================================= */

function formatTime(
    date
){

    return new Intl.DateTimeFormat(

        "fr-FR",

        {

            timeZone:
                "Europe/Paris",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit"

        }

    )
    .format(
        date
    );

}


/* =========================================================
   SECURITE TEXTE
   ========================================================= */

function escapeHTML(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ACTUALISER
   ========================================================= */

refreshBtn.addEventListener(
    "click",
    loadStats
);


/* =========================================================
   AUTO
   ========================================================= */

loadStats();

</script>

</body>

</html>
