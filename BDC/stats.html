<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#9f80a6">

<title>Statistiques anniversaire</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    min-height:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #9f80a6
        url("motif.jpg")
        repeat;

    background-size:300px;

    color:#ffffff;
}


/* =========================================================
   PAGE
   ========================================================= */

.page{
    width:100%;
    max-width:760px;

    margin:0 auto;

    padding:
        calc(35px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
}


/* =========================================================
   ENTETE
   ========================================================= */

.header{
    text-align:center;

    margin-bottom:28px;
}

.header h1{
    font-size:30px;

    margin-bottom:7px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.25);
}

.header p{
    font-size:14px;

    opacity:.82;
}


/* =========================================================
   RESUME PRINCIPAL
   ========================================================= */

.summary{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-bottom:12px;
}

.summary-card{
    padding:20px 8px;

    text-align:center;

    background:
        rgba(20,20,30,.82);

    border-radius:17px;

    box-shadow:
        0 8px 20px rgba(0,0,0,.18);
}

.summary-number{
    display:block;

    margin-bottom:5px;

    font-size:31px;
    font-weight:bold;
}

.summary-label{
    display:block;

    font-size:11px;

    opacity:.75;
}


/* =========================================================
   TES PROPRES VISITES
   ========================================================= */

.owner-summary{
    margin-bottom:18px;

    padding:11px 15px;

    text-align:center;

    background:
        rgba(255,255,255,.14);

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:14px;

    font-size:12px;
}

.owner-summary strong{
    font-size:14px;
}


/* =========================================================
   ACTIONS
   ========================================================= */

.stats-actions{
    display:flex;

    justify-content:center;

    margin-bottom:18px;
}

.refresh-btn{
    border:0;

    padding:10px 18px;

    border-radius:22px;

    cursor:pointer;

    font-size:13px;
    font-weight:bold;

    background:
        rgba(255,255,255,.94);

    color:#4b3a50;

    box-shadow:
        0 4px 10px rgba(0,0,0,.16);

    transition:
        transform .15s ease;
}

.refresh-btn:active{
    transform:scale(.96);
}


/* =========================================================
   HISTORIQUE
   ========================================================= */

.history{
    overflow:hidden;

    background:
        rgba(20,20,30,.86);

    border-radius:18px;

    box-shadow:
        0 10px 28px rgba(0,0,0,.22);
}

.history-title{
    padding:18px;

    font-size:17px;
    font-weight:bold;

    border-bottom:
        1px solid
        rgba(255,255,255,.10);
}


/* =========================================================
   ENTETE TABLEAU
   ========================================================= */

.visit-header{
    display:grid;

    grid-template-columns:
        1.25fr
        .65fr
        .7fr
        .75fr;

    gap:8px;

    padding:
        10px
        16px;

    font-size:10px;
    font-weight:bold;

    text-transform:uppercase;

    letter-spacing:.5px;

    opacity:.55;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.visit-header div:nth-child(3),
.visit-header div:nth-child(4){
    text-align:right;
}


/* =========================================================
   VISITE
   ========================================================= */

.visit{
    display:grid;

    grid-template-columns:
        1.25fr
        .65fr
        .7fr
        .75fr;

    align-items:center;

    gap:8px;

    padding:
        14px
        16px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.visit:last-child{
    border-bottom:0;
}

.visit-date{
    font-size:13px;
    font-weight:bold;
}

.visit-time{
    font-size:13px;

    opacity:.72;
}

.visit-gifts{
    text-align:right;

    font-size:15px;
    font-weight:bold;
}

.visit-type{
    text-align:right;

    font-size:11px;

    opacity:.75;
}


/* =========================================================
   TYPES
   ========================================================= */

.visit.owner{
    background:
        rgba(255,255,255,.045);
}

.visit.owner .visit-type{
    color:#ffd5e1;

    opacity:1;
}

.visit.visitor .visit-type{
    color:#ffffff;
}


/* =========================================================
   ETATS CADEAUX
   ========================================================= */

.visit-gifts.complete{
    color:#f4bdd0;
}

.visit-gifts.zero{
    opacity:.45;
}


/* =========================================================
   CHARGEMENT
   ========================================================= */

.loading{
    padding:35px;

    text-align:center;

    font-size:14px;

    opacity:.75;
}


/* =========================================================
   ERREUR
   ========================================================= */

.error{
    display:none;

    padding:25px;

    text-align:center;

    background:
        rgba(20,20,30,.86);

    border-radius:18px;

    line-height:1.5;

    margin-bottom:18px;
}

.error.visible{
    display:block;
}


/* =========================================================
   VIDE
   ========================================================= */

.empty{
    padding:35px;

    text-align:center;

    font-size:13px;

    opacity:.65;
}


/* =========================================================
   DERNIERE ACTUALISATION
   ========================================================= */

.last-update{
    margin-top:14px;

    text-align:center;

    font-size:10px;

    opacity:.55;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:560px){

    .page{
        padding-left:11px;
        padding-right:11px;
    }

    .header h1{
        font-size:25px;
    }

    .summary{
        gap:7px;
    }

    .summary-card{
        padding:
            16px
            4px;
    }

    .summary-number{
        font-size:25px;
    }

    .summary-label{
        font-size:9px;
    }

    .visit,
    .visit-header{

        grid-template-columns:
            1.15fr
            .55fr
            .55fr
            .65fr;

        padding-left:12px;
        padding-right:12px;

    }

    .visit-date,
    .visit-time{
        font-size:11px;
    }

    .visit-gifts{
        font-size:12px;
    }

    .visit-type{
        font-size:9px;
    }

}

</style>

</head>


<body>


<main class="page">


<header class="header">

    <h1>
        Statistiques anniversaire
    </h1>

    <p>
        Utilisation du site
    </p>

</header>



<!-- =====================================================
     RESUME VISITEURS UNIQUEMENT
     ===================================================== -->

<section class="summary">


    <div class="summary-card">

        <span
            class="summary-number"
            id="realVisits"
        >
            —
        </span>

        <span class="summary-label">
            VISITEURS
        </span>

    </div>


    <div class="summary-card">

        <span
            class="summary-number"
            id="realGifts"
        >
            —
        </span>

        <span class="summary-label">
            CADEAUX OUVERTS
        </span>

    </div>


    <div class="summary-card">

        <span
            class="summary-number"
            id="realAverage"
        >
            —
        </span>

        <span class="summary-label">
            MOYENNE / 7
        </span>

    </div>


</section>



<div class="owner-summary">

    Tes visites / tests :
    <strong id="ownerVisits">—</strong>

</div>



<div class="stats-actions">

    <button
        class="refresh-btn"
        id="refreshBtn"
        type="button"
    >
        ↻ Actualiser
    </button>

</div>



<div
    class="error"
    id="errorBox"
>
    Impossible de récupérer les statistiques.
</div>



<!-- =====================================================
     HISTORIQUE
     ===================================================== -->

<section
    class="history"
    id="history"
>

    <div class="history-title">
        Historique des visites
    </div>


    <div class="visit-header">

        <div>
            Date
        </div>

        <div>
            Heure
        </div>

        <div>
            Cadeaux
        </div>

        <div>
            Qui
        </div>

    </div>


    <div id="visitsList">

        <div class="loading">
            Chargement…
        </div>

    </div>

</section>



<div
    class="last-update"
    id="lastUpdate"
></div>


</main>



<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const STATS_URL =
    "https://tdsrqmpfdvntybdlvejy.supabase.co/functions/v1/birthday-stats";


const STATS_TOKEN =
    "MamanStats-2026-Cadeaux-7-PrivE-84xQ";


/* =========================================================
   ELEMENTS
   ========================================================= */

const realVisitsElement =
    document.getElementById(
        "realVisits"
    );


const realGiftsElement =
    document.getElementById(
        "realGifts"
    );


const realAverageElement =
    document.getElementById(
        "realAverage"
    );


const ownerVisitsElement =
    document.getElementById(
        "ownerVisits"
    );


const visitsList =
    document.getElementById(
        "visitsList"
    );


const refreshBtn =
    document.getElementById(
        "refreshBtn"
    );


const errorBox =
    document.getElementById(
        "errorBox"
    );


const history =
    document.getElementById(
        "history"
    );


const lastUpdate =
    document.getElementById(
        "lastUpdate"
    );


/* =========================================================
   CHARGEMENT
   ========================================================= */

async function loadStats(){

    refreshBtn.disabled =
        true;


    refreshBtn.textContent =
        "Actualisation…";


    errorBox.classList.remove(
        "visible"
    );


    try{

        const response =
            await fetch(

                STATS_URL,

                {

                    method:"GET",

                    headers:{

                        "x-stats-token":
                            STATS_TOKEN

                    },

                    cache:"no-store"

                }

            );


        if(
            !response.ok
        ){

            throw new Error(
                "Erreur HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        renderStats(
            data
        );


        const now =
            new Date();


        lastUpdate.textContent =
            "Dernière actualisation : "
            +
            formatTime(
                now
            );


        history.style.display =
            "block";

    }
    catch(error){

        console.error(
            "Erreur statistiques :",
            error
        );


        errorBox.classList.add(
            "visible"
        );


        history.style.display =
            "none";


        lastUpdate.textContent =
            "";

    }
    finally{

        refreshBtn.disabled =
            false;


        refreshBtn.textContent =
            "↻ Actualiser";

    }

}


/* =========================================================
   AFFICHAGE GENERAL
   ========================================================= */

function renderStats(
    data
){

    /*
       Statistiques visiteurs uniquement
       fournies par birthday-stats.
    */

    realVisitsElement.textContent =
        Number(
            data.realVisits
            ??
            0
        );


    realGiftsElement.textContent =
        Number(
            data.realGifts
            ??
            0
        );


    realAverageElement.textContent =
        formatAverage(
            Number(
                data.realAverage
                ??
                0
            )
        );


    ownerVisitsElement.textContent =
        Number(
            data.ownerVisits
            ??
            0
        );


    visitsList.innerHTML =
        "";


    const visits =
        Array.isArray(
            data.visits
        )
        ?
        data.visits
        :
        [];


    if(
        visits.length
        ===
        0
    ){

        visitsList.innerHTML = `

            <div class="empty">
                Aucune visite enregistrée.
            </div>

        `;


        return;

    }


    visits.forEach(
        visit => {

            createVisitRow(
                visit
            );

        }
    );

}


/* =========================================================
   UNE LIGNE
   ========================================================= */

function createVisitRow(
    visit
){

    const date =
        new Date(
            visit.created_at
        );


    const dateText =
        new Intl.DateTimeFormat(

            "fr-FR",

            {

                timeZone:
                    "Europe/Paris",

                day:
                    "2-digit",

                month:
                    "long",

                year:
                    "numeric"

            }

        )
        .format(
            date
        );


    const timeText =
        new Intl.DateTimeFormat(

            "fr-FR",

            {

                timeZone:
                    "Europe/Paris",

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                second:
                    "2-digit"

            }

        )
        .format(
            date
        );


    const gifts =
        Number(
            visit.opened_gifts
            ??
            0
        );


    const visitorType =
        visit.visitor_type
        ===
        "cyrille"
        ?
        "cyrille"
        :
        "visitor";


    const row =
        document.createElement(
            "div"
        );


    row.className =
        "visit "
        +
        (
            visitorType
            ===
            "cyrille"
            ?
            "owner"
            :
            "visitor"
        );


    let giftClass =
        "";


    if(
        gifts >= 7
    ){

        giftClass =
            "complete";

    }
    else if(
        gifts === 0
    ){

        giftClass =
            "zero";

    }


    const typeText =
        visitorType
        ===
        "cyrille"
        ?
        "Cyrille"
        :
        "Visiteur";


    row.innerHTML = `

        <div class="visit-date">
            ${escapeHTML(dateText)}
        </div>


        <div class="visit-time">
            ${escapeHTML(timeText)}
        </div>


        <div
            class="
                visit-gifts
                ${giftClass}
            "
        >
            ${gifts} / 7
        </div>


        <div class="visit-type">
            ${typeText}
        </div>

    `;


    visitsList.appendChild(
        row
    );

}


/* =========================================================
   FORMAT MOYENNE
   ========================================================= */

function formatAverage(
    value
){

    return value
        .toLocaleString(

            "fr-FR",

            {

                maximumFractionDigits:1

            }

        );

}


/* =========================================================
   FORMAT HEURE
   ========================================================= */

function formatTime(
    date
){

    return new Intl.DateTimeFormat(

        "fr-FR",

        {

            timeZone:
                "Europe/Paris",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit"

        }

    )
    .format(
        date
    );

}


/* =========================================================
   TEXTE
   ========================================================= */

function escapeHTML(
    value
){

    return String(
        value
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ACTUALISER
   ========================================================= */

refreshBtn.addEventListener(
    "click",
    loadStats
);


/* =========================================================
   CHARGEMENT AUTO
   ========================================================= */

loadStats();

</script>

</body>

</html>
