<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebond — Charte Instagram</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bleu:#1b5f6e;--orange:#f47d5c;--fond:#f7f3eb}*{box-sizing:border-box}body{margin:0;background:var(--fond);color:#183e47;font-family:Poppins,sans-serif}header{background:var(--bleu);color:white;padding:48px max(24px,calc((100vw - 1200px)/2)) 38px}header small{color:#ffd2a7;font-weight:700;letter-spacing:.13em;text-transform:uppercase}h1{font-size:clamp(32px,5vw,58px);line-height:1.1;margin:12px 0}header p{max-width:700px;line-height:1.6}main{max-width:1240px;margin:auto;padding:32px 24px 80px}.tools{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}input{font:inherit;padding:14px 18px;border:1px solid #c4d1d0;border-radius:12px;background:white;min-width:min(100%,330px)}.tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px}button{font:inherit;cursor:pointer}.tab{border:1px solid #b7cfce;background:white;color:var(--bleu);border-radius:100px;padding:10px 17px;font-weight:600}.tab.active{background:var(--bleu);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:22px}.tile{background:white;border-radius:16px;overflow:hidden;box-shadow:0 6px 25px #123c4814}.preview{display:block;width:100%;aspect-ratio:1;background:#e5e5e0;border:0;padding:0;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain;transition:transform .2s}.preview:hover img{transform:scale(1.04)}.meta{padding:14px 16px}.name{font-size:12px;font-weight:600;overflow-wrap:anywhere;min-height:40px}.download{display:inline-block;color:var(--bleu);font-weight:700;font-size:13px;margin-top:12px;text-decoration:none}.download:hover{text-decoration:underline}.message{padding:30px;background:white;border-radius:14px}dialog{border:0;border-radius:18px;padding:18px;max-width:min(900px,95vw);max-height:95vh;box-shadow:0 30px 100px #0006}dialog::backdrop{background:#09272bd9}.modalbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.modalbar strong{overflow-wrap:anywhere}dialog img{display:block;max-width:100%;max-height:70vh;margin:auto;object-fit:contain}.close{background:var(--orange);border:0;border-radius:9px;padding:9px 14px;font-weight:700}footer{text-align:center;padding:25px;color:#6c8387;font-size:12px}@media(max-width:600px){header{padding:36px 24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.meta{padding:10px}.name{font-size:11px}}
</style></head><body><header><small>Rebond · Ressources graphiques</small><h1>Charte Instagram</h1><p>Explorez les fonds disponibles pour vos publications. Cliquez sur une image pour l'agrandir, puis téléchargez le fichier original.</p></header><main><div class="tools"><strong id="summary">Chargement des images…</strong><input id="search" type="search" placeholder="Rechercher une image…" aria-label="Rechercher"></div><nav id="tabs" class="tabs" aria-label="Choisir un fond"></nav><section id="content" aria-live="polite"></section></main><footer>Rebond® 2026 · Bibliothèque graphique Instagram</footer><dialog id="viewer"><div class="modalbar"><strong id="modalname"></strong><button id="close" class="close">Fermer ✕</button></div><img id="modalimg" alt=""><p id="modalcategory"></p><a id="modaldownload" class="download" href="#">↓ Télécharger l'image originale</a></dialog><script>
const OWNER='avantpost-cpu',REPO='depot-quiz',API='https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/',RAW='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/main/';const CANDIDATES=['charte instagram','charte-instagram','charte_instagram','charte Instagram','Charte Instagram'];const $=id=>document.getElementById(id);let folders=[],images=[],selected='all';const enc=p=>p.split('/').map(encodeURIComponent).join('/');const isImage=n=>/\.(png|jpe?g|gif|webp|svg|avif)$/i.test(n);async function read(path){const r=await fetch(API+enc(path),{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub HTTP '+r.status);return r.json()}async function download(url,name){try{const r=await fetch(url);if(!r.ok)throw Error('fetch');const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500)}catch{alert('Téléchargement impossible pour ce fichier. Réessayez dans quelques instants.')}}function show(img){$('modalname').textContent=img.name;$('modalimg').src=img.url;$('modalimg').alt=img.name;$('modalcategory').textContent=img.folder;$('modaldownload').onclick=e=>{e.preventDefault();download(img.url,img.name)};$('viewer').showModal()}function render(){const q=$('search').value.toLocaleLowerCase('fr').trim(),visible=images.filter(i=>(selected==='all'||i.folder===selected)&&i.name.toLocaleLowerCase('fr').includes(q));$('summary').textContent=images.length+' images disponibles · '+folders.length+' fonds';$('tabs').replaceChildren();[['all','Tous les fonds'],...folders.map(f=>[f.name,f.name])].forEach(([key,label])=>{const b=document.createElement('button');b.className='tab'+(selected===key?' active':'');b.textContent=label+' ('+(key==='all'?images.length:images.filter(i=>i.folder===key).length)+')';b.onclick=()=>{selected=key;render()};$('tabs').append(b)});$('content').replaceChildren();if(!visible.length){const p=document.createElement('p');p.className='message';p.textContent='Aucune image dans cette sélection.';$('content').append(p);return}const grid=document.createElement('div');grid.className='grid';visible.forEach(i=>{const card=document.createElement('article');card.className='tile';const b=document.createElement('button');b.className='preview';b.title='Agrandir '+i.name;const img=document.createElement('img');img.src=i.url;img.alt=i.name;img.loading='lazy';b.append(img);b.onclick=()=>show(i);const meta=document.createElement('div');meta.className='meta';const n=document.createElement('div');n.className='name';n.textContent=i.name;const a=document.createElement('a');a.className='download';a.href=i.url;a.textContent='↓ Télécharger';a.onclick=e=>{e.preventDefault();download(i.url,i.name)};meta.append(n,a);card.append(b,meta);grid.append(card)});$('content').append(grid)}async function init(){try{let root=null;for(const path of CANDIDATES){try{const data=await read(path);if(Array.isArray(data)){root=data;break}}catch(e){if(!String(e).includes('404'))throw e}}if(!root){const top=await read('');const match=top.find(i=>i.type==='dir'&&/charte[\s_-]*instagram/i.test(i.name));if(match)root=await read(match.path)}if(!root)throw Error('Dossier « charte instagram » introuvable dans le dépôt.');folders=root.filter(i=>i.type==='dir'&&/^fond/i.test(i.name)).sort((a,b)=>a.name.localeCompare(b.name,'fr',{numeric:true}));if(!folders.length)folders=root.filter(i=>i.type==='dir');const results=await Promise.allSettled(folders.map(f=>read(f.path)));images=results.flatMap((r,j)=>r.status==='fulfilled'&&Array.isArray(r.value)?r.value.filter(i=>i.type==='file'&&isImage(i.name)).map(i=>({name:i.name,folder:folders[j].name,url:new URL(enc(i.path),document.baseURI).href})):[]);render();if(results.some(r=>r.status==='rejected')){const p=document.createElement('p');p.className='message';p.textContent='Certains dossiers n’ont pas pu être chargés.';$('content').prepend(p)}}catch(e){$('summary').textContent='Bibliothèque indisponible';const p=document.createElement('p');p.className='message';p.textContent='Impossible de charger les images : '+e.message;$('content').replaceChildren(p)}}$('search').addEventListener('input',render);$('close').onclick=()=>$('viewer').close();$('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))$('viewer').close()});init();
</script></body></html>
