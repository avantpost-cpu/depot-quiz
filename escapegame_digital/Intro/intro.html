<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escape Game Rebond - Introduction</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#1b5f6e;
  font-family:Arial, Helvetica, sans-serif;
}

.page-intro{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:40px;
}

.bloc-intro{
  position:relative;
  width:999px;
  height:716px;
  line-height:0;
  font-size:0;
}

.video-intro{
  display:block;
  width:999px;
  height:716px;
  object-fit:fill;
  border:0;
  background:#000000;
}

/* BOUTON IMAGE CENTRAL */

.bouton-go{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:100;

  width:260px;
  height:auto;

  display:block;
  cursor:pointer;
  user-select:none;
  -webkit-user-drag:none;

  filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));

  transition:
    transform .2s ease,
    opacity .2s ease,
    filter .2s ease;
}

.bouton-go:hover{
  transform:translate(-50%,-50%) scale(1.05);
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.42));
}

.bouton-go:active{
  transform:translate(-50%,-50%) scale(.97);
}

/* FLÈCHE VERS L'ÉNIGME 1 */

.next-arrow{
  position:fixed;
  top:50%;
  right:35px;

  transform:
    translateY(-50%)
    translateX(12px);

  width:56px;
  height:56px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:62px;
  font-weight:200;
  color:#ffffff;
  text-decoration:none;

  opacity:0;
  pointer-events:none;

  transition:.35s ease;

  z-index:999;
}

.next-arrow.visible{
  opacity:.45;
  pointer-events:auto;

  transform:
    translateY(-50%)
    translateX(0);
}

.next-arrow:hover{
  opacity:1;

  transform:
    translateY(-50%)
    translateX(6px);
}

@media screen and (max-width:1080px){

  .page-intro{
    align-items:flex-start;
    padding-left:20px;
  }

}
</style>
</head>

<body>

<div class="page-intro">

  <div class="bloc-intro">

    <video
      id="videoIntro"
      class="video-intro"
      playsinline
      webkit-playsinline
      preload="auto">

      <source
        src="https://avantpost-cpu.github.io/depot-quiz/escapegame_digital/Intro/intro.mp4"
        type="video/mp4">

    </video>

    <img
      id="boutonGo"
      class="bouton-go"
      src="https://avantpost-cpu.github.io/depot-quiz/escapegame_digital/Intro/bouton.png"
      alt="Lancer l’introduction"
      role="button"
      tabindex="0"
      draggable="false">

  </div>

</div>

<a
  href="../enigme1.html"
  class="next-arrow"
  id="nextBtn"
  title="Commencer l’énigme 1"
  aria-label="Passer à l’énigme 1">
  →
</a>

<script>
const videoIntro =
  document.getElementById("videoIntro");

const boutonGo =
  document.getElementById("boutonGo");

const nextBtn =
  document.getElementById("nextBtn");

let introDemarree = false;

/*
  La première image de la vidéo reste visible.
  La vidéo démarre avec le son après le clic
  sur l'image bouton.
*/

function preparerIntro(){

  videoIntro.pause();

  try{
    videoIntro.currentTime = 0;
  }
  catch(erreur){
  }

}

if(videoIntro.readyState >= 1){

  preparerIntro();

}
else{

  videoIntro.addEventListener(
    "loadedmetadata",
    preparerIntro,
    {
      once:true
    }
  );

}

function lancerIntroduction(){

  if(introDemarree){
    return;
  }

  introDemarree = true;

  boutonGo.style.opacity = "0";
  boutonGo.style.pointerEvents = "none";

  window.setTimeout(function(){

    boutonGo.style.display = "none";

  }, 200);

  videoIntro.muted = false;
  videoIntro.volume = 1;
  videoIntro.currentTime = 0;

  const lecture =
    videoIntro.play();

  if(
    lecture &&
    typeof lecture.catch === "function"
  ){

    lecture.catch(function(){

      introDemarree = false;

      boutonGo.style.display = "block";
      boutonGo.style.opacity = "1";
      boutonGo.style.pointerEvents = "auto";

    });

  }

}

boutonGo.addEventListener(
  "click",
  lancerIntroduction
);

boutonGo.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();
      lancerIntroduction();

    }

  }
);

/*
  À la fin de la vidéo, la dernière image reste affichée
  et la flèche vers l'énigme 1 apparaît.
*/

videoIntro.addEventListener(
  "ended",
  function(){

    videoIntro.pause();

    nextBtn.classList.add(
      "visible"
    );

  }
);
</script>

</body>
</html>
