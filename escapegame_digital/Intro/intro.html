<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escape Game Rebond - Introduction</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#1b5f6e;
  font-family:Arial, Helvetica, sans-serif;
}

.page-intro{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:40px;
}

.bloc-intro{
  position:relative;
  width:999px;
  height:716px;
  line-height:0;
  font-size:0;
}

/* ======================================================
   VIDÉO CACHÉE AU DÉPART
====================================================== */

.video-intro{
  display:none;
  width:999px;
  height:716px;
  object-fit:fill;
  border:0;
  background:#000000;
}

.video-intro.visible{
  display:block;
}

/* ======================================================
   BOUTON IMAGE CENTRAL
====================================================== */

.bouton-go{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:100;

  width:260px;
  height:auto;

  display:block;
  cursor:pointer;
  user-select:none;
  -webkit-user-drag:none;

  transition:
    transform .2s ease,
    opacity .2s ease;
}

.bouton-go:hover{
  transform:translate(-50%,-50%) scale(1.05);
}

.bouton-go:active{
  transform:translate(-50%,-50%) scale(.97);
}

.bouton-go:focus-visible{
  outline:3px solid #ffffff;
  outline-offset:5px;
}

/* ======================================================
   FORMULAIRE DE SESSION
====================================================== */

.inscription-overlay{
  position:absolute;
  inset:0;
  z-index:150;

  display:none;
  align-items:center;
  justify-content:center;

  padding:36px;

  background:rgba(27,95,110,.92);

  line-height:normal;
  font-size:16px;
}

.inscription-overlay.visible{
  display:flex;
}

.inscription-carte{
  width:560px;
  max-width:100%;

  padding:30px;

  background:#ffffff;
  color:#044e61;

  border-radius:24px;
}

.inscription-carte h1{
  margin-bottom:10px;

  font-size:30px;
  line-height:1.1;
}

.inscription-carte .introduction{
  margin-bottom:24px;

  color:#476b73;

  font-size:16px;
  line-height:1.45;
}

.champ{
  display:flex;
  flex-direction:column;
  gap:7px;

  margin-bottom:17px;
}

.champ label{
  font-size:15px;
  font-weight:bold;
}

.champ input{
  width:100%;
  height:52px;

  padding:0 14px;

  border:2px solid #bed1d5;
  border-radius:12px;

  outline:none;

  background:#ffffff;
  color:#163f48;

  font-size:17px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.champ input:focus{
  border-color:#edb01a;
  box-shadow:0 0 0 4px rgba(237,176,26,.20);
}

#codeSession{
  text-transform:uppercase;
  letter-spacing:2px;
  font-weight:bold;
}

.bouton-commencer{
  width:100%;
  min-height:58px;

  margin-top:5px;
  padding:12px 24px;

  border:0;
  border-radius:999px;

  background:#edb01a;
  color:#044e61;

  font-size:19px;
  font-weight:bold;

  cursor:pointer;

  transition:
    transform .2s ease,
    opacity .2s ease;
}

.bouton-commencer:hover{
  transform:translateY(-2px);
}

.bouton-commencer:disabled{
  opacity:.55;
  cursor:wait;
  transform:none;
}

.message{
  min-height:23px;
  margin-top:15px;

  font-size:14px;
  line-height:1.4;
  font-weight:bold;
}

.message.erreur{
  color:#b53030;
}

.message.succes{
  color:#16824a;
}

@media screen and (max-width:1080px){

  .page-intro{
    align-items:flex-start;
    padding-left:20px;
  }

}

@media screen and (max-width:620px){

  .inscription-overlay{
    padding:18px;
  }

  .inscription-carte{
    padding:24px 18px;
  }

  .inscription-carte h1{
    font-size:27px;
  }

}
</style>
</head>

<body>

<div class="page-intro">

  <div class="bloc-intro">

    <video
      id="videoIntro"
      class="video-intro"
      playsinline
      webkit-playsinline
      preload="auto">

      <source
        src="https://avantpost-cpu.github.io/depot-quiz/escapegame_digital/Intro/intro.mp4"
        type="video/mp4">

    </video>

    <img
      id="boutonGo"
      class="bouton-go"
      src="https://avantpost-cpu.github.io/depot-quiz/escapegame_digital/Intro/bouton.png"
      alt="Lancer l’introduction"
      role="button"
      tabindex="0"
      draggable="false">

    <!-- FORMULAIRE AFFICHÉ À LA FIN DE LA VIDÉO -->

    <div
      id="inscriptionOverlay"
      class="inscription-overlay">

      <form
        id="formulaireEquipe"
        class="inscription-carte">

        <h1>Rejoindre la partie</h1>

        <p class="introduction">
          Entre le code transmis par l’adulte
          et choisis un nom pour ton équipe.
        </p>

        <div class="champ">

          <label for="codeSession">
            Code de session *
          </label>

          <input
            id="codeSession"
            name="codeSession"
            type="text"
            placeholder="RBD-7K42"
            autocomplete="off"
            maxlength="8"
            required>

        </div>

        <div class="champ">

          <label for="nomEquipe">
            Nom de l’équipe ou du participant *
          </label>

          <input
            id="nomEquipe"
            name="nomEquipe"
            type="text"
            autocomplete="off"
            required>

        </div>

        <button
          id="boutonRejoindre"
          class="bouton-commencer"
          type="submit">
          Commencer l’enquête
        </button>

        <div
          id="message"
          class="message"
          aria-live="polite">
        </div>

      </form>

    </div>

  </div>

</div>

<!-- BIBLIOTHÈQUE SUPABASE -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<!-- CONFIGURATION DU PROJET -->

<script src="../js/config.js"></script>

<!-- FONCTIONS COMMUNES REBOND -->

<script src="../js/supabase.js"></script>

<script>
const videoIntro =
  document.getElementById("videoIntro");

const boutonGo =
  document.getElementById("boutonGo");

const inscriptionOverlay =
  document.getElementById("inscriptionOverlay");

const formulaireEquipe =
  document.getElementById("formulaireEquipe");

const boutonRejoindre =
  document.getElementById("boutonRejoindre");

const message =
  document.getElementById("message");

const champCode =
  document.getElementById("codeSession");

let introDemarree = false;

/* ======================================================
   LANCEMENT DE LA VIDÉO
====================================================== */

function lancerIntroduction(){

  if(introDemarree){
    return;
  }

  introDemarree = true;

  boutonGo.style.opacity = "0";
  boutonGo.style.pointerEvents = "none";

  videoIntro.classList.add(
    "visible"
  );

  videoIntro.muted = false;
  videoIntro.volume = 1;
  videoIntro.currentTime = 0;

  const lecture =
    videoIntro.play();

  if(
    lecture &&
    typeof lecture.catch === "function"
  ){

    lecture
      .then(function(){

        window.setTimeout(function(){

          boutonGo.style.display = "none";

        }, 200);

      })
      .catch(function(){

        introDemarree = false;

        videoIntro.pause();

        videoIntro.classList.remove(
          "visible"
        );

        boutonGo.style.display = "block";
        boutonGo.style.opacity = "1";
        boutonGo.style.pointerEvents = "auto";

      });

  }

}

boutonGo.addEventListener(
  "click",
  lancerIntroduction
);

boutonGo.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();
      lancerIntroduction();

    }

  }
);

/* ======================================================
   AFFICHAGE DU FORMULAIRE À LA FIN
====================================================== */

videoIntro.addEventListener(
  "ended",
  function(){

    videoIntro.pause();

    inscriptionOverlay.classList.add(
      "visible"
    );

    window.setTimeout(function(){

      champCode.focus();

    }, 80);

  }
);

/* ======================================================
   MISE EN FORME DU CODE
====================================================== */

champCode.addEventListener(
  "input",
  function(){

    champCode.value =
      champCode.value
        .toUpperCase()
        .replace(/[^A-Z0-9-]/g, "");

  }
);

/* ======================================================
   INSCRIPTION DE L’ÉQUIPE
====================================================== */

formulaireEquipe.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    message.textContent = "";
    message.className = "message";

    const code =
      champCode.value
        .trim()
        .toUpperCase();

    const equipe =
      document
        .getElementById("nomEquipe")
        .value
        .trim();

    if(
      !code ||
      !equipe
    ){

      message.className =
        "message erreur";

      message.textContent =
        "Les deux champs sont obligatoires.";

      return;

    }

    boutonRejoindre.disabled = true;

    boutonRejoindre.textContent =
      "Connexion à la session…";

    try{

      await window.REBOND_DB.rejoindreSession({
        code:code,
        equipe:equipe
      });

      message.className =
        "message succes";

      message.textContent =
        "Équipe enregistrée. Ouverture de l’énigme…";

      window.setTimeout(
        function(){

          window.location.href =
            window.REBOND_CONFIG.enigme1Url;

        },
        700
      );

    }
    catch(error){

      console.error(error);

      message.className =
        "message erreur";

      message.textContent =
        error.message ||
        "Impossible de rejoindre cette session.";

      boutonRejoindre.disabled = false;

      boutonRejoindre.textContent =
        "Commencer l’enquête";

    }

  }
);
</script>

</body>
</html>
