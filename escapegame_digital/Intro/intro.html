<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Escape Game Rebond - Introduction</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;

  background:#1b5f6e;

  font-family:Arial, Helvetica, sans-serif;
}

.page-intro{
  min-height:100vh;
  min-height:100dvh;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:20px;
}

.bloc-intro{
  position:relative;

  width:999px;
  height:716px;

  line-height:0;
  font-size:0;
}

/* ======================================================
   VIDÉO CACHÉE AU DÉPART
====================================================== */

.video-intro{
  display:none;

  width:999px;
  height:716px;

  object-fit:fill;

  border:0;
  background:#000000;
}

.video-intro.visible{
  display:block;
}

/* ======================================================
   BOUTON IMAGE CENTRAL
====================================================== */

.bouton-go{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:100;

  width:260px;
  height:auto;

  display:block;

  cursor:pointer;

  user-select:none;
  -webkit-user-drag:none;

  transition:
    transform .2s ease,
    opacity .2s ease;
}

.bouton-go:hover{
  transform:
    translate(-50%,-50%)
    scale(1.05);
}

.bouton-go:active{
  transform:
    translate(-50%,-50%)
    scale(.97);
}

.bouton-go:focus-visible{
  outline:none;
}

/* ======================================================
   FORMULAIRE DE SESSION
====================================================== */

.inscription-overlay{
  position:absolute;
  inset:0;

  z-index:150;

  display:none;
  align-items:center;
  justify-content:center;

  background:#1b5f6e;

  line-height:normal;
  font-size:16px;
}

.inscription-overlay.visible{
  display:flex;
}

/*
  La popup est affichée à environ 70 %
  de sa taille d’origine.
*/

.inscription-carte{
  position:relative;

  width:641px;
  height:auto;

  aspect-ratio:1390 / 1087;

  max-width:100%;

  background:
    transparent
    url("valid_1.png")
    center center / 100% 100%
    no-repeat;

  color:#044e61;
}

/* ======================================================
   CHAMPS RECALÉS DANS LES RECTANGLES BLANCS
====================================================== */

.champ{
  position:absolute;

  display:block;

  margin:0;
}

/*
  Champ du code de session
*/

.champ-code{
  left:9.9%;
  top:42.2%;

  width:80.2%;
  height:8.1%;
}

/*
  Champ du nom de l’équipe
*/

.champ-equipe{
  left:9.9%;
  top:64.7%;

  width:80.2%;
  height:8.1%;
}

/*
  Les intitulés sont déjà présents
  dans l’image.
*/

.champ label{
  position:absolute;

  width:1px;
  height:1px;

  margin:-1px;
  padding:0;

  overflow:hidden;

  clip:rect(0,0,0,0);
  clip-path:inset(50%);

  white-space:nowrap;

  border:0;
}

.champ input{
  display:block;

  width:100%;
  height:100%;

  margin:0;
  padding:0 16px;

  border:0;
  border-radius:14px;

  outline:none;
  box-shadow:none;

  background:transparent;
  color:#044e61;

  font-family:Arial, Helvetica, sans-serif;
  font-size:18px;
  font-weight:bold;

  line-height:1;

  -webkit-tap-highlight-color:transparent;
}

.champ input:hover,
.champ input:focus,
.champ input:focus-visible,
.champ input:active{
  border:0;
  outline:none;
  box-shadow:none;

  background:transparent;
}

.champ input::placeholder{
  color:#a9b6b9;
  opacity:1;
}

#codeSession{
  text-transform:uppercase;

  letter-spacing:2px;
  font-weight:900;
}

/* ======================================================
   BOUTON POSITIONNÉ SUR LE BOUTON ORANGE
====================================================== */

.bouton-commencer{
  position:absolute;

  left:10%;
  top:81.3%;

  width:80%;
  height:10.4%;

  margin:0;
  padding:0;

  border:0;
  border-radius:999px;

  outline:none;
  box-shadow:none;

  background:transparent;
  color:transparent;

  font-size:0;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;
}

.bouton-commencer:hover,
.bouton-commencer:focus,
.bouton-commencer:focus-visible,
.bouton-commencer:active{
  border:0;
  outline:none;
  box-shadow:none;

  background:transparent;

  transform:none;
}

.bouton-commencer:disabled{
  opacity:.55;
  cursor:wait;
}

/* ======================================================
   MESSAGE D’INFORMATION OU D’ERREUR
====================================================== */

.message{
  position:absolute;

  left:12%;
  top:75.5%;

  z-index:5;

  width:76%;
  min-height:22px;

  display:none;
  align-items:center;
  justify-content:center;

  padding:3px 10px;

  border-radius:999px;

  background:rgba(255,255,255,.95);
  color:#044e61;

  font-size:11px;
  line-height:1.25;
  font-weight:bold;

  text-align:center;

  pointer-events:none;
}

.message:not(:empty){
  display:flex;
}

.message.erreur{
  color:#b53030;
}

.message.succes{
  color:#16824a;
}

/* ======================================================
   TEXTE ACCESSIBLE MAIS INVISIBLE
====================================================== */

.visuellement-cache{
  position:absolute;

  width:1px;
  height:1px;

  margin:-1px;
  padding:0;

  overflow:hidden;

  clip:rect(0,0,0,0);
  clip-path:inset(50%);

  white-space:nowrap;

  border:0;
}

/* ======================================================
   RESPONSIVE
====================================================== */

@media screen and (max-width:1080px){

  .page-intro{
    align-items:center;
  }

}

@media screen and (max-width:760px){

  .page-intro{
    justify-content:flex-start;

    padding:12px 6px;
  }

  .bloc-intro{
    width:100%;
    height:auto;

    aspect-ratio:999 / 716;
  }

  .video-intro{
    width:100%;
    height:100%;
  }

  .inscription-carte{
    width:70%;

    max-width:641px;
  }

  .champ input{
    padding:0 2.6%;

    border-radius:10px;

    font-size:clamp(
      11px,
      2.5vw,
      18px
    );
  }

  .message{
    min-height:18px;

    padding:2px 7px;

    font-size:clamp(
      8px,
      1.5vw,
      11px
    );
  }

}

@media screen and (max-width:520px){

  .page-intro{
    padding:5px 2px;
  }

  .bouton-go{
    width:32%;
    min-width:125px;
  }

  .inscription-carte{
    width:86%;
  }

  .champ input{
    border-radius:7px;
  }

  .bouton-commencer{
    border-radius:25px;
  }

}
</style>
</head>

<body>

<div class="page-intro">

  <div class="bloc-intro">

    <video
      id="videoIntro"
      class="video-intro"
      playsinline
      webkit-playsinline
      preload="auto">

      <source
        src="https://avantpost-cpu.github.io/depot-quiz/escapegame_digital/Intro/intro.mp4"
        type="video/mp4">

    </video>

    <img
      id="boutonGo"
      class="bouton-go"
      src="https://avantpost-cpu.github.io/depot-quiz/escapegame_digital/Intro/bouton.png"
      alt="Lancer l’introduction"
      role="button"
      tabindex="0"
      draggable="false">

    <div
      id="inscriptionOverlay"
      class="inscription-overlay">

      <form
        id="formulaireEquipe"
        class="inscription-carte">

        <h1 class="visuellement-cache">
          Rejoins la partie
        </h1>

        <p class="visuellement-cache">
          Entre le code qui t’a été transmis
          et inscris ton nom ou celui de ton équipe.
        </p>

        <div class="champ champ-code">

          <label for="codeSession">
            Code de session
          </label>

          <input
            id="codeSession"
            name="codeSession"
            type="text"
            placeholder="RBD-7K42"
            autocomplete="off"
            maxlength="8"
            required>

        </div>

        <div class="champ champ-equipe">

          <label for="nomEquipe">
            Nom de l’équipe ou du participant
          </label>

          <input
            id="nomEquipe"
            name="nomEquipe"
            type="text"
            autocomplete="off"
            required>

        </div>

        <button
          id="boutonRejoindre"
          class="bouton-commencer"
          type="submit"
          aria-label="Commencer la partie">

          <span class="visuellement-cache">
            Commencer la partie
          </span>

        </button>

        <div
          id="message"
          class="message"
          aria-live="polite"></div>

      </form>

    </div>

  </div>

</div>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>

<script>
const videoIntro =
  document.getElementById(
    "videoIntro"
  );

const boutonGo =
  document.getElementById(
    "boutonGo"
  );

const inscriptionOverlay =
  document.getElementById(
    "inscriptionOverlay"
  );

const formulaireEquipe =
  document.getElementById(
    "formulaireEquipe"
  );

const boutonRejoindre =
  document.getElementById(
    "boutonRejoindre"
  );

const message =
  document.getElementById(
    "message"
  );

const champCode =
  document.getElementById(
    "codeSession"
  );

const champEquipe =
  document.getElementById(
    "nomEquipe"
  );

let introDemarree = false;

/* ======================================================
   LANCEMENT DE LA VIDÉO
====================================================== */

function lancerIntroduction(){

  if(introDemarree){
    return;
  }

  introDemarree = true;

  boutonGo.style.opacity =
    "0";

  boutonGo.style.pointerEvents =
    "none";

  videoIntro.classList.add(
    "visible"
  );

  videoIntro.muted = false;
  videoIntro.volume = 1;
  videoIntro.currentTime = 0;

  const lecture =
    videoIntro.play();

  if(
    lecture &&
    typeof lecture.catch ===
    "function"
  ){

    lecture
      .then(function(){

        window.setTimeout(
          function(){

            boutonGo.style.display =
              "none";

          },
          200
        );

      })
      .catch(function(){

        introDemarree = false;

        videoIntro.pause();

        videoIntro.classList.remove(
          "visible"
        );

        boutonGo.style.display =
          "block";

        boutonGo.style.opacity =
          "1";

        boutonGo.style.pointerEvents =
          "auto";

      });

  }

}

boutonGo.addEventListener(
  "click",
  lancerIntroduction
);

boutonGo.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" ||
      event.key === " "
    ){

      event.preventDefault();

      lancerIntroduction();

    }

  }
);

/* ======================================================
   AFFICHAGE DU FORMULAIRE À LA FIN
====================================================== */

videoIntro.addEventListener(
  "ended",
  function(){

    videoIntro.pause();

    inscriptionOverlay.classList.add(
      "visible"
    );

    window.setTimeout(
      function(){

        champCode.focus();

      },
      80
    );

  }
);

/* ======================================================
   MISE EN FORME DU CODE
====================================================== */

champCode.addEventListener(
  "input",
  function(){

    champCode.value =
      champCode.value
        .toUpperCase()
        .replace(
          /[^A-Z0-9-]/g,
          ""
        );

  }
);

/* ======================================================
   INSCRIPTION DE L’ÉQUIPE
====================================================== */

formulaireEquipe.addEventListener(
  "submit",
  async function(event){

    event.preventDefault();

    message.textContent =
      "";

    message.className =
      "message";

    const code =
      champCode.value
        .trim()
        .toUpperCase();

    const equipe =
      champEquipe.value
        .trim();

    if(
      !code ||
      !equipe
    ){

      message.className =
        "message erreur";

      message.textContent =
        "Les deux champs sont obligatoires.";

      return;

    }

    boutonRejoindre.disabled =
      true;

    message.className =
      "message";

    message.textContent =
      "Connexion à la session…";

    try{

      await window.REBOND_DB
        .rejoindreSession({
          code:code,
          equipe:equipe
        });

      message.className =
        "message succes";

      message.textContent =
        "Équipe enregistrée. Ouverture de l’énigme…";

      window.setTimeout(
        function(){

          window.location.href =
            window.REBOND_CONFIG
              .enigme1Url;

        },
        700
      );

    }
    catch(error){

      console.error(error);

      message.className =
        "message erreur";

      message.textContent =
        error.message ||
        "Impossible de rejoindre cette session.";

      boutonRejoindre.disabled =
        false;

    }

  }
);
</script>

</body>
</html>
