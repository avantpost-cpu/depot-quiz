<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escape Game Rebond - Introduction</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#1b5f6e;
  font-family:Arial, Helvetica, sans-serif;
}

.page-intro{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding-top:40px;
}

.bloc-intro{
  position:relative;
  width:999px;
  height:716px;
}

.video-intro{
  display:block;
  width:999px;
  height:716px;
  object-fit:fill;
  background:#000;
}

/* Flèche */

.next-arrow{
  position:fixed;
  top:50%;
  right:35px;
  transform:translateY(-50%) translateX(12px);

  font-size:62px;
  font-weight:200;

  color:#fff;
  text-decoration:none;

  opacity:0;
  pointer-events:none;

  transition:.35s;

  z-index:999;
}

.next-arrow.visible{
  opacity:.45;
  pointer-events:auto;
  transform:translateY(-50%) translateX(0);
}

.next-arrow:hover{
  opacity:1;
  transform:translateY(-50%) translateX(6px);
}
</style>

</head>

<body>

<div class="page-intro">

<div class="bloc-intro">

<video
id="videoIntro"
class="video-intro"
autoplay
muted
playsinline
webkit-playsinline
preload="auto">

<source
src="https://avantpost-cpu.github.io/depot-quiz/escapegame_digital/intro/intro.mp4"
type="video/mp4">

</video>

</div>

</div>

<a
href="../enigme1.html"
class="next-arrow"
id="nextBtn">

→

</a>

<script>

const videoIntro =
document.getElementById("videoIntro");

const nextBtn =
document.getElementById("nextBtn");

/* Certains navigateurs nécessitent une relance */

videoIntro.addEventListener("loadeddata",()=>{

    const p = videoIntro.play();

    if(p){
        p.catch(()=>{});
    }

});

/* Fin de vidéo */

videoIntro.addEventListener("ended",()=>{

    nextBtn.classList.add("visible");

});

</script>

</body>
</html>
