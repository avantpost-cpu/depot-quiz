<script>
const parametres =
  new URLSearchParams(
    window.location.search
  );

const code =
  parametres.get("code");

const cleGestion =
  parametres.get("cle");

const message =
  document.getElementById("message");

const documentCompteRendu =
  document.getElementById("document");

const retourSuivi =
  document.getElementById("retourSuivi");

const boutonImprimer =
  document.getElementById("imprimer");

const boutonEnvoyerEmail =
  document.getElementById("envoyerEmail");

const envoiAutomatique =
  parametres.get("autoEmail") === "1";

const destinataireAutomatique =
  String(
    parametres.get("destinataire") ||
    ""
  )
    .trim()
    .toLowerCase();

const modeIntegre =
  parametres.get("modeIntegre") === "1";

let sessionCourante = null;
let envoiDejaLance = false;

function afficherDate(dateBrute){

  if(!dateBrute){
    return "—";
  }

  return new Date(
    dateBrute + "T12:00:00"
  ).toLocaleDateString(
    "fr-FR",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}

function afficherDureeCourte(secondes){

  if(
    secondes === null ||
    secondes === undefined
  ){
    return "—";
  }

  const total =
    Math.max(
      0,
      Number(secondes)
    );

  const heures =
    Math.floor(total / 3600);

  const minutes =
    Math.floor(
      (total % 3600) / 60
    );

  const reste =
    total % 60;

  if(heures > 0){

    return (
      heures +
      " h " +
      String(minutes).padStart(2,"0")
    );

  }

  if(minutes > 0){

    return (
      minutes +
      " min " +
      String(reste).padStart(2,"0")
    );

  }

  return reste + " s";

}

function creerNumeroBilan(
  codeSession,
  dateSession
){

  const annee =
    dateSession
      ? String(dateSession).slice(0,4)
      : new Date().getFullYear();

  const suffixe =
    String(codeSession || "")
      .replace("RBD-","")
      .toUpperCase();

  return (
    "RB-" +
    annee +
    "-" +
    suffixe
  );

}

function calculerStatistiques(
  donnees
){

  const equipes =
    donnees.filter(
      function(ligne){
        return Boolean(
          ligne.team_name
        );
      }
    );

  const terminees =
    equipes.filter(
      function(equipe){
        return equipe.completed === true;
      }
    );

  const durees =
    terminees
      .map(
        function(equipe){
          return equipe.duration_seconds;
        }
      )
      .filter(
        function(duree){
          return (
            duree !== null &&
            duree !== undefined
          );
        }
      )
      .map(Number);

  const moyenne =
    durees.length
      ? Math.round(
          durees.reduce(
            function(total,duree){
              return total + duree;
            },
            0
          ) / durees.length
        )
      : null;

  const taux =
    equipes.length
      ? Math.round(
          terminees.length /
          equipes.length *
          100
        )
      : 0;

  const minimum =
    durees.length
      ? Math.min(...durees)
      : null;

  const maximum =
    durees.length
      ? Math.max(...durees)
      : null;

  return {
    equipes,
    terminees,
    durees,
    moyenne,
    taux,
    minimum,
    maximum,
    ecart:
      minimum !== null &&
      maximum !== null
        ? maximum - minimum
        : null
  };

}

function echapperHTML(valeur){

  const element =
    document.createElement("div");

  element.textContent =
    String(valeur ?? "");

  return element.innerHTML;

}

async function chargerCompteRendu(){

  if(
    !code ||
    !cleGestion
  ){

    message.className =
      "message erreur";

    message.textContent =
      "Le lien du compte rendu est incomplet.";

    return;

  }

  const adresseSuivi =
    new URL(
      "suivi-session.html",
      window.location.href
    );

  adresseSuivi.searchParams.set(
    "code",
    code
  );

  adresseSuivi.searchParams.set(
    "cle",
    cleGestion
  );

  retourSuivi.href =
    adresseSuivi.toString();

  try{

    const donnees =
      await window.REBOND_DB.chargerSuivi({
        code,
        cleGestion
      });

    if(
      !donnees ||
      donnees.length === 0
    ){

      throw new Error(
        "Aucune donnée reçue pour cette session."
      );

    }

    const session =
      donnees[0];

    sessionCourante =
      session;

    const stats =
      calculerStatistiques(
        donnees
      );

    document
      .getElementById("numeroBilan")
      .textContent =
        creerNumeroBilan(
          code,
          session.session_date
        );

    document
      .getElementById("etablissement")
      .textContent =
        session.school_name || "—";

    document
      .getElementById("classe")
      .textContent =
        session.class_name || "—";

    document
      .getElementById("codeSession")
      .textContent =
        code;

    document
      .getElementById("enseignant")
      .textContent =
        session.teacher_name || "—";

    document
      .getElementById("dateSession")
      .textContent =
        afficherDate(
          session.session_date
        );

    document
      .getElementById("nombreEleves")
      .textContent =
        session.student_count ?? "—";

    document
      .getElementById("nombreEquipes")
      .textContent =
        stats.equipes.length;

    document
      .getElementById("tempsMoyenP1")
      .textContent =
        afficherDureeCourte(
          stats.moyenne
        );

    document
      .getElementById("tauxReussiteP1")
      .textContent =
        stats.taux + " %";

    document
      .getElementById("nombreElevesP2")
      .textContent =
        session.student_count ?? "—";

    document
      .getElementById("nombreEquipesP2")
      .textContent =
        stats.equipes.length;

    document
      .getElementById("tempsMoyenP2")
      .textContent =
        afficherDureeCourte(
          stats.moyenne
        );

    document
      .getElementById("tauxReussiteP2")
      .textContent =
        stats.taux + " %";

    const lignesEquipes =
      document.getElementById(
        "lignesEquipes"
      );

    lignesEquipes.innerHTML = "";

    stats.equipes
      .slice(0,8)
      .forEach(
        function(equipe){

          const ligne =
            document.createElement("div");

          ligne.className =
            "p2-ligne";

          const temps =
            equipe.duration_seconds !== null &&
            equipe.duration_seconds !== undefined
              ? afficherDureeCourte(
                  equipe.duration_seconds
                )
              : "—";

          const progression =
            equipe.completed
              ? "100 %"
              : "En cours";

          const statut =
            equipe.completed
              ? "Terminée"
              : "En cours";

          ligne.innerHTML = `
            <span>${echapperHTML(equipe.team_name)}</span>
            <span>${echapperHTML(temps)}</span>
            <span>${echapperHTML(progression)}</span>
            <span class="p2-statut">${echapperHTML(statut)}</span>
          `;

          lignesEquipes.appendChild(
            ligne
          );

        }
      );

    const graphique =
      document.getElementById(
        "graphiqueEquipes"
      );

    graphique.innerHTML = "";

    const dureeMax =
      Math.max(
        ...stats.equipes.map(
          function(equipe){
            return Number(
              equipe.duration_seconds || 0
            );
          }
        ),
        1
      );

    stats.equipes
      .filter(
        function(equipe){
          return (
            equipe.duration_seconds !== null &&
            equipe.duration_seconds !== undefined
          );
        }
      )
      .slice(0,6)
      .forEach(
        function(equipe){

          const largeur =
            Math.max(
              3,
              Math.round(
                Number(
                  equipe.duration_seconds
                ) /
                dureeMax *
                100
              )
            );

          const ligne =
            document.createElement("div");

          ligne.className =
            "barre-ligne";

          ligne.innerHTML = `
            <span>${echapperHTML(equipe.team_name)}</span>
            <span class="barre-fond">
              <span
                class="barre-valeur"
                style="width:${largeur}%">
              </span>
            </span>
            <span>${echapperHTML(
              afficherDureeCourte(
                equipe.duration_seconds
              )
            )}</span>
          `;

          graphique.appendChild(
            ligne
          );

        }
      );

    const phraseTerminees =
      stats.equipes.length > 0 &&
      stats.terminees.length ===
      stats.equipes.length
        ? "Toutes les équipes ont terminé."
        : (
            stats.terminees.length +
            " équipe(s) sur " +
            stats.equipes.length +
            " ont terminé."
          );

    document
      .getElementById("resumeSession")
      .innerHTML = `
        <strong>Lecture rapide</strong>
        ${echapperHTML(phraseTerminees)}<br>
        Temps moyen :
        ${echapperHTML(
          afficherDureeCourte(
            stats.moyenne
          )
        )}.<br>
        Écart maximal :
        ${echapperHTML(
          afficherDureeCourte(
            stats.ecart
          )
        )}.
      `;

    document.title =
      "Bilan Rebond — " +
      (session.school_name || "") +
      " — " +
      (session.class_name || "");

    message.style.display =
      "none";

    documentCompteRendu.hidden =
      false;

    if(
      envoiAutomatique &&
      !envoiDejaLance
    ){

      envoiDejaLance = true;

      window.setTimeout(
        envoyerCompteRenduParEmail,
        350
      );

    }

  }
  catch(error){

    console.error(error);

    message.className =
      "message erreur";

    message.textContent =
      error.message ||
      "Impossible de générer le compte rendu.";

  }

}

function nettoyerNomFichier(valeur){

  return String(valeur || "bilan-rebond")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9_-]+/g, "-")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "")
    .toLowerCase();

}

async function attendreRessources(){

  if(document.fonts){
    await document.fonts.ready;
  }

  const images =
    Array.from(
      document.querySelectorAll(
        ".page img"
      )
    );

  await Promise.all(
    images.map(
      function(image){

        if(image.complete){
          return Promise.resolve();
        }

        return new Promise(
          function(resolve){

            image.addEventListener(
              "load",
              resolve,
              {once:true}
            );

            image.addEventListener(
              "error",
              resolve,
              {once:true}
            );

          }
        );

      }
    )
  );

}

async function genererPDF(){

  if(
    !window.html2canvas ||
    !window.jspdf ||
    !window.jspdf.jsPDF
  ){
    throw new Error(
      "Les outils de génération du PDF ne sont pas chargés."
    );
  }

  await attendreRessources();

  const pages =
    Array.from(
      document.querySelectorAll(
        ".page"
      )
    );

  if(pages.length === 0){
    throw new Error(
      "Aucune page du compte rendu n’a été trouvée."
    );
  }

  const jsPDF =
    window.jspdf.jsPDF;

  const pdf =
    new jsPDF({
      orientation:"portrait",
      unit:"mm",
      format:"a4",
      compress:true
    });

  for(
    let index = 0;
    index < pages.length;
    index += 1
  ){

    if(index > 0){
      pdf.addPage("a4","portrait");
    }

    const canvas =
      await window.html2canvas(
        pages[index],
        {
          scale:1.55,
          useCORS:true,
          allowTaint:false,
          backgroundColor:"#ffffff",
          logging:false,
          imageTimeout:15000,
          windowWidth:980
        }
      );

    const image =
      canvas.toDataURL(
        "image/jpeg",
        .84
      );

    pdf.addImage(
      image,
      "JPEG",
      0,
      0,
      210,
      297,
      undefined,
      "FAST"
    );

  }

  const nomStructure =
    sessionCourante &&
    sessionCourante.school_name
      ? sessionCourante.school_name
      : "rebond";

  const nomClasse =
    sessionCourante &&
    sessionCourante.class_name
      ? sessionCourante.class_name
      : code;

  const nomFichier =
    nettoyerNomFichier(
      "bilan-rebond-" +
      nomStructure +
      "-" +
      nomClasse
    ) +
    ".pdf";

  const dataUri =
    pdf.output(
      "datauristring"
    );

  const pdfBase64 =
    dataUri.split(",")[1];

  if(!pdfBase64){
    throw new Error(
      "Le fichier PDF n’a pas pu être encodé."
    );
  }

  return {
    pdf:pdf,
    pdfBase64:pdfBase64,
    nomFichier:nomFichier
  };

}

function obtenirEmailEncadrant(){

  if(
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(destinataireAutomatique)
  ){
    return destinataireAutomatique;
  }

  const emailSession =
    sessionCourante
      ? String(
          sessionCourante.organizer_email ||
          sessionCourante.teacher_email ||
          sessionCourante.email ||
          ""
        ).trim()
      : "";

  if(
    /^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(emailSession)
  ){
    return emailSession;
  }

  const emailSaisi =
    window.prompt(
      "Adresse e-mail à laquelle envoyer le compte rendu :",
      emailSession
    );

  return String(
    emailSaisi || ""
  ).trim();

}

async function envoyerCompteRenduParEmail(){

  if(
    !code ||
    !cleGestion
  ){
    message.className =
      "message erreur";

    message.textContent =
      "Le lien du compte rendu est incomplet.";

    message.style.display =
      "block";

    return;
  }

  const destinataire =
    obtenirEmailEncadrant();

  if(
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/
      .test(destinataire)
  ){
    message.className =
      "message erreur";

    message.textContent =
      "L’adresse e-mail est absente ou invalide.";

    message.style.display =
      "block";

    return;
  }

  boutonEnvoyerEmail.disabled =
    true;

  boutonImprimer.disabled =
    true;

  boutonEnvoyerEmail.textContent =
    "Création du PDF…";

  message.className =
    "message";

  message.textContent =
    "Création du PDF et envoi en cours…";

  message.style.display =
    "block";

  try{

    const fichier =
      await genererPDF();

    boutonEnvoyerEmail.textContent =
      "Envoi du PDF…";

    const {
      data,
      error
    } =
      await window.REBOND_DB
        .client
        .functions
        .invoke(
          "envoyer-compte-rendu",
          {
            body:{
              code:code,
              cleGestion:cleGestion,
              destinataire:destinataire,
              pdfBase64:fichier.pdfBase64,
              nomFichier:fichier.nomFichier
            }
          }
        );

    if(error){
      throw error;
    }

    if(
      !data ||
      data.success !== true
    ){
      throw new Error(
        data && data.message
          ? data.message
          : "L’envoi du compte rendu a échoué."
      );
    }

    message.className =
      "message";

    message.style.color =
      "#16824a";

    message.textContent =
      "Le PDF a bien été envoyé à " +
      destinataire +
      " ✓";

    boutonEnvoyerEmail.textContent =
      "PDF envoyé ✓";

    if(
      modeIntegre &&
      window.parent !== window
    ){

      window.parent.postMessage(
        {
          type:
            "rebond-compte-rendu-envoye",

          destinataire:
            destinataire
        },
        window.location.origin
      );

    }

  }
  catch(error){

    console.error(error);

    message.className =
      "message erreur";

    message.style.color =
      "";

    message.textContent =
      error.message ||
      "Impossible de générer ou d’envoyer le PDF.";

    boutonEnvoyerEmail.textContent =
      "Envoyer le PDF par e-mail";

    if(
      modeIntegre &&
      window.parent !== window
    ){

      window.parent.postMessage(
        {
          type:
            "rebond-compte-rendu-erreur",

          message:
            error.message ||
            "Impossible de générer ou d’envoyer le PDF."
        },
        window.location.origin
      );

    }

  }
  finally{

    boutonEnvoyerEmail.disabled =
      false;

    boutonImprimer.disabled =
      false;

  }

}

boutonImprimer.addEventListener(
  "click",
  async function(){

    boutonImprimer.disabled =
      true;

    const texteInitial =
      boutonImprimer.textContent;

    boutonImprimer.textContent =
      "Création du PDF…";

    try{

      const fichier =
        await genererPDF();

      fichier.pdf.save(
        fichier.nomFichier
      );

    }
    catch(error){

      console.error(error);

      message.className =
        "message erreur";

      message.textContent =
        error.message ||
        "Impossible de créer le PDF.";

      message.style.display =
        "block";

    }
    finally{

      boutonImprimer.disabled =
        false;

      boutonImprimer.textContent =
        texteInitial;

    }

  }
);

boutonEnvoyerEmail.addEventListener(
  "click",
  envoyerCompteRenduParEmail
);

chargerCompteRendu()
  .then(
    function(){

      if(
        envoiAutomatique &&
        !envoiDejaLance
      ){

        envoiDejaLance =
          true;

        window.setTimeout(
          envoyerCompteRenduParEmail,
          350
        );

      }

    }
  )
  .catch(
    function(error){

      console.error(error);

      if(
        modeIntegre &&
        window.parent !== window
      ){

        window.parent.postMessage(
          {
            type:
              "rebond-compte-rendu-erreur",

            message:
              error.message ||
              "Impossible de charger le compte rendu."
          },
          window.location.origin
        );

      }

    }
  );
</script>
