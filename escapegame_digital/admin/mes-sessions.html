<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rebond — Sessions Escape Game</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#1b5f6e;
  font-family:Arial, Helvetica, sans-serif;
  color:#044e61;
}

body{
  padding:36px 18px;
}

.page{
  width:100%;
  max-width:1040px;
  margin:0 auto;
}

.entete{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:22px;
  margin-bottom:24px;
}

.entete h1{
  margin-bottom:8px;
  color:#ffffff;
  font-size:36px;
  line-height:1.1;
}

.entete p{
  color:rgba(255,255,255,.82);
  font-size:16px;
  line-height:1.45;
}

.compte{
  flex:0 0 auto;
  text-align:right;
}

.email{
  margin-bottom:10px;
  color:#ffffff;
  font-size:14px;
  font-weight:bold;
}

.bouton-deconnexion{
  min-height:42px;
  padding:8px 18px;
  border:1px solid rgba(255,255,255,.65);
  border-radius:999px;
  background:transparent;
  color:#ffffff;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.bouton-deconnexion:hover{
  background:rgba(255,255,255,.12);
}

.barre-actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  margin-bottom:22px;
}

.bouton-principal{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:52px;
  padding:11px 24px;
  border:0;
  border-radius:999px;
  background:#edb01a;
  color:#044e61;
  font-size:17px;
  font-weight:bold;
  text-decoration:none;
  cursor:pointer;
}

.bouton-secondaire{
  min-height:46px;
  padding:9px 20px;
  border:0;
  border-radius:999px;
  background:#ffffff;
  color:#044e61;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.bouton-secondaire:disabled{
  opacity:.55;
  cursor:wait;
}

.message{
  display:none;
  margin-bottom:20px;
  padding:16px 18px;
  border-radius:14px;
  font-weight:bold;
  line-height:1.4;
}

.message.visible{
  display:block;
}

.message.succes{
  background:#e4f4e9;
  color:#16824a;
}

.message.erreur{
  background:#f8e3e3;
  color:#a52d2d;
}

.message.information{
  background:#eaf5f2;
  color:#044e61;
}

.resume-global{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  margin-bottom:22px;
}

.indicateur{
  padding:20px;
  border-radius:18px;
  background:#ffffff;
}

.indicateur .libelle{
  display:block;
  margin-bottom:7px;
  color:#56747b;
  font-size:14px;
  font-weight:bold;
}

.indicateur .valeur{
  display:block;
  color:#044e61;
  font-size:34px;
  line-height:1;
  font-weight:900;
}

.liste{
  display:grid;
  gap:16px;
}

.session{
  padding:22px;
  border-radius:20px;
  background:#ffffff;
}

.session-entete{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:18px;
  margin-bottom:18px;
}

.session-titre{
  min-width:0;
}

.session-titre h2{
  margin-bottom:6px;
  font-size:23px;
  line-height:1.2;
}

.session-date{
  color:#60777d;
  font-size:14px;
}

.code{
  flex:0 0 auto;
  padding:9px 14px;
  border-radius:12px;
  background:#eaf5f2;
  color:#044e61;
  font-size:18px;
  font-weight:900;
  letter-spacing:1.5px;
}

.session-infos{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
  gap:16px;
  margin-bottom:18px;
}

.info{
  min-width:0;
}

.info .label{
  display:block;
  margin-bottom:5px;
  color:#6b7f84;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.info .contenu{
  display:block;
  overflow-wrap:anywhere;
  color:#244f58;
  font-size:15px;
  font-weight:bold;
}

.progression{
  display:flex;
  align-items:center;
  gap:14px;
}

.barre{
  flex:1;
  height:10px;
  overflow:hidden;
  border-radius:999px;
  background:#dfe9eb;
}

.remplissage{
  height:100%;
  width:0;
  border-radius:999px;
  background:#18A558;
}

.texte-progression{
  flex:0 0 auto;
  color:#476b73;
  font-size:14px;
  font-weight:bold;
}

.vide{
  display:none;
  padding:34px 24px;
  border-radius:20px;
  background:#ffffff;
  color:#56747b;
  text-align:center;
  line-height:1.5;
}

.vide.visible{
  display:block;
}

.chargement{
  display:none;
  padding:34px 24px;
  border-radius:20px;
  background:#ffffff;
  color:#56747b;
  text-align:center;
  font-weight:bold;
}

.chargement.visible{
  display:block;
}

@media screen and (max-width:760px){

  body{
    padding:22px 12px;
  }

  .entete{
    flex-direction:column;
  }

  .compte{
    width:100%;
    text-align:left;
  }

  .barre-actions{
    flex-direction:column;
    align-items:stretch;
  }

  .bouton-principal,
  .bouton-secondaire{
    width:100%;
  }

  .resume-global{
    grid-template-columns:1fr;
  }

  .session-entete{
    flex-direction:column;
  }

  .session-infos{
    grid-template-columns:1fr;
  }

  .progression{
    align-items:flex-start;
    flex-direction:column;
  }

  .barre{
    width:100%;
  }

}
</style>
</head>

<body>

<main class="page">

  <header class="entete">

    <div>

      <h1>Sessions Escape Game</h1>

      <p>
        Tableau de bord réservé à Rebond :
        suivi des écoles, classes et équipes participantes.
      </p>

    </div>

    <div class="compte">

      <div
        id="emailConnecte"
        class="email">
      </div>

      <button
        id="boutonDeconnexion"
        class="bouton-deconnexion"
        type="button">
        Se déconnecter
      </button>

    </div>

  </header>

  <div class="barre-actions">

    <a
      class="bouton-principal"
      href="creer-session.html">
      Créer une nouvelle session
    </a>

    <button
      id="boutonActualiser"
      class="bouton-secondaire"
      type="button">
      Actualiser les données
    </button>

  </div>

  <div
    id="message"
    class="message"
    aria-live="polite">
  </div>

  <section
    id="resumeGlobal"
    class="resume-global"
    aria-label="Résumé global">

    <div class="indicateur">

      <span class="libelle">
        Sessions
      </span>

      <span
        id="totalSessions"
        class="valeur">
        0
      </span>

    </div>

    <div class="indicateur">

      <span class="libelle">
        Équipes inscrites
      </span>

      <span
        id="totalEquipes"
        class="valeur">
        0
      </span>

    </div>

    <div class="indicateur">

      <span class="libelle">
        Équipes terminées
      </span>

      <span
        id="totalTerminees"
        class="valeur">
        0
      </span>

    </div>

  </section>

  <div
    id="chargement"
    class="chargement visible">
    Chargement des sessions…
  </div>

  <section
    id="listeSessions"
    class="liste">
  </section>

  <div
    id="aucuneSession"
    class="vide">
    Aucune session n’a encore été créée.
  </div>

</main>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="../js/config.js"></script>

<script>
const client =
  window.supabase.createClient(
    window.REBOND_CONFIG.supabaseUrl,
    window.REBOND_CONFIG.supabaseKey
  );

const emailConnecte =
  document.getElementById("emailConnecte");

const boutonDeconnexion =
  document.getElementById("boutonDeconnexion");

const boutonActualiser =
  document.getElementById("boutonActualiser");

const message =
  document.getElementById("message");

const chargement =
  document.getElementById("chargement");

const listeSessions =
  document.getElementById("listeSessions");

const aucuneSession =
  document.getElementById("aucuneSession");

const totalSessions =
  document.getElementById("totalSessions");

const totalEquipes =
  document.getElementById("totalEquipes");

const totalTerminees =
  document.getElementById("totalTerminees");

function afficherMessage(
  texte,
  type
){

  message.textContent =
    texte;

  message.className =
    "message visible " + type;

}

function masquerMessage(){

  message.textContent = "";
  message.className = "message";

}

function afficherDate(
  dateBrute
){

  if(!dateBrute){
    return "Date non renseignée";
  }

  const date =
    new Date(
      dateBrute + "T12:00:00"
    );

  return date.toLocaleDateString(
    "fr-FR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}

function creerElementSession(
  session
){

  const article =
    document.createElement("article");

  article.className =
    "session";

  const total =
    Number(
      session.teams_count || 0
    );

  const terminees =
    Number(
      session.completed_count || 0
    );

  const pourcentage =
    total > 0
      ? Math.round(
          (terminees / total) * 100
        )
      : 0;

  article.innerHTML = `
    <div class="session-entete">

      <div class="session-titre">

        <h2>
          ${echapperHTML(session.school_name)}
        </h2>

        <div class="session-date">
          ${afficherDate(session.session_date)}
        </div>

      </div>

      <div class="code">
        ${echapperHTML(session.session_code)}
      </div>

    </div>

    <div class="session-infos">

      <div class="info">

        <span class="label">
          Classe
        </span>

        <span class="contenu">
          ${echapperHTML(session.class_name)}
        </span>

      </div>

      <div class="info">

        <span class="label">
          E-mail adulte
        </span>

        <span class="contenu">
          ${echapperHTML(session.organizer_email)}
        </span>

      </div>

      <div class="info">

        <span class="label">
          Équipes
        </span>

        <span class="contenu">
          ${total}
        </span>

      </div>

    </div>

    <div class="progression">

      <div
        class="barre"
        aria-label="${terminees} équipe(s) terminée(s) sur ${total}">

        <div
          class="remplissage"
          style="width:${pourcentage}%">
        </div>

      </div>

      <div class="texte-progression">
        ${terminees} terminée(s) sur ${total}
      </div>

    </div>
  `;

  return article;

}

function echapperHTML(
  valeur
){

  const element =
    document.createElement("div");

  element.textContent =
    String(valeur ?? "");

  return element.innerHTML;

}

async function verifierConnexion(){

  const {
    data:{
      session
    },
    error
  } =
    await client.auth.getSession();

  if(error){
    throw error;
  }

  if(!session){

    window.location.href =
      "connexion.html";

    return null;

  }

  emailConnecte.textContent =
    session.user.email;

  return session;

}

async function chargerSessions(){

  boutonActualiser.disabled = true;

  chargement.classList.add(
    "visible"
  );

  aucuneSession.classList.remove(
    "visible"
  );

  listeSessions.innerHTML = "";

  masquerMessage();

  try{

    const session =
      await verifierConnexion();

    if(!session){
      return;
    }

    const {
      data,
      error
    } =
      await client.rpc(
        "rebond_admin_sessions"
      );

    if(error){
      throw error;
    }

    const sessions =
      Array.isArray(data)
        ? data
        : [];

    const nombreSessions =
      sessions.length;

    const nombreEquipes =
      sessions.reduce(
        function(total, item){

          return total +
            Number(item.teams_count || 0);

        },
        0
      );

    const nombreTerminees =
      sessions.reduce(
        function(total, item){

          return total +
            Number(item.completed_count || 0);

        },
        0
      );

    totalSessions.textContent =
      nombreSessions;

    totalEquipes.textContent =
      nombreEquipes;

    totalTerminees.textContent =
      nombreTerminees;

    if(nombreSessions === 0){

      aucuneSession.classList.add(
        "visible"
      );

      return;

    }

    sessions.forEach(
      function(session){

        listeSessions.appendChild(
          creerElementSession(session)
        );

      }
    );

    afficherMessage(
      "Les données ont été actualisées.",
      "succes"
    );

  }
  catch(error){

    console.error(error);

    afficherMessage(
      error.message ||
      "Impossible de charger les sessions.",
      "erreur"
    );

  }
  finally{

    chargement.classList.remove(
      "visible"
    );

    boutonActualiser.disabled = false;

  }

}

boutonActualiser.addEventListener(
  "click",
  chargerSessions
);

boutonDeconnexion.addEventListener(
  "click",
  async function(){

    boutonDeconnexion.disabled = true;

    try{

      await client.auth.signOut();

      window.location.href =
        "connexion.html";

    }
    catch(error){

      console.error(error);

      afficherMessage(
        "La déconnexion a échoué.",
        "erreur"
      );

      boutonDeconnexion.disabled = false;

    }

  }
);

chargerSessions();
</script>

</body>
</html>
