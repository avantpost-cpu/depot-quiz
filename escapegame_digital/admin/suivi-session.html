<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rebond — Suivi de la session</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#1b5f6e;
  font-family:Arial, Helvetica, sans-serif;
  color:#044e61;
}

body{
  padding:40px 18px;
}

.page{
  width:100%;
  max-width:940px;
  margin:0 auto;
}

.carte{
  width:100%;
  padding:34px;
  background:#ffffff;
  border-radius:24px;
}

h1{
  margin-bottom:12px;
  font-size:34px;
  line-height:1.1;
}

.introduction{
  color:#476b73;
  font-size:17px;
  line-height:1.5;
}

.resume{
  display:none;
  margin-top:25px;
  padding:22px;
  border-radius:18px;
  background:#eaf5f2;
}

.resume.visible{
  display:block;
}

.resume h2{
  margin-bottom:14px;
  font-size:25px;
}

.grille-infos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.info{
  padding:14px;
  border-radius:12px;
  background:#ffffff;
}

.info-label{
  display:block;
  margin-bottom:5px;
  color:#688086;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
}

.info-valeur{
  display:block;
  color:#044e61;
  font-size:17px;
  font-weight:bold;
}

.indicateurs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:16px;
}

.indicateur{
  padding:16px 12px;
  border-radius:14px;
  background:#044e61;
  color:#ffffff;
  text-align:center;
}

.indicateur:nth-child(2){
  background:#edb01a;
  color:#044e61;
}

.indicateur strong{
  display:block;
  font-size:26px;
}

.indicateur span{
  display:block;
  margin-top:4px;
  font-size:13px;
  font-weight:bold;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:24px;
}

.bouton{
  width:100%;
  min-height:56px;
  padding:12px 22px;
  border:0;
  border-radius:999px;
  background:#edb01a;
  color:#044e61;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.bouton-compte-rendu{
  background:#044e61;
  color:#ffffff;
}

.bouton:disabled{
  opacity:.55;
  cursor:wait;
}

.message{
  min-height:24px;
  margin-top:18px;
  font-size:15px;
  font-weight:bold;
}

.message.erreur{
  color:#b53030;
}

.message.succes{
  color:#16824a;
}

.tableau-wrapper{
  width:100%;
  margin-top:26px;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:14px 10px;
  border-bottom:1px solid #d6e3e6;
  text-align:left;
  white-space:nowrap;
}

th{
  color:#476b73;
  font-size:13px;
  text-transform:uppercase;
}

.statut{
  font-weight:bold;
}

.statut.terminee{
  color:#16824a;
}

.statut.encours{
  color:#a46b00;
}

.aucune-equipe{
  display:none;
  margin-top:25px;
  padding:22px;
  border-radius:16px;
  background:#f3f6f6;
  color:#56747b;
  text-align:center;
}

.aucune-equipe.visible{
  display:block;
}

@media screen and (max-width:720px){

  body{
    padding:18px 12px;
  }

  .carte{
    padding:25px 18px;
  }

  .grille-infos,
  .indicateurs,
  .actions{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<main class="page">

  <section class="carte">

    <h1>Suivi de la session</h1>

    <p class="introduction">
      Consulte les équipes, leurs horaires
      et leur durée de jeu.
    </p>

    <section id="resume" class="resume">

      <h2 id="nomEcole"></h2>

      <div class="grille-infos">

        <div class="info">
          <span class="info-label">Classe</span>
          <span id="nomClasse" class="info-valeur"></span>
        </div>

        <div class="info">
          <span class="info-label">Enseignant·e</span>
          <span id="nomEnseignant" class="info-valeur"></span>
        </div>

        <div class="info">
          <span class="info-label">Nombre d’élèves</span>
          <span id="nombreEleves" class="info-valeur"></span>
        </div>

        <div class="info">
          <span class="info-label">Date</span>
          <span id="dateSession" class="info-valeur"></span>
        </div>

        <div class="info">
          <span class="info-label">Code</span>
          <span id="codeSession" class="info-valeur"></span>
        </div>

      </div>

      <div class="indicateurs">

        <div class="indicateur">
          <strong id="nombreEquipes">0</strong>
          <span>équipes inscrites</span>
        </div>

        <div class="indicateur">
          <strong id="nombreTerminees">0</strong>
          <span>équipes terminées</span>
        </div>

        <div class="indicateur">
          <strong id="tempsMoyen">—</strong>
          <span>temps moyen</span>
        </div>

      </div>

    </section>

    <div class="actions">

      <button
        id="boutonActualiser"
        class="bouton"
        type="button">
        Actualiser le suivi
      </button>

      <a
        id="boutonCompteRendu"
        class="bouton bouton-compte-rendu"
        href="#">
        Générer le compte rendu
      </a>

    </div>

    <div
      id="message"
      class="message"
      aria-live="polite">
    </div>

    <div class="tableau-wrapper">

      <table id="tableauEquipes">

        <thead>
          <tr>
            <th>Équipe</th>
            <th>Statut</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Durée</th>
          </tr>
        </thead>

        <tbody id="listeEquipes"></tbody>

      </table>

    </div>

    <div id="aucuneEquipe" class="aucune-equipe">
      Aucune équipe n’a encore rejoint cette session.
    </div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase.js"></script>

<script>
const parametres =
  new URLSearchParams(
    window.location.search
  );

const code =
  parametres.get("code");

const cleGestion =
  parametres.get("cle");

const resume =
  document.getElementById("resume");

const tableauEquipes =
  document.getElementById("tableauEquipes");

const aucuneEquipe =
  document.getElementById("aucuneEquipe");

const boutonActualiser =
  document.getElementById("boutonActualiser");

const boutonCompteRendu =
  document.getElementById("boutonCompteRendu");

const message =
  document.getElementById("message");

function afficherDate(dateBrute){

  if(!dateBrute){
    return "—";
  }

  const date =
    new Date(
      dateBrute + "T12:00:00"
    );

  return date.toLocaleDateString(
    "fr-FR",
    {
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  );

}

function afficherHeure(dateBrute){

  if(!dateBrute){
    return "—";
  }

  return new Date(
    dateBrute
  ).toLocaleTimeString(
    "fr-FR",
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}

function afficherDuree(secondes){

  if(
    secondes === null ||
    secondes === undefined
  ){
    return "—";
  }

  const total =
    Number(secondes);

  const heures =
    Math.floor(total / 3600);

  const minutes =
    Math.floor(
      (total % 3600) / 60
    );

  const reste =
    total % 60;

  if(heures > 0){
    return (
      heures + " h " +
      String(minutes).padStart(2,"0") +
      " min"
    );
  }

  return (
    minutes + " min " +
    String(reste).padStart(2,"0") +
    " s"
  );

}

function preparerLienCompteRendu(){

  if(
    !code ||
    !cleGestion
  ){
    return;
  }

  const adresse =
    new URL(
      "compte-rendu.html",
      window.location.href
    );

  adresse.searchParams.set(
    "code",
    code
  );

  adresse.searchParams.set(
    "cle",
    cleGestion
  );

  boutonCompteRendu.href =
    adresse.toString();

}

async function chargerSession(){

  message.textContent = "";
  message.className = "message";

  document
    .getElementById("listeEquipes")
    .innerHTML = "";

  aucuneEquipe.classList.remove(
    "visible"
  );

  if(
    !code ||
    !cleGestion
  ){

    message.className =
      "message erreur";

    message.textContent =
      "Le lien de suivi est incomplet.";

    tableauEquipes.style.display =
      "none";

    return;

  }

  boutonActualiser.disabled = true;

  boutonActualiser.textContent =
    "Actualisation…";

  try{

    const donnees =
      await window.REBOND_DB.chargerSuivi({
        code,
        cleGestion
      });

    if(
      !donnees ||
      donnees.length === 0
    ){
      throw new Error(
        "Aucune donnée de session reçue."
      );
    }

    const session =
      donnees[0];

    document
      .getElementById("nomEcole")
      .textContent =
        session.school_name || "Établissement";

    document
      .getElementById("nomClasse")
      .textContent =
        session.class_name || "—";

    document
      .getElementById("nomEnseignant")
      .textContent =
        session.teacher_name || "—";

    document
      .getElementById("nombreEleves")
      .textContent =
        session.student_count ?? "—";

    document
      .getElementById("dateSession")
      .textContent =
        afficherDate(
          session.session_date
        );

    document
      .getElementById("codeSession")
      .textContent =
        code;

    const equipes =
      donnees.filter(
        function(ligne){
          return Boolean(
            ligne.team_name
          );
        }
      );

    const terminees =
      equipes.filter(
        function(equipe){
          return equipe.completed === true;
        }
      );

    const durees =
      terminees
        .map(
          function(equipe){
            return equipe.duration_seconds;
          }
        )
        .filter(
          function(duree){
            return (
              duree !== null &&
              duree !== undefined
            );
          }
        );

    const moyenne =
      durees.length
        ? Math.round(
            durees.reduce(
              function(total,duree){
                return total + Number(duree);
              },
              0
            ) / durees.length
          )
        : null;

    document
      .getElementById("nombreEquipes")
      .textContent =
        equipes.length;

    document
      .getElementById("nombreTerminees")
      .textContent =
        terminees.length;

    document
      .getElementById("tempsMoyen")
      .textContent =
        moyenne === null
          ? "—"
          : afficherDuree(moyenne);

    resume.classList.add(
      "visible"
    );

    if(equipes.length === 0){

      tableauEquipes.style.display =
        "none";

      aucuneEquipe.classList.add(
        "visible"
      );

    }
    else{

      tableauEquipes.style.display =
        "table";

      const listeEquipes =
        document.getElementById(
          "listeEquipes"
        );

      equipes.forEach(
        function(equipe){

          const ligne =
            document.createElement("tr");

          ligne.innerHTML = `
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          `;

          ligne.children[0].textContent =
            equipe.team_name;

          ligne.children[1].textContent =
            equipe.completed
              ? "Terminée ✓"
              : "En cours";

          ligne.children[1].className =
            equipe.completed
              ? "statut terminee"
              : "statut encours";

          ligne.children[2].textContent =
            afficherHeure(
              equipe.started_at
            );

          ligne.children[3].textContent =
            afficherHeure(
              equipe.completed_at
            );

          ligne.children[4].textContent =
            afficherDuree(
              equipe.duration_seconds
            );

          listeEquipes.appendChild(
            ligne
          );

        }
      );

    }

    message.className =
      "message succes";

    message.textContent =
      "Le suivi a été actualisé.";

  }
  catch(error){

    console.error(error);

    resume.classList.remove(
      "visible"
    );

    tableauEquipes.style.display =
      "none";

    message.className =
      "message erreur";

    message.textContent =
      error.message ||
      "Impossible de charger cette session.";

  }
  finally{

    boutonActualiser.disabled = false;

    boutonActualiser.textContent =
      "Actualiser le suivi";

  }

}

boutonActualiser.addEventListener(
  "click",
  chargerSession
);

preparerLienCompteRendu();
chargerSession();
</script>

</body>
</html>
