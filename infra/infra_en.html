  <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mosaïque Infra — Auto-scale plein écran Digiforma</title>
<style>
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:url("https://avantpost-cpu.github.io/depot-quiz/consequences/livre/fon.jpg") center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .wrapper{
    transform-origin:center center;
    transition:transform .3s ease;
  }

  .mosaic{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    flex-wrap:nowrap;
    gap:0;
    width:1600px; /* taille de référence avant auto-scale */
    height:auto;
  }

  .col{
    display:flex;
    flex-direction:column;
    flex:1 1 auto;
    gap:0;
  }

  .col img{
    display:block;
    width:100%;
    height:auto;
  }

  .hoverable{
    position:relative;
    cursor:pointer;
  }

  .hoverable::after{
    content:"";
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity .3s ease;
  }
  .hoverable:hover::after{opacity:1;}

  /* versions b */
  .img1::after  {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/1b_en.png")}
  .img2::after  {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/2b_en.png")}
  .img3::after  {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/3b_en.png")}
  .img4::after  {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/4b_en.png")}
  .img5::after  {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/5b_en.png")}
  .img7::after  {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/7b_en.png")}
  .img8::after  {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/8b_en.png")}
  .img9::after  {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/9b_en.png")}
  .img10::after {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/10b_en.png")}
  .img11::after {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/11b_en.png")}
  .img12::after {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/12b_en.png")}
  .img13::after {background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/13b_en.png")}

  .center{position:relative;}
  .img0{position:relative;}
  .img0::after{
    content:"";
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    transform-origin: bottom center;
  }

  /* hover -> image 0 */
  .mosaic:has(.img1:hover)  .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/1c_en.png");opacity:1;}
  .mosaic:has(.img2:hover)  .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/2c_en.png");opacity:1;}
  .mosaic:has(.img3:hover)  .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/3c_en.png");opacity:1;}
  .mosaic:has(.img4:hover)  .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/4c_en.png");opacity:1;}
  .mosaic:has(.img5:hover)  .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/5c_en.png");opacity:1;}
  .mosaic:has(.img7:hover)  .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/7c_en.png");opacity:1;}
  .mosaic:has(.img8:hover)  .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/8c_en.png");opacity:1;}
  .mosaic:has(.img9:hover)  .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/9c_en.png");opacity:1;}
  .mosaic:has(.img10:hover) .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/10c_en.png");opacity:1;}
  .mosaic:has(.img11:hover) .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/11c_en.png");opacity:1;}
  .mosaic:has(.img12:hover) .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/12c_en.png");opacity:1;}
  .mosaic:has(.img13:hover) .img0::after{background-image:url("https://avantpost-cpu.github.io/depot-quiz/infra/13c_en.png");opacity:1;}

  /* --- Réglages personnalisables --- */
  :root {
    --hover-scale: 1.0;   /* 🔧 Ajuste la taille globale des images “c” */
    --hover-shift: 10px;   /* 🔧 Décale vers le bas */
    --base-scale: 1.07;    /* 🔧 Taille fixe pour l’image 0 */
    --base-shift: 7px;     /* 🔧 Position fixe de l’image 0 */
  }

  /* --- Application sur les images "c" alignées --- */
  .mosaic:has(.img4:hover)  .img0::after,
  .mosaic:has(.img5:hover)  .img0::after,
  .mosaic:has(.img8:hover)  .img0::after,
  .mosaic:has(.img9:hover)  .img0::after,
  .mosaic:has(.img10:hover) .img0::after,
  .mosaic:has(.img11:hover) .img0::after,
  .mosaic:has(.img12:hover) .img0::after,
  .mosaic:has(.img2:hover)  .img0::after {
    transform: translateY(var(--hover-shift)) scale(var(--hover-scale));
  }

  /* --- Réglage permanent pour l’image 0 (quand aucun hover) --- */
  .img0 img {
    display:block;
    width:100%;
    height:auto;
    transform: translateY(var(--base-shift)) scale(var(--base-scale));
    transform-origin: bottom center;
    transition:transform .3s ease;
  }

</style>
</head>
<body>

<div class="wrapper">
  <div class="mosaic">
    <div class="col">
      <div class="hoverable img1"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/1_en.png" alt="1"></div>
      <div class="hoverable img2"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/2_en.png" alt="2"></div>
      <div class="hoverable img3"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/3_en.png" alt="3"></div>
      <div class="hoverable img4"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/4_en.png" alt="4"></div>
      <div class="hoverable img5"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/5_en.png" alt="5"></div>
    </div>

    <div class="col center">
      <img src="https://avantpost-cpu.github.io/depot-quiz/infra/6_en.png" alt="6">
      <div class="img0">
        <img src="https://avantpost-cpu.github.io/depot-quiz/infra/0_en.png" alt="0">
      </div>
    </div>

    <div class="col">
      <div class="hoverable img7"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/7_en.png" alt="7"></div>
      <div class="hoverable img8"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/8_en.png" alt="8"></div>
      <div class="hoverable img9"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/9_en.png" alt="9"></div>
      <div class="hoverable img10"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/10_en.png" alt="10"></div>
      <div class="hoverable img11"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/11_en.png" alt="11"></div>
      <div class="hoverable img12"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/12_en.png" alt="12"></div>
      <div class="hoverable img13"><img src="https://avantpost-cpu.github.io/depot-quiz/infra/13_en.png" alt="13"></div>
    </div>
  </div>
</div>

<script>
function adjustScale(){
  const wrapper = document.querySelector('.wrapper');
  const mosaic = document.querySelector('.mosaic');
  const scaleW = window.innerWidth / mosaic.offsetWidth;
  const scaleH = window.innerHeight / mosaic.offsetHeight;
  const scale = Math.min(scaleW, scaleH) * 0.95; // petite marge
  wrapper.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', adjustScale);
window.addEventListener('load', adjustScale);
</script>

</body>
</html>
    
  </body>
  
</html>
