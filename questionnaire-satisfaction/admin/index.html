<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rebond — Satisfaction admin</title><style>*{box-sizing:border-box}body{margin:0;background:#065269;font-family:Arial,sans-serif;color:#123}.w{max-width:1100px;margin:auto;padding:32px 16px}h1{color:#fff}.box{background:#fff;border-radius:20px;padding:22px;margin:14px 0}.row{display:grid;grid-template-columns:2fr 1fr 2fr auto;gap:10px}input,button{padding:12px;border-radius:10px;border:1px solid #ccd;font:inherit}button{background:#edb01a;color:#065269;font-weight:bold;cursor:pointer}.session{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid #eee;padding:16px 0}.muted{color:#678;font-size:13px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stat{background:#eef5f4;padding:10px 14px;border-radius:12px;font-weight:bold}.link{word-break:break-all;color:#065269}.login{max-width:520px;margin:80px auto}@media(max-width:700px){.row{grid-template-columns:1fr}.session{grid-template-columns:1fr}}</style></head><body><main class="w"><section id="login" class="box login"><h2>Administration Rebond</h2><p>Connectez-vous avec le compte administrateur Supabase.</p><input id="email" type="email" placeholder="Adresse e-mail"><input id="password" type="password" placeholder="Mot de passe"><button id="connect">Se connecter</button><p id="lm"></p></section><div id="app" hidden><h1>Satisfaction — Sensibilisation adultes</h1><section class="box"><h2>Créer une session</h2><div class="row"><input id="event" placeholder="Nom de l'événement"><input id="date" type="date"><input id="place" placeholder="Lieu"><button id="create" type="button">Créer</button></div><p id="cm"></p></section><section class="box"><h2>Mes sessions</h2><div id="sessions">Chargement…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../escapegame_digital/js/config.js"></script><script>
const c=window.supabase.createClient(window.REBOND_CONFIG.supabaseUrl,window.REBOND_CONFIG.supabaseKey),login=document.querySelector("#login"),app=document.querySelector("#app");
const emailEl=document.querySelector("#email"),passwordEl=document.querySelector("#password"),lmEl=document.querySelector("#lm"),eventEl=document.querySelector("#event"),dateEl=document.querySelector("#date"),placeEl=document.querySelector("#place"),cmEl=document.querySelector("#cm"),sessionsEl=document.querySelector("#sessions");
async function boot(){let {data:{session}}=await c.auth.getSession();if(session){login.hidden=true;app.hidden=false;load()}}
document.querySelector("#connect").onclick=async()=>{let {error}=await c.auth.signInWithPassword({email:emailEl.value,password:passwordEl.value});if(error){lmEl.textContent=error.message}else boot()};
function code(){return "SAT-"+Math.random().toString(36).slice(2,7).toUpperCase()}
document.querySelector("#create").addEventListener("click",async()=>{cmEl.textContent="Création en cours…";if(!eventEl.value.trim()||!dateEl.value){cmEl.textContent="Nom et date obligatoires.";return}try{const {error}=await c.from("satisfaction_sessions").insert({code:code(),event_name:eventEl.value.trim(),event_date:dateEl.value,event_place:placeEl.value.trim()});if(error){cmEl.textContent="Erreur Supabase : "+error.message;return}cmEl.textContent="Session créée.";eventEl.value="";dateEl.value="";placeEl.value="";await load()}catch(e){cmEl.textContent="Erreur : "+(e?.message||e)}});
async function load(){let {data:s,error}=await c.from("satisfaction_sessions").select("*,satisfaction_responses(id,satisfaction,newsletter)").order("event_date",{ascending:false});if(error){sessionsEl.textContent=error.message;return}sessionsEl.innerHTML=s.map(x=>{let r=x.satisfaction_responses||[],avg=r.length?(r.reduce((a,b)=>a+Number(b.satisfaction||0),0)/r.length).toFixed(1):"—",news=r.filter(y=>y.newsletter==="Oui").length,url=location.origin+location.pathname.replace(/admin\/?$/,"")+"?session="+x.code;return `<article class="session"><div><strong>${x.event_name}</strong> <span class="muted">• ${new Date(x.event_date+"T12:00").toLocaleDateString("fr-FR")} ${x.event_place?"• "+x.event_place:""}</span><div class="stats"><span class="stat">${r.length} réponse(s)</span><span class="stat">Satisfaction ${avg}/5</span><span class="stat">${news} newsletter</span></div><div class="link">${url}</div></div><button onclick="navigator.clipboard.writeText('${url}')">Copier le lien</button></article>`}).join("")||"Aucune session."}
boot();</script></body></html>
