<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebond — Résultats satisfaction</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#065269;font-family:Arial,sans-serif;color:#123}.w{max-width:1100px;margin:auto;padding:28px 16px}h1{color:#fff}.box{background:#fff;border-radius:20px;padding:22px;margin:14px 0}button{padding:11px 14px;border:0;border-radius:10px;background:#e65013;color:#fff;font-weight:bold;cursor:pointer}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{background:#eef5f4;padding:14px;border-radius:12px;min-width:145px}.kpi b{display:block;font-size:26px;color:#065269}.sec{border-top:1px solid #ddd;margin-top:22px;padding-top:18px}.bar{display:grid;grid-template-columns:2fr 3fr 55px;gap:9px;align-items:center;margin:8px 0}.track{height:14px;background:#e8eeee;border-radius:20px;overflow:hidden}.fill{height:100%;background:#e65013}.answer{background:#f7f7f4;padding:12px;border-radius:10px;margin:8px 0}.person{border:1px solid #dde5e5;border-radius:12px;padding:12px;margin:9px 0}.person summary{font-weight:bold;cursor:pointer;color:#065269}.person p{line-height:1.55}.empty{color:#789;font-style:italic}@media(max-width:650px){.bar{grid-template-columns:1fr 2fr 45px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="w"><h1>Satisfaction — Résultats</h1><section class="box"><div class="top"><button onclick="location.href='./'">← Mes sessions</button><button id="csv">Exporter CSV</button></div><h2 id="title">Chargement…</h2><div id="body"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../escapegame_digital/js/config.js"></script><script>
const c=window.supabase.createClient(window.REBOND_CONFIG.supabaseUrl,window.REBOND_CONFIG.supabaseKey);
const id=new URLSearchParams(location.search).get("id");let rows=[],sess=null;
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const pct=(n,d)=>d?Math.round(n*100/d):0;
function bar(label,count,total){let p=pct(count,total);return '<div class="bar"><span>'+esc(label)+'</span><div class="track"><div class="fill" style="width:'+p+'%"></div></div><b>'+p+'%</b></div>'}
const topics=["Types de violences","Signaux d’alerte","Procédures de signalement","Obligations légales","Outils de prévention"];
const keys=[["types de violences"],["signaux"],["procédures","procedures"],["obligations"],["outils de prévention","outils de prevention"]];
function has(a,i){return (a||[]).some(v=>keys[i].some(k=>String(v).toLowerCase().includes(k)))}
function dist(field,opts){return opts.map(o=>bar(o,rows.filter(x=>x[field]===o).length,rows.length)).join("")}
async function init(){let auth=await c.auth.getSession();if(!auth.data.session){location.href="./";return}let a=await c.from("satisfaction_sessions").select("*").eq("id",id).single();let b=await c.from("satisfaction_responses").select("*").eq("session_id",id).order("created_at");if(a.error||b.error){document.querySelector("#title").textContent="Impossible de charger les résultats";return}sess=a.data;rows=b.data||[];document.querySelector("#title").textContent=sess.event_name+" — "+new Date(sess.event_date+"T12:00").toLocaleDateString("fr-FR");render()}
function render(){let n=rows.length,avg=n?(rows.reduce((a,x)=>a+Number(x.satisfaction||0),0)/n).toFixed(1):"—",news=rows.filter(x=>x.newsletter==="Oui").length;let o='<div class="kpis"><div class="kpi"><b>'+n+'</b>participants</div><div class="kpi"><b>'+avg+'/5</b>satisfaction</div><div class="kpi"><b>'+news+'</b>newsletter</div><div class="kpi"><b>'+pct(rows.filter(x=>String(x.equipped).startsWith("Oui")).length,n)+'%</b>mieux outillés</div></div>';
o+='<div class="sec"><h3>Avant / Après</h3><h4>Connaissance avant</h4>'+topics.map((t,i)=>bar(t,rows.filter(x=>has(x.before,i)).length,n)).join("")+'<h4>Maîtrise après</h4>'+topics.map((t,i)=>bar(t,rows.filter(x=>has(x.after,i)).length,n)).join("")+'</div>';
o+='<div class="sec"><h3>Évaluations</h3><h4>Contenu adapté</h4>'+dist("adapted",["Oui, tout à fait","Plutôt","Peu adapté","Pas du tout"])+'<h4>Qualité</h4>'+dist("quality",["Excellente","Bonne","Moyenne","À améliorer"])+'<h4>Mieux outillé</h4>'+dist("equipped",["Oui, tout à fait","Oui, plutôt","Non, pas vraiment","Non, pas du tout"])+'<h4>Vécu émotionnel</h4>'+dist("emotion",["Très touché(e)","Concerné(e)","Intéressé(e) mais ne me sens pas concerné(e)","Pas concerné(e)"])+'</div>';
let contacts=rows.filter(x=>x.newsletter==="Oui");o+='<div class="sec"><h3>Contacts newsletter</h3>'+(contacts.map(x=>'<div class="answer"><b>'+esc(x.name)+'</b> — '+esc(x.email||"E-mail non renseigné")+'</div>').join("")||'<p class="empty">Aucun contact.</p>')+'</div>';
let fs=[["learned","Éléments marquants / appris"],["changes","Pratiques ou attitudes à modifier"],["useful","Aspects les plus utiles"],["improve","Aspects à améliorer"],["remarks","Autres remarques"]];o+='<div class="sec"><h3>Réponses rédigées</h3>'+fs.map(f=>'<h4>'+f[1]+'</h4>'+(rows.filter(x=>x[f[0]]).map(x=>'<div class="answer"><b>'+esc(x.name)+'</b><br>'+esc(x[f[0]])+'</div>').join("")||'<p class="empty">Aucune réponse.</p>')).join("")+'</div>';
o+='<div class="sec"><h3>Détail par participant</h3>'+(rows.map(x=>'<details class="person"><summary>'+esc(x.name)+' — '+esc(x.job)+'</summary><p><b>E-mail :</b> '+esc(x.email||"—")+'<br><b>Newsletter :</b> '+esc(x.newsletter)+'<br><b>Avant :</b> '+esc((x.before||[]).join(" • "))+'<br><b>Après :</b> '+esc((x.after||[]).join(" • "))+'<br><b>À approfondir :</b> '+esc((x.deepen||[]).join(" • "))+'<br><b>Contenu adapté :</b> '+esc(x.adapted)+'<br><b>Qualité :</b> '+esc(x.quality)+'<br><b>Mieux outillé :</b> '+esc(x.equipped)+'<br><b>Vécu :</b> '+esc(x.emotion)+'<br><b>Satisfaction :</b> '+esc(x.satisfaction)+'/5<br><b>Éléments marquants :</b> '+esc(x.learned)+'<br><b>Changements :</b> '+esc(x.changes)+'<br><b>Utile :</b> '+esc(x.useful)+'<br><b>À améliorer :</b> '+esc(x.improve)+'<br><b>Remarques :</b> '+esc(x.remarks||"—")+'</p></details>').join("")||'<p class="empty">Aucune réponse.</p>')+'</div>';document.querySelector("#body").innerHTML=o}
document.querySelector("#csv").onclick=()=>{if(!rows.length)return;let cols=["name","job","newsletter","email","before","after","deepen","learned","adapted","quality","equipped","changes","emotion","useful","improve","satisfaction","remarks","created_at"];let q=v=>'"'+String(Array.isArray(v)?v.join(" | "):(v??"")).replaceAll('"','""')+'"';let csv="\uFEFF"+[cols.join(";"),...rows.map(r=>cols.map(k=>q(r[k])).join(";"))].join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="satisfaction-"+(sess?.event_date||"session")+".csv";a.click()};init();
</script></body></html>
